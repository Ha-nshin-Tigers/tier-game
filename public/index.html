<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなでティア表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上部=ラウンド/親/タイマー、左=フェーズごとの盤面、右=プレイヤーと得点、下=お題コレクション */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4;
  --tier-ink: #181b23;
  --tS: #ff7f7f; --tA: #ffbf7f; --tB: #ffdf7f; --tC: #bfff7f; --tD: #7fbfff;
  --card-bg: #f3f4fa; --card-ink: #181b23;
  --good: #1f8a4c; --near: #b07400; --bad: #c4323a;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947;
    --accent: #8f9cff; --tS: #e86f6f; --tA: #e8a565; --tB: #e3c45e; --tC: #9fd860; --tD: #66a6e3;
    --card-bg: #2a2e3b; --card-ink: #eceef4; --good: #5fd28f; --near: #f0b84a; --bad: #ff7b82; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--fg); font-size: 13px; font-weight: 700; background: var(--surface); }
.timer { font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.timer.low { color: var(--bad); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.topic { font-family: var(--display); font-size: clamp(20px, 4vw, 26px); line-height: 1.3; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }
.status.warn { color: var(--bad); }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.banner { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--fg); color: var(--surface); font-size: 13px; font-weight: 700; text-align: center; z-index: 10; }

/* 入室画面 */
.login { max-width: 460px; margin: 6vh auto 0; }
.login .panel { gap: 16px; }
.or { text-align: center; font-size: 12px; color: var(--muted); }
.code { font-family: var(--display); letter-spacing: .15em; text-transform: uppercase; }

/* ティア盤 */
.board { border: 2px solid var(--fg); border-radius: 6px; overflow: hidden; }
.row { display: grid; grid-template-columns: 64px 1fr; min-height: 66px; }
.row + .row { border-top: 2px solid var(--fg); }
.label { display: grid; place-items: center; font-family: var(--display); font-size: 28px; color: var(--tier-ink); border-right: 2px solid var(--fg); }
.zone { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px; align-items: center; min-width: 0; transition: background .12s; }
.editable .zone { cursor: pointer; }
.zone.over, .editable.picking .zone:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.pool { border: 2px dashed var(--line); border-radius: 6px; min-height: 66px; }
.pool:empty::after { content: "全部置けました"; color: var(--muted); font-size: 13px; padding: 4px; }
.card { display: inline-flex; align-items: center; min-height: 48px; padding: 6px 14px; border-radius: 4px; font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--card-ink); background: var(--card-bg); border: 2px solid var(--line); user-select: none; -webkit-user-select: none; word-break: break-word; max-width: 100%; }
.editable .card { cursor: grab; }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

/* 結果表 */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
td.t { font-family: var(--display); font-size: 16px; }
.ok { color: var(--good); font-weight: 700; } .nr { color: var(--near); font-weight: 700; } .ng { color: var(--bad); }
tfoot td { font-weight: 700; border-bottom: none; font-variant-numeric: tabular-nums; }

/* プレイヤー */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.players li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.players li:last-child { border-bottom: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); justify-self: center; }
.dot.on { background: var(--good); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; }
.pts { font-family: var(--display); font-variant-numeric: tabular-nums; }
.done { color: var(--good); font-size: 12px; font-weight: 700; margin-left: 6px; }
.invite { display: flex; gap: 6px; }
.winner { font-family: var(--display); font-size: clamp(22px, 5vw, 32px); line-height: 1.3; padding: 14px 16px; border: 2px solid var(--fg); border-radius: 6px; background: var(--tS); color: var(--tier-ink); overflow-wrap: anywhere; }
.final { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.final li { display: grid; grid-template-columns: 3.5em 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 16px; }
.final li.first { border: 2px solid var(--fg); background: color-mix(in srgb, var(--tS) 35%, var(--surface)); }
.final .place { font-family: var(--display); }
.invite input { font-size: 13px; }

/* 入力・ボタン */
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 4px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { background: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); border-color: var(--bad); }
input[type=text], textarea { font-family: var(--body); font-size: 16px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
textarea { resize: vertical; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

/* お題コレクション */
.tlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.tlist li { border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.tlist .thead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tlist .tname { font-weight: 700; overflow-wrap: anywhere; }
.tlist .twords { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tlist .tby { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tlist button { padding: 2px 8px; font-size: 12px; justify-self: start; }
.tform { display: grid; gap: 10px; border-top: 1.5px solid var(--line); padding-top: 14px; }
@media (max-width: 520px) {
  .row { grid-template-columns: 48px 1fr; min-height: 58px; }
  .label { font-size: 22px; }
  .card { min-height: 42px; font-size: 14px; padding: 4px 10px; }
}
@media (prefers-reduced-motion: reduce) { .zone { transition: none; } }
</style>
</head>
<body>
<div class="banner" id="banner" hidden></div>

<!-- 入室画面 -->
<div class="login" id="login">
  <div class="wrap">
    <div>
      <div class="eyebrow">親の価値観を読み当てるティア表ゲーム</div>
      <h1>みんなでティア表</h1>
    </div>
    <form class="panel" id="loginForm">
      <label class="field">ニックネーム<input type="text" id="lName" maxlength="12" autocomplete="nickname" placeholder="例: たろう"></label>
      <label class="field">部屋コード(友達から聞いたコード)<input type="text" id="lRoom" class="code" maxlength="6" autocomplete="off" placeholder="ABCD"></label>
      <div class="btns"><button class="primary" type="submit" id="lJoin">この部屋に入る</button></div>
      <div class="or">または</div>
      <div class="btns"><button type="button" id="lCreate">新しい部屋を作る</button><span class="muted small">部屋コードが自動で決まります</span></div>
      <p class="status" id="lMsg" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- ゲーム画面 -->
<div class="wrap" id="game" hidden>
  <div class="top">
    <div>
      <div class="eyebrow">親の価値観を読み当てるティア表ゲーム</div>
      <h1>みんなでティア表</h1>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="layout">
    <main class="panel" id="main"></main>
    <aside class="panel" id="side"></aside>
  </div>
  <section class="panel" id="topicsPanel">
    <div class="top"><h2>お題コレクション</h2><span class="status" id="topicCount"></span></div>
    <p class="muted small">ここにあるお題が、ランダム出題と「お題を選び直す」に使われます。みんなが保存したお題は、ほかの部屋でも使えます。</p>
    <ul class="tlist" id="topicList"></ul>
    <form id="topicForm" class="tform">
      <h2>お題を追加</h2>
      <label class="field">お題<input type="text" id="tName" maxlength="20" placeholder="例: 行ってみたい国" autocomplete="off"></label>
      <label class="field">ワード(5〜30個。改行かカンマで区切る)<textarea id="tWords" rows="4" placeholder="ハワイ、フランス、エジプト、アイスランド、ペルー"></textarea></label>
      <div class="btns"><button class="primary" type="submit" id="tSave">お題を保存</button><span class="status" id="tMsg" aria-live="polite"></span></div>
    </form>
  </section>
</div>

<script>
const TIERS = ["S", "A", "B", "C", "D"];
const PTS_EXACT = 3, PTS_NEAR = 1, PTS_PERFECT = 5;
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};

// ---- 端末ごとの保存(名前・前回の部屋・本人確認用ID) ----
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("tier:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("tier:" + k, JSON.stringify(v)); } catch {} },
};
function rnd(n, chars = "abcdefghijklmnopqrstuvwxyz0123456789") {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map((x) => chars[x % chars.length]).join("");
}
let ident = store.get("ident");
if (!ident || !ident.pid || !ident.token) { ident = { pid: rnd(16), token: rnd(32) }; store.set("ident", ident); }

// ---- 通信 ----
let ws = null, retry = 0, everOpen = false;
let wantRoom = null, myName = "", joined = false;
let S = null, me = null, offset = 0;
let builtin = {}, topics = [];
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  const slow = setTimeout(() => showBanner("サーバを起動しています。初回は1分ほどかかることがあります…"), 2500);
  ws.onopen = () => {
    clearTimeout(slow); retry = 0; everOpen = true; showBanner("");
    if (wantRoom) send({ t: "join", room: wantRoom, name: myName, pid: ident.pid, token: ident.token });
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "joined") {
      joined = true; store.set("last", { room: m.room, name: myName });
      history.replaceState(null, "", "?room=" + m.room);
      $("login").hidden = true; $("game").hidden = false;
    } else if (m.t === "state") {
      S = m.room; me = m.me; offset = m.now - Date.now(); render();
    } else if (m.t === "topics") {
      builtin = m.builtin || {}; topics = Array.isArray(m.list) ? m.list : []; if (joined) render();
    } else if (m.t === "error") {
      if (!joined) { $("lMsg").textContent = m.msg; $("lMsg").classList.add("warn"); wantRoom = null; setLoginBusy(false); }
      else { flash(m.msg, true); if (pendingTopic) { $("tMsg").textContent = m.msg; pendingTopic = false; } }
    } else if (m.t === "info") {
      flash(m.msg); if (pendingTopic) { $("tMsg").textContent = m.msg; pendingTopic = false; $("tName").value = ""; $("tWords").value = ""; }
    }
  };
  ws.onclose = () => {
    clearTimeout(slow);
    if (joined || wantRoom) showBanner(everOpen ? "接続が切れました。再接続しています…" : "サーバに接続しています…");
    setTimeout(connect, Math.min(8000, 800 * 2 ** retry++));
  };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function showBanner(t) { $("banner").textContent = t; $("banner").hidden = !t; }
let flashMsg = "", flashWarn = false, flashT;
function flash(msg, warn) { flashMsg = msg; flashWarn = !!warn; clearTimeout(flashT); flashT = setTimeout(() => { flashMsg = ""; render(); }, 6000); render(); }

// ---- 入室 ----
function setLoginBusy(b) { $("lJoin").disabled = b; $("lCreate").disabled = b; }
function enter(code) {
  const name = $("lName").value.trim().slice(0, 12);
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  const msg = $("lMsg"); msg.classList.add("warn");
  if (!name) { msg.textContent = "ニックネームを入れてください"; return; }
  if (code.length < 4) { msg.textContent = "部屋コードは4〜6文字の英数字です"; return; }
  msg.classList.remove("warn"); msg.textContent = "入室しています…";
  myName = name; wantRoom = code; setLoginBusy(true);
  send({ t: "join", room: code, name, pid: ident.pid, token: ident.token });
}
$("loginForm").addEventListener("submit", (e) => { e.preventDefault(); enter($("lRoom").value); });
$("lCreate").addEventListener("click", () => { const c = rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"); $("lRoom").value = c; enter(c); });
{
  const last = store.get("last");
  const q = new URLSearchParams(location.search).get("room");
  if (last?.name) $("lName").value = last.name;
  if (q) $("lRoom").value = q.toUpperCase().slice(0, 6);
  // 同じ部屋に入り直すときは自動で再入室
  if (last?.name && q && last.room === q.toUpperCase()) { myName = last.name; wantRoom = last.room; $("lMsg").textContent = "前回の部屋に戻っています…"; setLoginBusy(true); }
}

// ---- ルール ----
const tierOf = (arr, w) => TIERS.find((t) => arr[t] === w) || null;
const complete = (arr, words) => words.length === 5 && TIERS.every((t) => arr[t] && words.includes(arr[t]));
const allTopicNames = () => [...new Set([...Object.keys(builtin), ...topics.map((t) => t.name)])];
const player = (id) => S?.players.find((p) => p.id === id);
const nameOf = (id) => player(id)?.name || "退出した人";
const remaining = () => Math.max(0, Math.ceil((S.deadline - (Date.now() + offset)) / 1000));

// ---- 手元の並べ替え ----
let local = { pick: null, arr: {}, arrKey: "", dragging: false, lastSent: "", sendT: null, mainStale: false };
function moveWord(arr, w, target) {
  const a = { ...arr }, from = tierOf(a, w);
  if (target === "pool") { if (from) delete a[from]; return a; }
  const to = TIERS.includes(target) ? target : tierOf(a, target);
  if (!to) { if (from) a[from] = target; return a; }   // 未配置の別ワードと入れ替え
  const occ = a[to];
  if (from) delete a[from];
  a[to] = w;
  if (occ && occ !== w && from) a[from] = occ;
  return a;
}
function setArr(a) {
  local.arr = a;
  if (S.phase === "guessing" && S.hostId !== me) {
    clearTimeout(local.sendT);
    local.sendT = setTimeout(() => {
      if (!complete(local.arr, S.words)) return;
      const k = JSON.stringify(local.arr);
      if (k === local.lastSent) return;
      local.lastSent = k; send({ t: "guess", arr: local.arr });
    }, 400);
  }
}
function syncLocalArr() {
  const base = `${S.round}|${S.phase === "ranking" ? "rank" : "guess"}`;
  const key = `${base}|${S.words.join("/")}`;
  if (key === local.arrKey) return;
  const sameBase = local.arrKey.startsWith(base + "|");
  local.arrKey = key; local.pick = null; local.lastSent = "";
  if (sameBase) { const a = {}; for (const t of TIERS) if (S.words.includes(local.arr[t])) a[t] = local.arr[t]; local.arr = a; }
  else local.arr = {};
  if (S.phase === "guessing" && S.myGuess && !sameBase) { local.arr = { ...S.myGuess }; local.lastSent = JSON.stringify(local.arr); }
}
function boardEl(words, arr, editable = false) {
  const wrap = h("div", { class: (editable ? "editable" : "") + (local.pick ? " picking" : ""), style: "display:grid;gap:10px" });
  const card = (w) => {
    const c = h("div", { class: "card" + (editable && local.pick === w ? " sel" : ""), "data-word": w }, w);
    if (editable) { c.tabIndex = 0; c.draggable = true; c.setAttribute("role", "button"); }
    return c;
  };
  const board = h("div", { class: "board" });
  for (const t of TIERS) {
    const zone = h("div", { class: "zone", "data-target": t, "aria-label": t + "ランク" });
    if (arr[t]) zone.append(card(arr[t]));
    board.append(h("div", { class: "row" }, h("div", { class: "label", style: `background:var(--t${t})` }, t), zone));
  }
  wrap.append(board);
  if (!editable) return wrap;
  const pool = h("div", { class: "zone pool", "data-target": "pool", "aria-label": "まだ置いていないワード" });
  for (const w of words) if (!tierOf(arr, w)) pool.append(card(w));
  wrap.append(pool);
  wrap.addEventListener("click", (e) => {
    const c = e.target.closest(".card"), z = e.target.closest(".zone");
    if (c) {
      const w = c.dataset.word;
      if (!local.pick) local.pick = w;
      else if (local.pick === w) local.pick = null;
      else { setArr(moveWord(local.arr, local.pick, w)); local.pick = null; }
    } else if (z && local.pick) { setArr(moveWord(local.arr, local.pick, z.dataset.target)); local.pick = null; }
    render();
  });
  wrap.addEventListener("keydown", (e) => {
    const c = e.target.closest(".card");
    if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); c.click(); return; }
    const k = e.key.toUpperCase();
    if (local.pick && TIERS.includes(k)) { setArr(moveWord(local.arr, local.pick, k)); local.pick = null; render(); }
  });
  wrap.addEventListener("dragstart", (e) => {
    const c = e.target.closest(".card"); if (!c) return;
    local.dragging = true; local.pick = c.dataset.word; c.classList.add("sel");
    e.dataTransfer.setData("text/plain", c.dataset.word); e.dataTransfer.effectAllowed = "move";
  });
  wrap.addEventListener("dragover", (e) => {
    const z = e.target.closest(".zone"); if (!z) return; e.preventDefault();
    wrap.querySelectorAll(".zone.over").forEach((x) => x !== z && x.classList.remove("over")); z.classList.add("over");
  });
  wrap.addEventListener("drop", (e) => {
    const z = e.target.closest(".zone"); if (!z) return; e.preventDefault();
    const w = e.dataTransfer.getData("text/plain") || local.pick;
    const c = e.target.closest(".card");
    local.dragging = false; local.pick = null;
    setArr(moveWord(local.arr, w, c && c.dataset.word !== w ? c.dataset.word : z.dataset.target));
    render();
  });
  wrap.addEventListener("dragend", () => { local.dragging = false; local.pick = null; render(); });
  return wrap;
}

// ---- 画面 ----
function render() {
  if (!S || local.dragging) return;
  syncLocalArr();
  renderMeta(); renderSide(); renderTopics();
  // 入力欄を編集中に作り直すと入力が消えるので、その間は盤面を描き直さない
  const ae = document.activeElement;
  if (ae && $("main").contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "SELECT")) { local.mainStale = true; return; }
  local.mainStale = false;
  renderMain();
}
document.addEventListener("focusout", () => setTimeout(() => { if (local.mainStale) render(); }, 0));

function renderMeta() {
  const m = $("meta"); m.replaceChildren();
  const label = { lobby: "待機中", ranking: "親が並べ中", guessing: "予想タイム", reveal: "答え合わせ", finished: "ゲーム終了" }[S.phase] || "";
  m.append(h("span", { class: "pill code" }, "部屋 " + S.code));
  if (S.goal) m.append(h("span", { class: "pill" }, `${S.goal}点で優勝`));
  if (S.round) m.append(h("span", { class: "pill" }, `ラウンド ${S.round}`));
  m.append(h("span", { class: "pill" }, label));
  if (S.hostId && S.phase !== "lobby") m.append(h("span", { class: "pill" }, "親: " + nameOf(S.hostId)));
  if (S.phase === "guessing") m.append(h("span", { class: "timer", id: "timer" }, remaining() + "秒"));
}

function renderSide() {
  const side = $("side"); side.replaceChildren();
  side.append(h("h2", {}, "プレイヤー"));
  const ul = h("ul", { class: "players" });
  for (const p of [...S.players].sort((a, b) => b.score - a.score)) {
    const nm = h("span", { class: "pname" }, p.name + (p.id === me ? "(あなた)" : ""));
    if (p.id === S.hostId && S.phase !== "lobby") nm.append(h("span", { class: "tag" }, "親"));
    if (p.submitted) nm.append(h("span", { class: "done" }, "提出済"));
    ul.append(h("li", {}, h("span", { class: "dot" + (p.connected ? " on" : ""), title: p.connected ? "接続中" : "切断中" }), nm, h("span", { class: "pts" }, p.score + "点")));
  }
  side.append(ul);
  const link = location.origin + "/?room=" + S.code;
  const inp = h("input", { type: "text", id: "inviteLink", value: link, readonly: true, "aria-label": "招待リンク", onfocus: (e) => e.target.select() });
  side.append(h("div", { class: "field" }, "招待リンク(友達に送る)",
    h("div", { class: "invite" }, inp, h("button", { type: "button", class: "ghost", onclick: (e) => {
      const b = e.currentTarget;
      navigator.clipboard?.writeText(link).then(() => { b.textContent = "コピー済"; setTimeout(() => (b.textContent = "コピー"), 1500); }).catch(() => inp.select());
    } }, "コピー"))));
  side.append(h("p", { class: "muted small" }, `得点: 段がぴったり ${PTS_EXACT}点 / 1段ずれ ${PTS_NEAR}点 / 5つ全部ぴったりでボーナス ${PTS_PERFECT}点`));
  const btns = h("div", { class: "btns" });
  if (S.phase !== "lobby") btns.append(twoStep("ゲームをリセット", () => send({ t: "reset" })));
  btns.append(twoStep("部屋を出る", () => {
    send({ t: "leave" }); joined = false; wantRoom = null; S = null;
    store.set("last", { room: "", name: myName });
    history.replaceState(null, "", "/");
    $("game").hidden = true; $("login").hidden = false; setLoginBusy(false); $("lMsg").textContent = "";
  }));
  side.append(btns);
  if (flashMsg) side.append(h("p", { class: "status" + (flashWarn ? " warn" : "") }, flashMsg));
}
function twoStep(label, action) {
  let armed = false, t;
  const b = h("button", { class: "ghost danger", type: "button" }, label);
  b.onclick = () => {
    if (!armed) { armed = true; b.textContent = "もう一度押すと実行"; t = setTimeout(() => { armed = false; b.textContent = label; }, 3000); return; }
    clearTimeout(t); action();
  };
  return b;
}

function renderMain() {
  const main = $("main"); main.replaceChildren();
  const isHost = S.hostId === me, P = S.phase;
  const live = S.players.filter((p) => p.connected).length;

  if (P === "lobby") {
    main.append(
      h("h2", {}, "遊び方"),
      h("ol", { class: "rules" },
        h("li", {}, "親が5つのワードを、自分の価値観で S〜D に1つずつ並べます。"),
        h("li", {}, "ほかのプレイヤーは制限時間内に、親がどう並べたかを予想します。"),
        h("li", {}, "答え合わせで得点。親は毎ラウンド交代します。")),
      h("label", { class: "field" }, "制限時間",
        h("select", { id: "dur", onchange: (e) => send({ t: "setDuration", sec: +e.target.value }) },
          ...[30, 60, 90, 120].map((s) => h("option", { value: s, selected: S.duration === s }, s + "秒")))),
      h("label", { class: "field" }, "何点取ったら終わり？",
        h("select", { id: "goal", onchange: (e) => send({ t: "setGoal", pts: +e.target.value }) },
          ...[0, 20, 30, 50, 80].map((g) => h("option", { value: g, selected: S.goal === g }, g ? `${g}点で優勝` : "決めない(好きなだけ遊ぶ)")))),
      h("div", { class: "btns" },
        h("button", { class: "primary", type: "button", disabled: live < 2, onclick: () => send({ t: "start" }) }, "ゲーム開始(自分が最初の親)"),
        h("span", { class: "muted small" }, live < 2 ? "右の招待リンクを友達に送ってください。2人以上でスタートできます" : `${live}人で開始できます`)));
    return;
  }

  main.append(h("div", { class: "topic" }, "お題: " + (S.topic || "(未設定)")));

  if (P === "ranking") {
    if (!isHost) {
      main.append(h("p", {}, `${nameOf(S.hostId)} さんが並べています。今回のワード:`),
        h("div", { class: "btns" }, ...S.words.map((w) => h("span", { class: "card" }, w))),
        h("p", { class: "muted small" }, "親が決定すると予想タイムが始まります。"));
      if (!player(S.hostId)?.connected)
        main.append(h("div", { class: "btns" }, h("span", { class: "muted small" }, "親の接続が切れています:"),
          h("button", { class: "ghost", type: "button", onclick: () => send({ t: "skip" }) }, "このラウンドを飛ばす")));
      return;
    }
    main.append(h("p", {}, "あなたが親です。自分の本音で、5つを S〜D に1つずつ置いてください。ほかの人には答え合わせまで見えません。"));
    const words = h("div", { class: "words" });
    S.words.forEach((w, i) => words.append(h("input", { type: "text", id: "w" + i, value: w, maxlength: 16, "aria-label": `ワード${i + 1}`,
      onchange: (e) => { const v = e.target.value.trim().slice(0, 16); if (!v || S.words.includes(v)) { e.target.value = w; return; } send({ t: "editWord", i, w: v }); } })));
    main.append(
      h("label", { class: "field" }, "お題",
        h("input", { type: "text", id: "topic", value: S.topic, maxlength: 30, onchange: (e) => send({ t: "editTopic", text: e.target.value }) })),
      h("div", { class: "field" }, "ワード(書き換えOK・重複不可)", words),
      h("div", { class: "btns" },
        h("select", { id: "cat", "aria-label": "お題を選ぶ", onchange: (e) => { send({ t: "pickTopic", name: e.target.value }); e.target.blur(); } },
          h("option", { value: "", selected: true, disabled: true }, "お題を選び直す"), ...allTopicNames().map((k) => h("option", { value: k }, k))),
        h("button", { class: "ghost", type: "button", onclick: () => send({ t: "reroll" }) }, "ワードを引き直す")),
      boardEl(S.words, local.arr, true),
      h("div", { class: "btns" }, h("button", { class: "primary", type: "button", disabled: !complete(local.arr, S.words),
        onclick: () => send({ t: "submitAnswer", arr: local.arr }) }, "これで決定して予想スタート")));
    return;
  }

  if (P === "guessing") {
    const gs = S.players.filter((p) => p.id !== S.hostId && p.connected), doneN = gs.filter((p) => p.submitted).length;
    if (isHost) {
      main.append(h("p", {}, `みんなが予想中です(提出 ${doneN}/${gs.length})。全員が提出するか時間切れで自動的に答え合わせになります。`),
        h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "revealNow" }) }, "今すぐ答え合わせ")));
      return;
    }
    const mine = player(me)?.submitted;
    if (remaining() <= 0) {
      main.append(h("p", {}, mine ? "提出しました。答え合わせを待っています…" : "時間切れ。今回は提出できませんでした。"));
      if (Object.keys(local.arr).length) main.append(boardEl(S.words, local.arr));
      return;
    }
    main.append(h("p", {}, `${nameOf(S.hostId)} さんはどう並べた？ 5つ全部置くと自動で提出されます(締切まで何度でも変更OK)。`),
      boardEl(S.words, local.arr, true),
      h("p", { class: "status" }, mine ? "提出済み。変更すると自動で更新されます。" : complete(local.arr, S.words) ? "提出中…" : "まだ未提出です。"));
    return;
  }

  if (P === "reveal" && S.result) {
    const rd = S.result;
    main.append(h("p", {}, `${rd.hostName} さんの答え`), boardEl(rd.words, rd.answer));
    if (!rd.rows.length) main.append(h("p", { class: "muted" }, "今回は予想した人がいませんでした。"));
    else {
      const tbody = h("tbody");
      for (const t of TIERS) {
        const w = rd.answer[t];
        tbody.append(h("tr", {}, h("td", { class: "t" }, t), h("td", {}, w), ...rd.rows.map((r) => {
          const g = tierOf(r.guess, w);
          const d = g ? Math.abs(TIERS.indexOf(t) - TIERS.indexOf(g)) : 9;
          return h("td", { class: d === 0 ? "ok" : d === 1 ? "nr" : "ng" }, (g || "-") + (d === 0 ? " ◎" : d === 1 ? " ○" : " ×"));
        })));
      }
      main.append(h("div", { class: "tablewrap" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "答え"), h("th", {}, "ワード"), ...rd.rows.map((r) => h("th", {}, r.name)))),
        tbody,
        h("tfoot", {}, h("tr", {}, h("td", {}), h("td", {}, "このラウンド"), ...rd.rows.map((r) => h("td", {}, r.score + "点")))))));
    }
    if (rd.winners?.length) {
      main.append(h("div", { class: "winner" }, rd.winners.map((w) => w.name).join("・") + " さんが " + S.goal + "点に到達！"),
        h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "next" }) }, "最終結果を見る")));
    } else {
      main.append(h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "next" }) }, "次のラウンドへ")));
    }
    return;
  }

  if (P === "finished") {
    const ranked = [...S.players].sort((a, b) => b.score - a.score);
    const winners = S.result?.winners || [];
    main.append(h("div", { class: "eyebrow" }, `${S.round}ラウンドで決着`),
      h("div", { class: "winner" }, "優勝 " + winners.map((w) => w.name).join("・") + " さん"));
    const ol = h("ol", { class: "final" });
    let place = 0, prev = null;
    ranked.forEach((p, i) => {
      if (p.score !== prev) { place = i + 1; prev = p.score; }
      ol.append(h("li", { class: place === 1 ? "first" : "" }, h("span", { class: "place" }, place + "位"),
        h("span", { class: "pname" }, p.name + (p.id === me ? "(あなた)" : "")), h("span", { class: "pts" }, p.score + "点")));
    });
    main.append(ol, h("div", { class: "btns" },
      h("button", { class: "primary", type: "button", onclick: () => send({ t: "reset" }) }, "もう一度遊ぶ(得点をリセット)"),
      h("span", { class: "muted small" }, "待機画面に戻ります。同じメンバーのまま始められます")));
  }
}

// ---- お題コレクション ----
let pendingTopic = false;
function renderTopics() {
  const ul = $("topicList"); ul.replaceChildren();
  $("topicCount").textContent = `標準 ${Object.keys(builtin).length} 件 / みんなのお題 ${topics.length} 件`;
  for (const [name, words] of Object.entries(builtin))
    ul.append(h("li", {}, h("div", { class: "thead" }, h("span", { class: "tname" }, name), h("span", { class: "tby" }, "標準")),
      h("div", { class: "twords" }, words.join("・"))));
  for (const t of topics) {
    const li = h("li", {}, h("div", { class: "thead" }, h("span", { class: "tname" }, t.name), h("span", { class: "tby" }, t.byName ? "作: " + t.byName : "")),
      h("div", { class: "twords" }, `${t.words.length}語: ` + t.words.join("・")));
    if (t.mine) li.append(twoStep("削除", () => send({ t: "delTopic", id: t.id })));
    ul.append(li);
  }
}
function parseWords(s) {
  const out = [];
  for (const w of s.split(/[,、，\n]/).map((x) => x.trim().slice(0, 16))) if (w && !out.includes(w)) out.push(w);
  return out;
}
$("tWords").addEventListener("input", () => {
  const n = parseWords($("tWords").value).length;
  $("tMsg").textContent = n ? `${n}個` + (n < 5 ? `(あと${5 - n}個必要)` : n > 30 ? "(30個までです)" : "") : "";
});
$("topicForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("tName").value.trim().slice(0, 20), words = parseWords($("tWords").value);
  const msg = (m) => { $("tMsg").textContent = m; };
  if (!name) return msg("お題の名前を入れてください");
  if (allTopicNames().includes(name)) return msg("同じ名前のお題がもうあります");
  if (words.length < 5) return msg("ワードは5個以上必要です");
  if (words.length > 30) return msg("ワードは30個までです");
  pendingTopic = true; msg("保存しています…");
  send({ t: "addTopic", name, words });
});

// ---- タイマー表示 ----
let wasOver = false;
setInterval(() => {
  if (!S || S.phase !== "guessing") return;
  const r = remaining(), t = $("timer");
  if (t) { t.textContent = r + "秒"; t.classList.toggle("low", r <= 10); }
  if ((r <= 0) !== wasOver) { wasOver = r <= 0; render(); }
}, 250);

connect();
</script>
</body>
</html>
