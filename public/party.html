<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドタバタ大会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上=部屋と進行、中央=ミニゲーム、下=順位(合計点)と招待。スマホ縦向きでミニゲームが1画面に収まるように縦1列 */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4;
  --ink: #181b23; --gold: #f2c14e; --good: #1f8a4c; --bad: #c4323a; --sky: #cfe6ff; --wood: #a0673e;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947; --accent: #8f9cff;
    --good: #5fd28f; --bad: #ff7b82; --sky: #1f2f45; --wood: #8a5632; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(32px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 999px; border: 1.5px solid var(--fg); font-size: 12px; font-weight: 700; background: var(--surface); white-space: nowrap; }
button.pill { cursor: pointer; font-family: var(--body); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }
.status.warn { color: var(--bad); }
.banner { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--fg); color: var(--surface); font-size: 13px; font-weight: 700; text-align: center; z-index: 30; }
a { color: var(--accent); }
/* ゲーム中は見出しを小さくして、ミニゲームの場所を広く取る */
body.playing .top > div:first-child h1 { font-size: 18px; }
body.playing .top > div:first-child .eyebrow { display: none; }

/* 入室画面 */
.login { max-width: 460px; margin: 6vh auto 0; }
.login .panel { gap: 16px; }
.or { text-align: center; font-size: 12px; color: var(--muted); }
.code { font-family: var(--display); letter-spacing: .15em; text-transform: uppercase; }

/* 共通 */
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 6px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { background: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.big { font-size: 17px; padding: 12px 22px; }
button.tiny { padding: 3px 9px; font-size: 12px; }
input[type=text] { font-family: var(--body); font-size: 16px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.say { font-family: var(--display); font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.say.red { color: var(--bad); } .say.good { color: var(--good); }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cd { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.cd.low { color: var(--bad); }
.bar { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.bar span { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #181b23; border: 1.5px solid #181b23; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* ロビーとゲーム紹介 */
.gamecards { display: grid; gap: 8px; }
.gcard { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; }
.gcard .ico { font-size: 34px; text-align: center; }
.gcard .nm { font-weight: 700; }
.gcard .ds { font-size: 13px; color: var(--muted); }
.gcard.off { opacity: .5; border-style: dashed; }
.toggle { border-color: var(--line); color: var(--muted); font-weight: 500; padding: 5px 10px; font-size: 13px; }
.toggle.on { background: var(--gold); border-color: var(--fg); color: var(--ink); font-weight: 700; }
.intro { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.intro .ico { font-size: 72px; line-height: 1; animation: bounce 1s ease-in-out infinite; }
.intro .ttl { font-family: var(--display); font-size: clamp(28px, 7vw, 40px); }
.intro ol { text-align: left; margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 520px; }
@keyframes bounce { 50% { transform: translateY(-8px); } }

/* ひとりじめ橋 */
.canyon { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; padding: 12px; border-radius: 10px;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 55%, #5b3a22 55%, #2b1a0f 100%); }
.bridge { position: relative; display: grid; align-content: space-between; justify-items: center; gap: 6px; min-height: 150px; padding: 8px 4px; border-radius: 6px; border: 2px solid #3a2414;
  background: repeating-linear-gradient(0deg, var(--wood) 0 14px, #6f4426 14px 16px); color: #fff; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.bridge:disabled { cursor: default; opacity: 1; }
.bridge .val { font-family: var(--display); font-size: 22px; text-shadow: 0 2px 0 #000; }
.bridge.mine { box-shadow: 0 0 0 4px var(--accent); transform: translateY(-4px); }
.bridge .who { display: grid; gap: 3px; justify-items: center; width: 100%; }
.bridge .gain { font-family: var(--display); color: var(--gold); text-shadow: 0 2px 0 #000; font-size: 18px; }
.bridge.collapsed { animation: fall 1.1s ease-in forwards; border-color: var(--bad); }
.bridge.collapsed .boomtxt { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-family: var(--display); color: #fff; background: var(--bad); padding: 2px 8px; border-radius: 4px; font-size: 14px; white-space: nowrap; }
@keyframes fall { 0% { transform: none; } 20% { transform: translateX(-3px) rotate(-2deg); } 35% { transform: translateX(3px) rotate(2deg); } 100% { transform: translateY(26px) rotate(6deg); opacity: .55; } }

/* 爆弾回し */
.table { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.seat { position: relative; display: grid; justify-items: center; gap: 4px; padding: 12px 6px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); min-height: 104px; font-weight: 700; overflow: hidden; }
button.seat:not(:disabled):hover { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.seat .face { font-size: 34px; line-height: 1; }
.seat .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.seat.holder { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 40%, transparent); }
.seat.holder .face { animation: shake .25s infinite; }
.seat.out { opacity: .4; }
.seat.me { outline: 2px dashed var(--accent); outline-offset: 2px; }
@keyframes shake { 25% { transform: rotate(-12deg) scale(1.08); } 75% { transform: rotate(12deg) scale(1.08); } }
.hot { padding: 12px; border-radius: 10px; background: var(--bad); color: #fff; font-family: var(--display); font-size: 20px; text-align: center; animation: pulse .6s infinite alternate; }
@keyframes pulse { to { filter: brightness(1.25); } }
.boom { text-align: center; font-family: var(--display); font-size: clamp(28px, 7vw, 44px); color: var(--bad); animation: boom .5s ease-out; }
.boom .big { font-size: 80px; line-height: 1; display: block; }
@keyframes boom { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: none; } }

/* おぼえて料理 */
.recipe { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 14px; border-radius: 10px; background: color-mix(in srgb, var(--gold) 30%, var(--surface)); border: 2px solid var(--fg); }
.ing { display: grid; justify-items: center; gap: 2px; min-width: 64px; }
.ing .e { font-size: 44px; line-height: 1.1; }
.ing .n { font-size: 12px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gbtn { display: grid; justify-items: center; gap: 0; padding: 8px 2px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); }
.gbtn .e { font-size: 32px; line-height: 1.15; }
.gbtn .n { font-size: 11px; font-weight: 700; }
.gbtn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); box-shadow: 0 0 0 2px var(--accent); }
.gbtn.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
.gbtn.ng { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }

/* 大会の試合の並び */
.playlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: pl; }
.playlist li { display: grid; grid-template-columns: 2.2em 34px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; counter-increment: pl; }
.playlist li::before { content: counter(pl) "試合"; font-size: 11px; font-weight: 700; color: var(--muted); }
.playlist .ico { font-size: 24px; text-align: center; }
.adders { display: flex; flex-wrap: wrap; gap: 6px; }

/* 大会版ゲーム共通 */
.slots { display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 8px; min-height: 44px; padding: 4px 8px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); text-align: left; font-weight: 700; }
.slot .no { font-family: var(--display); font-size: 18px; color: var(--ink); text-align: center; border-radius: 6px; padding: 2px 0; }
.slot.empty { border-style: dashed; color: var(--muted); font-weight: 500; }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.word { padding: 8px 12px; border-radius: 8px; border: 2px solid var(--fg); background: var(--surface); font-weight: 700; }
.word.used { opacity: .3; }
.lineup { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lineup li { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 2px solid var(--line); border-radius: 8px; }
.lineup li.me { border-color: var(--fg); }
.lineup li.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.lineup li.ng { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.lineup .pos { font-family: var(--display); color: var(--muted); text-align: center; }
.lineup .hint { font-weight: 700; overflow-wrap: anywhere; }
.lineup .num { font-family: var(--display); font-size: 20px; }
.bignum { font-family: var(--display); font-size: 52px; line-height: 1; }
.scale { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; }
.scale .bar2 { height: 8px; border-radius: 999px; background: linear-gradient(90deg, #7fbfff, #ffdf7f, #ff7f7f); }
.pc { width: 50px; height: 70px; border-radius: 6px; border: 2px solid #181b23; background: #fbf6ea; color: #181b23; display: grid; place-items: center; align-content: center;
  font-family: var(--display); font-size: 24px; line-height: 1; flex: none; padding: 0; }
.pc small { font-family: var(--body); font-size: 9px; font-weight: 700; margin-top: 3px; }
.pc.K { color: #b3261e; } .pc.Q { color: #6a2bb3; } .pc.A { color: #1f5fb3; } .pc.J { background: linear-gradient(135deg, #ffe08a, #ff9f6b, #c9a0ff); }
.pc.match { box-shadow: inset 0 0 0 3px rgba(31,138,76,.55); }
button.pc.sel { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.cards { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
button.liarbtn { background: var(--bad); color: #fff; border-color: var(--bad); font-family: var(--display); font-weight: 400; font-size: 18px; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); display: grid; gap: 1px; }
.shell { display: inline-block; width: 11px; height: 20px; border-radius: 3px 3px 2px 2px; border: 1.5px solid #181b23; vertical-align: middle; }
.shell.live { background: linear-gradient(#c8322f 70%, #c9a227 70%); }
.shell.blank { background: linear-gradient(#7d8a98 70%, #c9a227 70%); }
.ibtn { display: grid; justify-items: center; min-width: 54px; padding: 3px 5px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); }
.ibtn .ic { font-size: 22px; line-height: 1.2; } .ibtn .in { font-size: 10px; font-weight: 700; white-space: nowrap; }
.ibtn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
/* ウソつき酒場は情報が多いので、席を小さくしてスマホでも1画面に収める */
.table.small { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.table.small .seat { min-height: 0; padding: 6px 4px; gap: 0; }
.table.small .face { font-size: 22px; }
.table.small .nm { font-size: 13px; }
@media (max-width: 600px) { .log { display: none; } .table.small .muted { font-size: 11px; } }

/* 順位 */
.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
.rank th, .rank td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.rank th { font-size: 12px; color: var(--muted); }
.rank td.n { font-variant-numeric: tabular-nums; text-align: right; }
.rank tr.me td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.rank .pl { font-family: var(--display); }
.champ { font-family: var(--display); font-size: clamp(24px, 6vw, 36px); line-height: 1.25; padding: 16px; border: 2px solid var(--fg); border-radius: 8px; background: var(--gold); color: var(--ink); text-align: center; overflow-wrap: anywhere; }

/* プレイヤー一覧 */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.players li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.players li:last-child { border-bottom: none; }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--fg); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; }
.pname .tag.gm { color: var(--accent); }
.pts { font-family: var(--display); font-variant-numeric: tabular-nums; }
.off { opacity: .5; }
.kick { grid-column: 2 / -1; justify-self: start; }
.invite { display: flex; gap: 6px; }
.invite input { font-size: 13px; }
.invite button { white-space: nowrap; flex: none; }
@media (max-width: 420px) { .canyon { padding: 8px; gap: 6px; } .bridge { min-height: 128px; } .gbtn .e { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) { .intro .ico, .seat.holder .face, .hot, .boom, .bridge.collapsed { animation: none; } }
</style>
</head>
<body>
<div class="banner" id="banner" hidden></div>

<!-- 入室画面 -->
<div class="login" id="login">
  <div class="wrap">
    <div>
      <div class="eyebrow modeEyebrow">好きなミニゲームを並べて総合優勝を決める大会</div>
      <h1 class="modeTitle">ドタバタ大会</h1>
    </div>
    <form class="panel" id="loginForm">
      <label class="field">ニックネーム<input type="text" id="lName" maxlength="12" autocomplete="nickname" placeholder="例: たろう"></label>
      <label class="field">部屋コード(友達から聞いたコード)<input type="text" id="lRoom" class="code" maxlength="6" autocomplete="off" placeholder="ABCD"></label>
      <div class="btns"><button class="primary" type="submit" id="lJoin">この部屋に入る</button></div>
      <div class="or">または</div>
      <div class="btns"><button type="button" id="lCreate">新しい部屋を作る</button><span class="muted small">部屋コードが自動で決まります</span></div>
      <p class="status" id="lMsg" aria-live="polite"></p>
    </form>
    <p class="small muted"><a href="/">← ゲームを選ぶ</a></p>
  </div>
</div>

<!-- ゲーム画面 -->
<div class="wrap" id="game" hidden>
  <div class="top">
    <div>
      <div class="eyebrow modeEyebrow">好きなミニゲームを並べて総合優勝を決める大会</div>
      <h1 class="modeTitle">ドタバタ大会</h1>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <main class="panel" id="main"></main>
  <aside class="panel" id="side"></aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};
const COLORS = ["#e8574f", "#f0a03c", "#e6d14a", "#5cc46a", "#4d9de0", "#a46ee0", "#ee7fc0", "#5fd0c8"];
const GAME_INFO = {
  bridge: { icon: "🌉", name: "ひとりじめ橋", short: "こっそり橋を選ぶ。かぶったら崩れて0点",
    rules: ["点数の書かれた橋の中から、全員がこっそり1本選びます(15秒)。", "自分だけが選んだ橋なら、その点数がもらえます。", "同じ橋を選んだ人がいると橋が崩れて、全員0点！", "これを3ラウンド。合計点で順位が決まります。"] },
  bomb: { icon: "💣", name: "爆弾回し", short: "持っているときに爆発したら脱落",
    rules: ["爆弾を持っている人は、渡したい人を押して押し付けます。", "爆発までの時間は秘密。毎回ちがいます。", "爆発したときに持っていた人は脱落。新しい爆弾で続きます。", "最後まで残った人が1位！"] },
  memory: { icon: "🍳", name: "おぼえて料理", short: "材料を覚えて、正しく選ぶ",
    rules: ["料理の材料が4秒だけ表示されます。しっかり覚えて！", "並んだ12個の食材から、材料だけを選んで「完成！」。", "正解1つ+2点、まちがい1つ−1点、全部正解でボーナス。", "全部正解の中で早かった人はさらにボーナス。材料は3→4→5個と増えます。"] },
  // ここから下は大会だけで遊べる「大会版」(元のゲームは /tier /number /liar)
  tier: { icon: "📊", name: "ティア表", short: "親の並びを予想する(全員1回ずつ親)", extra: true,

// ---- 効果音(Web Audio で合成。ファイル不要) ----
const Sound = {
  ctx: null,
  on: store.get("tier:sound") !== false,
  setOn(v) { this.on = v; store.set("tier:sound", v); if (v) { this.unlock(); this.play("tap"); } },
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch {} },
  seq: {
    tap: [[880, 0, .06]], join: [[660, 0, .08], [880, .08, .12]],
    start: [[523, 0, .12], [659, .12, .12], [784, .24, .22]],
    pick: [[1046, 0, .07]], pass: [[700, 0, .05], [1050, .05, .07]], fuse: [[1500, 0, .03]],
    good: [[784, 0, .1], [988, .1, .1], [1318, .2, .2]], bad: [[330, 0, .15], [262, .16, .25]],
    tick: [[1000, 0, .05]], win: [[523, 0, .15], [659, .15, .15], [784, .3, .15], [1046, .45, .2], [784, .65, .12], [1046, .77, .5]],
  },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== "running") return;
    if (name === "boom") return this.noise(.9, .5, 900);
    if (name === "crash") return this.noise(.6, .35, 500);
    const t0 = this.ctx.currentTime, soft = name === "fuse" || name === "tick" || name === "pick";
    for (const [f, s, d] of this.seq[name] || []) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = soft ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + s);
      g.gain.exponentialRampToValueAtTime(soft ? 0.05 : 0.14, t0 + s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
      o.connect(g).connect(this.ctx.destination);
      o.start(t0 + s); o.stop(t0 + s + d + 0.02);

  noise(dur, vol, cutoff) {

    src.buffer = buf; f.type = "lowpass"; f.frequency.value = cutoff; g.gain.value = vol;

};

// 状態の変化に合わせて音を鳴らす
function onTransition(prev, cur) {
  if (!prev || prev.code !== cur.code) return;
  if (cur.players.length > prev.players.length) Sound.play("join");
  const pg = prev.game || {}, g = cur.game || {};
  if (cur.phase === "intro" && prev.phase !== "intro") Sound.play("start");
  if (cur.phase === "final" && prev.phase !== "final") Sound.play("win");
  if (cur.phase !== "play") return;
  if (g.key === "bridge" && g.step === "show" && pg.step !== "show") {
    const collapsed = g.last?.collapsed.some(Boolean);
    if (collapsed) Sound.play("crash");
    setTimeout(() => Sound.play((g.last?.gained[me] || 0) > 0 ? "good" : "bad"), 500);
  }
  if (g.key === "bomb") {
    if (g.step === "boom" && pg.step !== "boom") Sound.play("boom");
    else if (g.holder && g.holder !== pg.holder) Sound.play("pass");
  }
  if (g.key === "memory" && g.step === "result" && pg.step !== "result") Sound.play(g.last?.rows[me]?.perfect ? "good" : "bad");
  if (g.key === "liar") {
    if (g.step === "shot" && pg.step !== "shot") Sound.play(g.shot.died ? "boom" : "tick");
    else if (g.step === "reveal" && pg.step !== "reveal") Sound.play("bad");
    else if (g.step === "play" && g.turnId === me && pg.turnId !== me) Sound.play("pass");
  }
  if ((g.key === "tier" || g.key === "number") && g.step === "show" && pg.step !== "show") Sound.play("good");
  if (g.key === "shotgun" && g.event && g.event.seq !== pg.event?.seq) {
    const ev = g.event;
    if (ev.type === "shot") Sound.play(ev.shell === "live" ? "boom" : "tick");
    else if (ev.type === "item" || ev.type === "load") Sound.play("pick");
  }
}

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/party/ws");
  const slow = setTimeout(() => showBanner("サーバを起動しています。初回は1分ほどかかることがあります…"), 2500);
  ws.onopen = () => {
    clearTimeout(slow); retry = 0; everOpen = true; showBanner("");
    if (wantRoom) send({ t: "join", room: wantRoom, mode: MODE, name: myName, pid: ident.pid, token: ident.token });
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "joined") {
      joined = true; store.set("party:last:" + MODE, { room: m.room, name: myName }); saveName(myName);
      for (const x of m.ingredients || []) ING[x.id] = x;
      history.replaceState(null, "", BASE + "?room=" + m.room);
      $("login").hidden = true; $("game").hidden = false;
    } else if (m.t === "state") {
      const prev = S;
      S = m.room; me = m.me; offset = m.now - Date.now();
      onTransition(prev, S);
      render();
    } else if (m.t === "kicked") {
      backToLogin("ホストによって部屋から退出しました", true);
    } else if (m.t === "error") {
      if (!joined) { $("lMsg").textContent = m.msg; $("lMsg").classList.add("warn"); wantRoom = null; setLoginBusy(false); }
      else flash(m.msg, true);
    }
  };
  ws.onclose = () => {
    clearTimeout(slow);
    if (joined || wantRoom) showBanner(everOpen ? "接続が切れました。再接続しています…" : "サーバに接続しています…");
    setTimeout(connect, Math.min(8000, 800 * 2 ** retry++));
  };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function showBanner(t) { $("banner").textContent = t; $("banner").hidden = !t; }
let flashMsg = "", flashWarn = false, flashT;

{

  for (const st of g.seats) {
    const turn = g.step === "turn" && g.turnId === st.id;
    table.append(h("div", { class: "seat" + (turn ? " holder" : "") + (st.alive ? "" : " out") + (st.id === me ? " me" : ""), style: `border-top:5px solid ${colorOf(st.id)}` },
      h("span", { class: "nm" }, nameOf(st.id) + (st.id === me ? "(あなた)" : "")),
      h("span", { class: "small", style: "color:var(--bad)" }, st.alive ? "♥".repeat(st.hp) + "♡".repeat(Math.max(0, g.maxHp - st.hp)) + (st.cuffed ? " ⛓️" : "") : "💀 脱落"),
      st.alive && st.items.length ? h("span", { class: "small" }, st.items.map((k) => info[k].icon).join("")) : null));
  }
  main.append(table);
  const ev = g.event;
  if (ev?.type === "shot") main.append(h("div", { class: "say " + (ev.shell === "live" ? "red" : "good") }, ev.shell === "live" ? `💥 実弾 → ${nameOf(ev.target)} −${ev.dmg}${ev.died ? "(脱落)" : ""}` : `カチッ… 空砲 → ${ev.target === ev.by ? "自分" : nameOf(ev.target)}`));
  else if (ev?.type === "item") main.append(h("p", { class: "small" }, `${nameOf(ev.by)}: ${info[ev.item].icon} ${info[ev.item].name}` + (ev.item === "beer" ? ` → ${ev.shell === "live" ? "実弾" : "空砲"}を排出` : "")));
  const known = Object.entries(g.know || {}).sort((a, b) => a[0] - b[0]);
  if (known.length) main.append(h("p", { class: "small" }, "あなたが知っている弾: ", ...known.map(([k, t]) => h("span", {}, (+k === 0 ? " 今の弾=" : ` ${+k + 1}発目=`), shell(t)))));
  if (g.step === "turn") main.append(countdown(40000), h("p", {}, myTurn ? "あなたの番。アイテムを使ってから撃てます。" : `${nameOf(g.turnId)} さんの番`));
  if (mine?.alive && mine.items.length) {
    const pend = local.sgPend;
    main.append(h("div", { class: "btns" }, ...mine.items.map((k, idx) => h("button", { type: "button", class: "ibtn" + (pend?.idx === idx ? " sel" : ""), disabled: !myTurn, title: info[k].desc,
      onclick: () => { if (k === "jammer" || k === "adrenaline") { local.sgPend = pend?.idx === idx ? null : { idx, k }; render(); } else { local.sgPend = null; send({ t: "mini", a: "item", idx }); } } },
      h("span", { class: "ic" }, info[k].icon), h("span", { class: "in" }, info[k].name)))));
  }
  if (!myTurn) { local.sgPend = null; return; }
  const others = g.seats.filter((x) => x.alive && x.id !== me), pend = local.sgPend;
  if (pend?.k === "jammer") main.append(h("div", { class: "btns" }, "📡 だれを休ませる？", ...others.map((x) => h("button", { type: "button", class: "ghost", disabled: x.cuffed, onclick: () => { local.sgPend = null; send({ t: "mini", a: "item", idx: pend.idx, target: x.id }); } }, nameOf(x.id)))));
  else if (pend?.k === "adrenaline") main.append(...others.filter((x) => x.items.some((k) => k !== "adrenaline")).map((x) => h("div", { class: "btns small" }, `💉 ${nameOf(x.id)}:`,
    ...x.items.map((k, pick) => k === "adrenaline" ? null : h("button", { type: "button", class: "ghost tiny", onclick: () => { local.sgPend = null; send({ t: "mini", a: "item", idx: pend.idx, target: x.id, pick }); } }, info[k].icon + info[k].name)))));
  else main.append(h("div", { class: "btns" }, h("button", { type: "button", class: "primary", onclick: () => send({ t: "mini", a: "shoot", target: me }) }, "自分を撃つ"),
    ...others.map((x) => h("button", { type: "button", class: "ghost", style: `border:3px solid ${colorOf(x.id)}`, onclick: () => send({ t: "mini", a: "shoot", target: x.id }) }, `${nameOf(x.id)} を撃つ`))));
}

// ---- 順位発表 ----
function rankTable(rows, cols) {
  return h("table", { class: "rank" }, h("thead", {}, h("tr", {}, ...cols.map((c) => h("th", {}, c[0])))),
    h("tbody", {}, ...rows.map((r) => h("tr", { class: r.id === me ? "me" : "" }, ...cols.map((c) => c[1](r))))));
}
function renderResult(main, isGM) {
  const R = S.result, info = GAME_INFO[R.key];
  const rawLabel = { bridge: "橋の点", bomb: "", memory: "料理の点", tier: "予想の点", number: "得点", liar: "", shotgun: "" }[R.key];
  main.append(h("div", { class: "say" }, `${info.icon} ${info.name} の結果`));
  const cols = [["順位", (r) => h("td", { class: "pl" }, r.rank + "位")], ["名前", (r) => h("td", {}, chip(r.id))]];
  if (rawLabel) cols.push([rawLabel, (r) => h("td", { class: "n" }, r.raw)]);
  cols.push(["もらった点", (r) => h("td", { class: "n" }, `+${r.pts}`)], ["合計", (r) => h("td", { class: "n pl" }, r.total)]);
  main.append(rankTable(R.rows, cols));
  if (SINGLE) {
    // 単独ゲーム: 同じメンバーでもう1試合(通算点は残る)
    main.append(h("div", { class: "btns" }, h("button", { class: "primary big", type: "button", onclick: () => send({ t: "again" }) }, "もう一度遊ぶ"),
      h("span", { class: "muted small" }, "同じメンバーで次の試合。合計は通算点として残ります")));
    return;
  }
  main.append(countdown(15000));
  main.append(h("div", { class: "btns" }, isGM ? h("button", { class: "primary", type: "button", onclick: () => send({ t: "next" }) }, R.last ? "総合結果へ" : "次の試合へ") : null,
    h("span", { class: "muted small" }, R.last ? "まもなく総合結果の発表" : "まもなく次の試合")));
}
function renderFinal(main) {
  const rows = S.players.filter((p) => p.inGame).sort((a, b) => b.total - a.total);
  let place = 0, prev = null;
  rows.forEach((r, i) => { if (r.total !== prev) { place = i + 1; prev = r.total; } r.place = place; });
  const champs = rows.filter((r) => r.place === 1);
  main.append(h("div", { class: "eyebrow" }, "総合結果"), h("div", { class: "champ" }, "🏆 総合優勝 " + champs.map((c) => c.name).join("・") + " さん"));
  main.append(rankTable(rows, [["順位", (r) => h("td", { class: "pl" }, r.place + "位")], ["名前", (r) => h("td", {}, chip(r.id))], ["合計", (r) => h("td", { class: "n pl" }, r.total + "点")]]));
  main.append(h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "again" }) }, "もう一度遊ぶ"), h("span", { class: "muted small" }, "待機画面に戻ります")));
}

// ---- タイマー表示と、爆弾の導火線の音 ----
let lastSec = null, fuseTick = 0;
setInterval(() => {
  if (!S) return;
  const r = remainingMs();
  document.querySelectorAll("#main .cdwrap").forEach((w) => {
    const total = +w.dataset.total, cd = w.querySelector(".cd"), bar = w.querySelector(".bar span");
    if (r == null) return;
    cd.textContent = Math.ceil(r / 1000) + "秒"; cd.classList.toggle("low", r <= 5000);
    bar.style.width = Math.min(100, (r / total) * 100) + "%";
  });
  const sec = r == null ? null : Math.ceil(r / 1000);
  if (sec !== lastSec) { lastSec = sec; if (S.phase === "play" && sec != null && sec <= 3 && sec >= 1) Sound.play("tick"); }
  // 爆弾を持っているあいだは導火線の音(時間は分からないので一定のリズム)
  if (S.phase === "play" && S.game?.key === "bomb" && S.game.step === "fuse" && ++fuseTick % 2 === 0) Sound.play("fuse");
}, 250);

connect();
</script>
</body>
</html>
