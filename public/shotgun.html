<head>

<meta property="og:description" content="実弾と空砲が込められたショットガンで、自分か相手を撃つ。11種類のアイテムを駆使して、最後まで生き残った人の勝ち。">

<style>
/* レイアウト: 上部=部屋/ラウンド/テーブルカード、中央=酒場(3D または 2D)、その下=手札と操作、右=プレイヤーと記録 */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4;
  --ink: #181b23; --felt: #1f5a3a; --wood: #6b4226; --gold: #f2c14e; --blood: #c4323a;
  --card-bg: #fbf6ea; --good: #1f8a4c; --bad: #c4323a;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947; --accent: #8f9cff;
    --good: #5fd28f; --bad: #ff7b82; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--fg); font-size: 13px; font-weight: 700; background: var(--surface); }
button.pill { cursor: pointer; font-family: var(--body); }
.pill.table { background: var(--gold); color: var(--ink); border-color: var(--ink); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.col { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }
.status.warn { color: var(--bad); }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.banner { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--fg); color: var(--surface); font-size: 13px; font-weight: 700; text-align: center; z-index: 30; }
a { color: var(--accent); }

/* 入室画面 */
.login { max-width: 460px; margin: 6vh auto 0; }
.login .panel { gap: 16px; }
.or { text-align: center; font-size: 12px; color: var(--muted); }
.code { font-family: var(--display); letter-spacing: .15em; text-transform: uppercase; }

/* 酒場(3D/2D の舞台) */
.stage { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--fg); background: #120c08; aspect-ratio: 16 / 9; min-height: 300px; }
@media (max-width: 600px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #ff2a2a; mix-blend-mode: screen; }
.stage .flash.go { animation: flash .9s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
.stage.shake { animation: shake .45s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, 3px); } 80% { transform: translate(3px, -2px); } }
.callout { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vw, 40px); color: #fff; text-align: center; line-height: 1.2;
  text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,.8); pointer-events: none; white-space: nowrap; animation: pop .35s ease-out; z-index: 3; }
.callout.red { color: #ff6b6b; } .callout.gold { color: var(--gold); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px) scale(.9); } to { opacity: 1; transform: translateX(-50%); } }
.timer3d { position: absolute; right: 10px; bottom: 8px; font-family: var(--display); font-size: 22px; color: #fff; text-shadow: 0 2px 0 #000; z-index: 3; font-variant-numeric: tabular-nums; }
.timer3d.low { color: #ff6b6b; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #181b23; font-weight: 700; font-size: 14px; padding: 4px 12px; border-radius: 14px;
  border: 2px solid #181b23; white-space: nowrap; pointer-events: none; z-index: 4; animation: pop2 .25s ease-out; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #181b23; border-bottom: 0; }
@keyframes pop2 { from { opacity: 0; transform: translate(-50%, -80%) scale(.8); } to { opacity: 1; transform: translate(-50%, -100%); } }
.stage canvas { touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.lookFront { position: absolute; left: 10px; bottom: 8px; z-index: 3; padding: 5px 12px; font-size: 13px; border-radius: 999px; background: rgba(15,10,6,.7); color: #fff; border-color: rgba(255,255,255,.5); }
.lookFront:hover:not(:disabled) { background: rgba(15,10,6,.9); }
.lookHint { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); z-index: 3; padding: 6px 14px; border-radius: 999px; background: rgba(15,10,6,.75); color: #fff;
  font-size: 13px; font-weight: 700; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
.loading3d { position: absolute; inset: 0; display: grid; place-items: center; color: #e9dcc6; font-size: 14px; font-weight: 700; }

/* 2D 表示 */
.board2d { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 12px; background: radial-gradient(ellipse at center, #2c6b47 0%, #173d29 70%, #0f2a1c 100%); color: #f4ecd8; overflow: auto; }
.seats2d { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.seat2d { position: relative; border: 2px solid rgba(255,255,255,.25); border-radius: 8px; padding: 6px 10px; background: rgba(0,0,0,.25); font-size: 13px; min-width: 0; }
.seat2d.turn { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,193,78,.35); }
.seat2d.dead { opacity: .45; }
.seat2d .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat2d .bubble { left: 50%; top: 0; }
.center2d { display: grid; place-items: center; gap: 8px; text-align: center; }
.center2d .tc { font-family: var(--display); font-size: 20px; }

/* カード */
.cards { display: flex; flex-wrap: wrap; gap: 8px; }
.pc { width: 64px; height: 92px; border-radius: 7px; border: 2px solid #181b23; background: var(--card-bg); color: #181b23; display: grid; place-items: center; align-content: center; gap: 0;
  font-family: var(--display); font-size: 30px; line-height: 1; user-select: none; -webkit-user-select: none; position: relative; transition: transform .12s; flex: none; }
.pc small { font-family: var(--body); font-size: 11px; font-weight: 700; margin-top: 4px; }
.pc.K { color: #b3261e; } .pc.Q { color: #6a2bb3; } .pc.A { color: #1f5fb3; } .pc.J { color: #181b23; background: linear-gradient(135deg, #ffe08a, #ff9f6b, #c9a0ff); }
.pc.match { box-shadow: inset 0 0 0 3px rgba(31,138,76,.55); }
.pc.back { background: repeating-linear-gradient(45deg, #7a1f1f 0 6px, #5c1414 6px 12px); color: transparent; }
button.pc { cursor: pointer; padding: 0; }
button.pc.sel { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
button.pc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cards.small .pc { width: 46px; height: 66px; font-size: 22px; }
.cards.small .pc small { display: none; }

/* 操作 */
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 4px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { background: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.liar { background: var(--blood); color: #fff; border-color: var(--blood); font-family: var(--display); font-weight: 400; font-size: 18px; padding: 10px 22px; }
button.liar:hover:not(:disabled) { background: #a3202a; }
button.trigger { background: #181b23; color: #fff; font-family: var(--display); font-weight: 400; font-size: 22px; padding: 14px 28px; border-color: var(--blood); box-shadow: 0 0 0 4px rgba(196,50,58,.35); }
button.big { font-size: 16px; padding: 12px 22px; }
button.tiny { padding: 3px 9px; font-size: 12px; }
input[type=text] { font-family: var(--body); font-size: 16px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; }
.stamps button { padding: 5px 12px; font-size: 13px; border-radius: 999px; border-color: var(--line); font-weight: 700; }
.say { font-family: var(--display); font-size: 20px; line-height: 1.35; overflow-wrap: anywhere; }
.say.red { color: var(--bad); } .say.good { color: var(--good); }

/* プレイヤー */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.players li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.players li:last-child { border-bottom: none; }
.players li.dead .pname { text-decoration: line-through; color: var(--muted); }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--fg); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; }
.pname .tag.gm { color: var(--accent); }
.pinfo { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
.off { opacity: .5; }
.kick { grid-column: 2 / -1; justify-self: start; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.invite { display: flex; gap: 6px; }
.invite input { font-size: 13px; }
.invite button { white-space: nowrap; flex: none; }
@media (prefers-reduced-motion: reduce) { .stage.shake, .callout, .bubble { animation: none; } .pc { transition: none; } }

/* スマホのゲーム中: スクロールなしで1画面に収める(上=小さな情報帯、中=酒場、下=手札と操作)。
   プレイヤー一覧などは「メニュー」で横から開く */
.menuBtn, .closeDrawer, .stampToggle, .short, .scrim { display: none; }
body.compact { padding: calc(6px + env(safe-area-inset-top, 0px)) 8px calc(6px + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
body.compact #game { height: calc(100dvh - 12px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
body.compact #game > .top { flex: none; }
body.compact #game > .top > div:first-child { display: none; }
body.compact .meta { gap: 4px; flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; }
body.compact .pill { font-size: 12px; padding: 2px 9px; white-space: nowrap; flex: none; }
body.compact .menuBtn { display: inline-flex; margin-left: auto; background: var(--fg); color: var(--surface); }
body.compact .layout { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 0; }
body.compact .col { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 6px; }
body.compact .stage { aspect-ratio: auto; flex: 1; min-height: 150px; }
body.compact #main { flex: none; padding: 8px 10px; gap: 6px; }
body.compact .long { display: none; }
body.compact .short { display: inline; }
body.compact .say { font-size: 16px; line-height: 1.3; }
body.compact .cards { flex-wrap: nowrap; overflow-x: auto; padding-top: 10px; gap: 6px; }
body.compact .pc { width: 54px; height: 76px; font-size: 24px; }
body.compact .pc small { font-size: 10px; }
body.compact .cards.small { padding-top: 0; }
body.compact .cards.small .pc { width: 32px; height: 46px; font-size: 16px; border-width: 1.5px; }
body.compact .btns { gap: 6px; }
body.compact button.big { padding: 9px 14px; font-size: 15px; }
body.compact button.liar { font-size: 16px; padding: 8px 16px; }
body.compact button.trigger { font-size: 18px; padding: 10px 20px; }
body.compact .stampToggle { display: inline-flex; border-color: var(--line); font-weight: 500; padding: 6px 12px; font-size: 13px; }
body.compact .stamps { flex-wrap: nowrap; overflow-x: auto; }
body.compact .stamps button { flex: none; }
body.compact .stamps.closed { display: none; }
body.compact .say .cards.small { display: inline-flex; vertical-align: middle; margin-left: 6px; }
body.compact #side { position: fixed; top: 0; right: 0; bottom: 0; width: min(88vw, 340px); z-index: 40; overflow-y: auto; border-radius: 0; align-content: start;
  padding-top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(105%); transition: transform .2s ease-out; box-shadow: -8px 0 24px rgba(0,0,0,.25); }
body.compact.drawer #side { transform: none; }
body.compact .closeDrawer { display: inline-flex; justify-self: end; }
body.compact.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 39; }
/* 横向きのスマホ: 左に酒場、右に手札と操作(右側だけ必要ならスクロール) */
@media (orientation: landscape) {
  body.compact .col { flex-direction: row; }
  body.compact .stage { min-height: 0; }
  body.compact #main { width: min(48vw, 400px); overflow-y: auto; align-content: start; }
}
@media (prefers-reduced-motion: reduce) { body.compact #side { transition: none; } }

/* 散弾ルーレット: 弾・アイテム・撃つボタン */
.shellinfo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.spent { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.shell { display: inline-block; width: 12px; height: 22px; border-radius: 3px 3px 2px 2px; border: 1.5px solid #181b23; vertical-align: middle; }
.shell.live { background: linear-gradient(#c8322f 70%, #c9a227 70%); }
.shell.blank { background: linear-gradient(#7d8a98 70%, #c9a227 70%); }
.shell.used { opacity: .55; }
.know { font-size: 13px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.know .kn { display: inline-flex; gap: 3px; align-items: center; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.ibtn { display: grid; justify-items: center; gap: 0; min-width: 62px; padding: 4px 6px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); }
.ibtn .ic { font-size: 24px; line-height: 1.2; }
.ibtn .in { font-size: 10px; font-weight: 700; white-space: nowrap; }
.ibtn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.shootrow { gap: 6px; }
.shootbtn { border-width: 3px; font-weight: 700; }
.selfshot { background: var(--fg); color: var(--surface); }
.itemtoggles { display: flex; flex-wrap: wrap; gap: 6px; }
.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.settings .field { min-width: 0; }
.settings select { width: 100%; min-width: 0; }
.itoggle small { display: block; font-size: 10px; font-weight: 500; }
.itoggle.w1 { background: color-mix(in srgb, var(--gold) 35%, var(--surface)); }
.itoggle.w3 { background: #f08a3c; color: #181b23; }

.itoggle { border-color: var(--line); color: var(--muted); font-weight: 500; padding: 4px 10px; font-size: 13px; }
.itoggle.on { background: var(--gold); border-color: var(--fg); color: var(--ink); font-weight: 700; }
body.compact .ibtn { min-width: 52px; padding: 2px 4px; }
body.compact .ibtn .ic { font-size: 20px; }
body.compact .items { flex-wrap: nowrap; overflow-x: auto; }
</style>

<script type="module">
const { $, h, store, saveName } = TG; // 全ページ共通の部品(public/js/common.js)

function rnd(n, chars = "abcdefghijklmnopqrstuvwxyz0123456789") {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map((x) => chars[x % chars.length]).join("");
}

// ---- 効果音(Web Audio で合成。ファイル不要) ----
const Sound = {
  ctx: null,
  on: store.get("tier:sound") !== false,
  setOn(v) { this.on = v; store.set("tier:sound", v); if (v) { this.unlock(); this.play("tap"); } },
  unlock() {
    try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch {}
  },
  seq: {
    tap: [[880, 0, .06]], join: [[660, 0, .08], [880, .08, .12]],
    turn: [[988, 0, .08], [1318, .1, .12]], item: [[1046, 0, .06], [1568, .07, .1]],
    stamp: [[1320, 0, .05]], heal: [[784, 0, .1], [988, .1, .14]],
    win: [[523, 0, .15], [659, .15, .15], [784, .3, .15], [1046, .45, .2], [784, .65, .12], [1046, .77, .5]],
    tick: [[1000, 0, .05]],
  },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== "running") return;
    if (name === "bang") return this.noise(1.0, .6, 1100);
    if (name === "click") return this.noise(.05, .3, 3500);
    if (name === "load") { this.noise(.07, .3, 2500); setTimeout(() => this.noise(.09, .35, 1800), 160); return; }
    const t0 = this.ctx.currentTime, soft = name === "stamp" || name === "tick";
    for (const [f, s, d] of this.seq[name] || []) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = soft ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + s);
      g.gain.exponentialRampToValueAtTime(soft ? 0.05 : 0.14, t0 + s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
      o.connect(g).connect(this.ctx.destination);
      o.start(t0 + s); o.stop(t0 + s + d + 0.02);
    }
  },
  // 銃声・撃鉄の音: ホワイトノイズをローパスで丸めて短く鳴らす
  noise(dur, vol, cutoff) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = cutoff; g.gain.value = vol;
    src.connect(f).connect(g).connect(c.destination); src.start();
  },
};
document.addEventListener("pointerdown", () => Sound.unlock());

// ---- 出来事(撃った・アイテム・装填)に合わせて音と演出 ----
const itemName = (k) => S?.itemInfo?.[k] ? S.itemInfo[k].icon + " " + S.itemInfo[k].name : k;
function onTransition(prev, cur) {
  if (!prev || prev.code !== cur.code) return;
  if (cur.players.length > prev.players.length) Sound.play("join");
  if (cur.phase === "finished" && prev.phase !== "finished") { Sound.play("win"); const w = cur.ranking?.[0]; if (w) callout(`${w.name} の勝ち！`, "gold"); return; }
  const g = cur.game, pg = prev.game;
  if (!g) return;
  const ev = g.event;
  if (ev && ev.seq !== pg?.event?.seq) {
    if (ev.type === "load") { Sound.play("load"); callout(`実弾 ${ev.live}発・空砲 ${ev.blank}発`, "gold"); }
    else if (ev.type === "shot") {
      const who = ev.target === ev.by ? "自分" : nameOf(ev.target);
      if (ev.shell === "live") {
        Sound.play("bang");
        if (ev.target === me || ev.died) {
          const st = $("stage"); st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
          const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
        }
        callout(ev.died ? `バン！ ${nameOf(ev.target)} 脱落` : `バン！ ${who} −${ev.dmg}`, "red");
      } else { Sound.play("click"); callout(`カチッ… 空砲${ev.target === ev.by ? "(もう一度)" : ""}`, "gold"); }
    } else if (ev.type === "item") {
      Sound.play(ev.item === "cig" || (ev.item === "medicine" && ev.ok) ? "heal" : "item");
      let t = `${nameOf(ev.by)}: ${itemName(ev.item)}`;
      if (ev.item === "beer") t += ` → ${ev.shell === "live" ? "実弾" : "空砲"}を排出`;
      if (ev.item === "medicine") t += ev.ok ? " → +2" : " → −1";
      if ((ev.item === "cuffs" || ev.item === "jammer") && ev.target) t += ` → ${nameOf(ev.target)} 休み`;
      callout(t, ev.item === "medicine" && !ev.ok ? "red" : "");
      if (View3D && mode === "3d") View3D.itemUsed(ev);
    } else if (ev.type === "skip") callout(`${nameOf(ev.who)} は1回休み`, "");
  }
  if (g.step === "turn" && g.turnId === me && (pg?.turnId !== me || pg?.step !== "turn")) setTimeout(() => Sound.play("turn"), 300);
}
let calloutT;
function callout(text, cls = "") {
  $("stage").querySelectorAll(".callout").forEach((x) => x.remove());
  const el = h("div", { class: "callout " + cls }, text);
  $("stage").append(el);
  clearTimeout(calloutT); calloutT = setTimeout(() => el.remove(), 2200);
}

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/shotgun/ws");
  const slow = setTimeout(() => showBanner("サーバを起動しています。初回は1分ほどかかることがあります…"), 2500);
  ws.onopen = () => {
    clearTimeout(slow); retry = 0; everOpen = true; showBanner("");
    if (wantRoom) send({ t: "join", room: wantRoom, name: myName, pid: ident.pid, token: ident.token });
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "joined") {
      joined = true; store.set("shotgun:last", { room: m.room, name: myName }); saveName(myName);
      history.replaceState(null, "", "/shotgun?room=" + m.room);
      $("login").hidden = true; $("game").hidden = false;
      setupView();
    } else if (m.t === "state") {
      const prev = S;
      S = m.room; me = m.me; offset = m.now - Date.now();
      onTransition(prev, S);
      render();
    } else if (m.t === "stamp") {
      showStamp(m.from, m.i);
    } else if (m.t === "kicked") {
      backToLogin("ホストによって部屋から退出しました", true);
    } else if (m.t === "error") {
      if (!joined) { $("lMsg").textContent = m.msg; $("lMsg").classList.add("warn"); wantRoom = null; setLoginBusy(false); }
      else flash(m.msg, true);
    } else if (m.t === "info") flash(m.msg);
  };
  ws.onclose = () => {
    clearTimeout(slow);
    if (joined || wantRoom) showBanner(everOpen ? "接続が切れました。再接続しています…" : "サーバに接続しています…");
    setTimeout(connect, Math.min(8000, 800 * 2 ** retry++));
  };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

            onclick: () => set({ weights: { [k]: (w + 1) % 4 } }) }, `${info.icon} ${info.name}`, h("small", {}, WL[w]));
        }))),
      isGM ? h("div", { class: "btns" }, h("button", { type: "button", class: "ghost tiny", onclick: () => set({ reset: true }) }, "おすすめ設定に戻す")) : null);
    if (isGM) main.append(h("div", { class: "btns" },
      h("button", { class: "primary big", type: "button", disabled: live < 2, onclick: () => send({ t: "start" }) }, "ゲーム開始"),
      h("span", { class: "muted small" }, live < 2 ? "招待リンクを友達に送ってください。2人以上でスタートできます" : live > 6 ? "先に入った6人で始めます(ほかの人は観戦)" : `${live}人で開始できます`)));
    else main.append(h("p", { class: "muted" }, `ホストの ${nameOf(S.gameHostId)} さんが開始するのを待っています。`));
    main.append(stampRow());
    return;
  }

  if (P === "finished") {
    const rows = S.ranking || [];
    main.append(h("div", { class: "say good" }, rows[0] ? `優勝: ${rows[0].name} さん` : "ゲーム終了"),
      h("ol", { class: "rules" }, ...rows.map((r) => h("li", {}, `${r.rank}位 ${r.name}${r.id === me ? "(あなた)" : ""}`))),
      h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "again" }) }, "もう一度遊ぶ"),
        h("span", { class: "muted small long" }, "待機画面に戻ります"), stampToggle()), stampRow());
    return;
  }

  const g = S.game, mine = gseat(me), myTurn = g.step === "turn" && g.turnId === me && mine?.alive;
  // 弾の情報: 込めた数・使った弾・自分だけが知っている弾
  const info = h("div", { class: "shellinfo" },
    h("span", { class: "small" }, `装填${g.load}: 実弾${g.counts?.live ?? "-"}・空砲${g.counts?.blank ?? "-"}`),
    h("span", { class: "spent", "aria-label": "撃った・抜いた弾" }, ...g.spent.map((t) => shellChip(t, "used"))),
    h("span", { class: "small muted" }, `残り${g.remaining}発`));
  main.append(info);
  const known = Object.entries(g.know || {}).sort((a, b) => a[0] - b[0]);
  if (known.length) main.append(h("div", { class: "know" }, "あなたが知っている弾: ",
    ...known.map(([k, t]) => h("span", { class: "kn" }, (+k === 0 ? "今の弾" : `${+k + 1}発目`) + "=", shellChip(t), t === "live" ? "実弾" : "空砲"))));

  if (g.step === "load") main.append(h("div", { class: "say" }, "装填中…"));
  else if (g.step === "shot") main.append(h("div", { class: "say" }, "…"));
  else if (myTurn) main.append(h("div", { class: "say" }, "あなたの番", secEl(remaining())));
  else if (mine && !mine.alive) main.append(h("p", { class: "muted" }, "脱落しました。観戦中です。"));
  else main.append(h("p", {}, `${nameOf(g.turnId)} さんの番`, secEl(remaining())));

  // 自分のアイテム
  if (mine?.alive && mine.items.length) {
    const pend = local.pending;
    main.append(h("div", { class: "items", role: "group", "aria-label": "あなたのアイテム" }, ...mine.items.map((k, idx) => {
      const it = S.itemInfo[k];
      return h("button", { type: "button", class: "ibtn" + (pend && pend.idx === idx ? " sel" : ""), disabled: !myTurn, title: it.desc, "aria-label": `${it.name}: ${it.desc}`,
        onclick: () => {
          if (k === "jammer" || k === "adrenaline") { local.pending = pend && pend.idx === idx ? null : { idx, key: k }; render(); return; }
          local.pending = null; send({ t: "game", a: "item", idx });
        } }, h("span", { class: "ic" }, it.icon), h("span", { class: "in" }, it.name));
    })));
  }
  if (myTurn) {
    const others = gseats().filter((s) => s.alive && s.id !== me);
    const pend = local.pending;
    if (pend && pend.key === "jammer") {
      main.append(h("div", { class: "btns" }, h("span", { class: "small" }, "📡 だれを休ませる？"),
        ...others.map((s) => h("button", { type: "button", class: "ghost", disabled: s.cuffed, onclick: () => { local.pending = null; send({ t: "game", a: "item", idx: pend.idx, target: s.id }); } }, nameOf(s.id))),
        h("button", { type: "button", class: "ghost tiny", onclick: () => { local.pending = null; render(); } }, "やめる")));
    } else if (pend && pend.key === "adrenaline") {
      main.append(h("div", { class: "field" }, "💉 だれのどのアイテムを奪う？",
        ...others.filter((s) => s.items.some((k) => k !== "adrenaline")).map((s) => h("div", { class: "btns" }, h("span", { class: "small" }, nameOf(s.id) + ":"),
          ...s.items.map((k, pick) => k === "adrenaline" ? null : h("button", { type: "button", class: "ghost tiny", onclick: () => { local.pending = null; send({ t: "game", a: "item", idx: pend.idx, target: s.id, pick }); } }, itemName(k))))),
        h("div", { class: "btns" }, h("button", { type: "button", class: "ghost tiny", onclick: () => { local.pending = null; render(); } }, "やめる"))));
    } else {
      main.append(h("div", { class: "btns shootrow" },
        h("button", { type: "button", class: "selfshot", onclick: () => send({ t: "game", a: "shoot", target: me }) }, "自分を撃つ"),
        ...others.map((s) => h("button", { type: "button", class: "shootbtn", style: `border-color:${colorOf(s.id)}`, onclick: () => send({ t: "game", a: "shoot", target: s.id }) }, `${nameOf(s.id)} を撃つ`))));
    }
  } else if (local.pending) local.pending = null;
  main.append(h("div", { class: "btns" }, stampToggle()), stampRow());
}

// ---- 2D 表示 ----
function render2d() {
  const b = $("board2d"); b.replaceChildren();
  const g = S.game;
  const seats = h("div", { class: "seats2d" });
  for (const id of stageSeats()) {
    const p = player(id); if (!p) continue;
    const s = g && gseat(id);
    const el = h("div", { class: "seat2d" + (g?.step === "turn" && g.turnId === id ? " turn" : "") + (s && !s.alive ? " dead" : ""), "data-id": id, style: `border-left:6px solid ${colorOf(id)}` },
      h("div", { class: "nm" }, p.name + (id === me ? "(あなた)" : "")),
      h("div", {}, !s ? "待機中" : s.alive ? hearts(s.hp, g.maxHp) + (s.cuffed ? " ⛓️" : "") : "脱落"),
      s && s.items.length ? h("div", { class: "small" }, s.items.map((k) => S.itemInfo[k].icon).join(" ")) : null);
    seats.append(el);
  }
  const center = h("div", { class: "center2d" });
  if (S.phase === "lobby") center.append(h("div", { class: "tc" }, "散弾ルーレットへようこそ"));
  else if (S.phase === "finished") center.append(h("div", { class: "tc" }, S.ranking?.[0] ? `${S.ranking[0].name} の勝ち！` : "ゲーム終了"));
  else if (g) {
    center.append(h("div", { class: "tc" }, "🔫 残り " + g.remaining + "発"), h("div", {}, `実弾${g.counts?.live}・空砲${g.counts?.blank}(装填${g.load})`));
    const ev = g.event;
    if (ev?.type === "shot") center.append(h("div", { class: "tc" }, ev.shell === "live" ? `💥 実弾 → ${nameOf(ev.target)}` : `カチッ… 空砲 → ${ev.target === ev.by ? "自分" : nameOf(ev.target)}`));
  }
  b.append(seats, center, h("div"));
  render2dBubbles();
}
function render2dBubbles() {
  const b = $("board2d"); if (b.hidden) return;
  b.querySelectorAll(".bubble").forEach((x) => x.remove());
  const now = Date.now();
  for (const [id, s] of stampTimers) {
    if (s.until < now) { stampTimers.delete(id); continue; }
    const el = b.querySelector(`.seat2d[data-id="${id}"]`);
    if (el) el.append(h("div", { class: "bubble" }, s.text));
  }
}

// ---- タイマー表示 ----
let lastTick = null;
setInterval(() => {
  if (!S) return;
  const t = $("timer3d"), r = S.phase === "play" && S.game?.step === "turn" ? remaining() : null;
  t.hidden = r == null;
  if (r != null) { t.textContent = r + "秒"; t.classList.toggle("low", r <= 5); }
  if (r !== lastTick) {
    lastTick = r;
    if (r != null && r <= 5 && r >= 1 && S.game.turnId === me) Sound.play("tick");
    if (r != null) document.querySelectorAll("#main .secLeft").forEach((x) => { x.textContent = `(残り ${r}秒)`; });
  }
}, 250);

// =================================================================
// 3D 表示(three.js)
// キャラクター: RobotExpressive(Tomás Laulhé / Quaternius 作、CC0)。テーブル・ショットガン・弾はコードで組み立て
// =================================================================
function createView3D(THREE, GLTFLoader, SkeletonUtils, host) {
  const canvas = document.createElement("canvas");
  host.prepend(canvas);
  const GFX = TG.gfx(); // 画質(軽量モードでは解像度・なめらか処理・影を落とす)
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: GFX.antialias });
  renderer.setPixelRatio(GFX.pixelRatio);
  renderer.shadowMap.enabled = GFX.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x140d08);
  scene.fog = new THREE.Fog(0x140d08, 7, 17);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 60);

  // ---- 光: 天井のランプ1灯 + 弱い環境光 ----
  scene.add(new THREE.HemisphereLight(0xffd9a8, 0x24160c, 0.55));
  const lamp = new THREE.SpotLight(0xffc27a, 90, 14, Math.PI / 3, 0.55, 1.4);
  lamp.position.set(0, 4.4, 0); lamp.target.position.set(0, 0, 0);
  lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.0004;
  scene.add(lamp, lamp.target);
  const rim = new THREE.PointLight(0x6a8cff, 6, 12, 1.6); rim.position.set(-4, 2.5, -3); scene.add(rim);
  const flashLight = new THREE.PointLight(0xffb060, 0, 6, 2); scene.add(flashLight);

  // ---- テクスチャ(キャンバスに描く) ----
  const canvasTex = (w, hgt, draw, repeat) => {
    const c = document.createElement("canvas"); c.width = w; c.height = hgt; draw(c.getContext("2d"), w, hgt);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
    return t;
  };
  const woodTex = canvasTex(512, 512, (g, w, hh) => {
    for (let i = 0; i < 8; i++) {
      const y = i * hh / 8, base = 70 + (i % 3) * 8;
      g.fillStyle = `rgb(${base + 40},${base},${base - 35})`; g.fillRect(0, y, w, hh / 8);
      g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 3; g.strokeRect(-2, y, w + 4, hh / 8);
      for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(30,15,5,${0.08 + Math.random() * 0.12})`; g.lineWidth = 1; g.beginPath(); const yy = y + Math.random() * hh / 8; g.moveTo(0, yy); g.bezierCurveTo(w * .3, yy + 4, w * .6, yy - 4, w, yy + 2); g.stroke(); }
    }
  }, [6, 6]);
  const feltTex = canvasTex(256, 256, (g, w, hh) => {
    g.fillStyle = "#1f5a3a"; g.fillRect(0, 0, w, hh);
    for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? "0,0,0" : "255,255,255"},${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * hh, 1, 1); }
  }, [3, 3]);
  const brickTex = canvasTex(512, 256, (g, w, hh) => {
    g.fillStyle = "#2a1a12"; g.fillRect(0, 0, w, hh);
    const bw = 64, bh = 28;
    for (let r = 0; r * bh < hh; r++) for (let c = -1; c * bw < w; c++) {
      const x = c * bw + (r % 2 ? bw / 2 : 0), v = 60 + Math.random() * 30;
      g.fillStyle = `rgb(${v + 30},${v * .55},${v * .4})`; g.fillRect(x + 2, r * bh + 2, bw - 4, bh - 4);
    }
  }, [10, 3]);
  const backTex = canvasTex(256, 368, (g, w, hh) => {
    g.fillStyle = "#6e1b1b"; g.fillRect(0, 0, w, hh);
    g.strokeStyle = "#f2c14e"; g.lineWidth = 6; g.strokeRect(14, 14, w - 28, hh - 28);
    g.strokeStyle = "rgba(242,193,78,.35)"; g.lineWidth = 2;
    for (let i = -hh; i < w + hh; i += 22) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + hh, hh); g.stroke(); g.beginPath(); g.moveTo(i, hh); g.lineTo(i + hh, 0); g.stroke(); }
    g.fillStyle = "#f2c14e"; g.font = "bold 40px 'Dela Gothic One', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("?", w / 2, hh / 2);
  });

  // ---- 部屋: 床・壁・棚のボトル・ランプ ----
  const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ map: woodTex, roughness: .85 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 6, 40, 1, true), new THREE.MeshStandardMaterial({ map: brickTex, roughness: 1, side: THREE.BackSide }));
  wall.position.y = 3; scene.add(wall);
  const shelfMat = new THREE.MeshStandardMaterial({ color: 0x4a2c18, roughness: .8 });
  const bottleCols = [0x2f7d4a, 0x7a3b1a, 0x2b4f8c, 0xb08a2a, 0x6b1f3a];
  for (const ang of [Math.PI, Math.PI * 0.75, Math.PI * 1.25]) {
    const g = new THREE.Group();
    for (const y of [1.3, 2.1]) {
      const sh = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.06, 0.35), shelfMat); sh.position.y = y; g.add(sh);
      for (let i = 0; i < 7; i++) {
        const bh = 0.32 + Math.random() * 0.2;
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, bh, 10), new THREE.MeshStandardMaterial({ color: bottleCols[(i + (y > 2 ? 2 : 0)) % bottleCols.length], roughness: .15, metalness: .1, transparent: true, opacity: .85 }));
        b.position.set(-1.1 + i * 0.36, y + bh / 2 + 0.03, 0); g.add(b);
      }
    }
    g.position.set(Math.sin(ang) * 7.2, 0, Math.cos(ang) * 7.2); g.lookAt(0, 0, 0); scene.add(g);
  }
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.35, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x2b3a2b, metalness: .6, roughness: .4, side: THREE.DoubleSide }));
  shade.position.set(0, 3.55, 0); scene.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a8 }));
  bulb.position.set(0, 3.4, 0); scene.add(bulb);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 2.5), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  cord.position.set(0, 4.95, 0); scene.add(cord);

  // ---- テーブル ----
  const TABLE_R = 1.35, TABLE_Y = 0.78, SEAT_R = 1.95;
  const table = new THREE.Group();
  const top = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R, TABLE_R, 0.06, 48), new THREE.MeshStandardMaterial({ map: feltTex, roughness: .95 }));
  top.position.y = TABLE_Y; top.receiveShadow = true; top.castShadow = true; table.add(top);
  const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x9a6a44, roughness: .6 });
  const edge = new THREE.Mesh(new THREE.TorusGeometry(TABLE_R, 0.07, 12, 64), woodMat);
  edge.rotation.x = Math.PI / 2; edge.position.y = TABLE_Y + 0.02; edge.castShadow = true; table.add(edge);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, TABLE_Y, 16), woodMat); leg.position.y = TABLE_Y / 2; leg.castShadow = true; table.add(leg);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.65, 0.06, 32), woodMat); foot.position.y = 0.03; foot.receiveShadow = true; table.add(foot);
  scene.add(table);
  // テーブルカードの札(中央に立てて、ゆっくり回る)
  let signRank = null;
  const signMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: .5, side: THREE.DoubleSide });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.49), signMat);
  sign.position.set(0, TABLE_Y + 0.62, 0); scene.add(sign);
  sign.visible = false;

  // ---- ショットガン(銃身は +z 方向) ----
  const gun = new THREE.Group();
  {
    const steel = new THREE.MeshStandardMaterial({ color: 0x3d4148, metalness: .85, roughness: .32 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x1f2126, metalness: .7, roughness: .4 });
    const wood = new THREE.MeshStandardMaterial({ color: 0x6b3d1e, roughness: .55 });
    for (const x of [-0.022, 0.022]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.62, 14), steel); b.rotation.x = Math.PI / 2; b.position.set(x, 0.05, 0.36); gun.add(b); }
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.6), dark); rib.position.set(0, 0.075, 0.36); gun.add(rib);
    const fore = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.05, 0.2), wood); fore.position.set(0, 0.02, 0.3); gun.add(fore);
    const recv = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.18), dark); recv.position.set(0, 0.03, 0.0); gun.add(recv);
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.09), wood); grip.position.set(0, -0.06, -0.1); grip.rotation.x = 0.5; gun.add(grip);
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.12, 0.34), wood); stock.position.set(0, -0.02, -0.3); stock.rotation.x = -0.08; gun.add(stock);
    const guard = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.008, 8, 16, Math.PI), steel); guard.position.set(0, -0.02, 0.0); guard.rotation.set(Math.PI, Math.PI / 2, 0); gun.add(guard);
    gun.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  }
  gun.scale.setScalar(1.25);
  scene.add(gun);
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0 }));
  muzzle.position.set(0, 0.05, 0.72); gun.add(muzzle);
  const GUN_REST = { pos: new THREE.Vector3(0.05, TABLE_Y + 0.07, 0.05), rot: new THREE.Euler(0, 0.5, Math.PI / 2) };

  // ---- 弾(赤=実弾、灰=空砲) ----
  const shellMats = { live: new THREE.MeshStandardMaterial({ color: 0xc8322f, roughness: .5 }), blank: new THREE.MeshStandardMaterial({ color: 0x6f7c8a, roughness: .5 }) };
  const brass = new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: .8, roughness: .3 });
  const makeShell = (t) => {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.075, 12), shellMats[t]); body.position.y = 0.05; g.add(body);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.02, 12), brass); base.position.y = 0.01; g.add(base);
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    return g;
  };
  const shellGroup = new THREE.Group(); scene.add(shellGroup);

  // ---- テーブルに置いたアイテム(絵文字の板) ----
  const iconTex = {};
  const iconOf = (icon) => iconTex[icon] ||= canvasTex(128, 128, (g, w, hh) => {
    g.fillStyle = "rgba(250,244,230,.92)"; g.beginPath(); g.arc(w / 2, hh / 2, 60, 0, Math.PI * 2); g.fill();
    g.font = "76px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(icon, w / 2, hh / 2 + 4);
  });
  const itemGroup = new THREE.Group(); scene.add(itemGroup);

  // ---- 席の目印(手番の光る輪) ----
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 8, 40), new THREE.MeshBasicMaterial({ color: 0xf2c14e }));
  ring.rotation.x = Math.PI / 2; ring.visible = false; scene.add(ring);

  // ---- キャラクター ----
  let robotSrc = null, robotScale = 1;
  const robots = new Map(); // pid → {root, mixer, actions, current, head, plate, plateKey, dead, pos}
  new GLTFLoader().load("/models/RobotExpressive.glb", (gltf) => {
    robotSrc = gltf;
    const box = new THREE.Box3().setFromObject(gltf.scene);
    robotScale = 1.4 / (box.max.y - box.min.y);
    if (S) update(S, me);
  }, undefined, (e) => console.error("キャラクターの読み込みに失敗:", e));

  function makeRobot(id) {
    const root = SkeletonUtils.clone(robotSrc.scene);
    root.scale.setScalar(robotScale);
    let head = null;
    root.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.material = o.material.clone();
      if (o.material.name === "Main") o.material.color.set(colorOf(id));
      if (o.morphTargetDictionary && o.morphTargetDictionary.Surprised != null) head = o;
    });
    const mixer = new THREE.AnimationMixer(root);
    const actions = {};
    for (const clip of robotSrc.animations) actions[clip.name] = mixer.clipAction(clip);
    for (const n of ["Death", "Yes", "No", "ThumbsUp", "Wave", "Punch", "Jump"]) { if (!actions[n]) continue; actions[n].setLoop(THREE.LoopOnce, 1); actions[n].clampWhenFinished = true; }
    const r = { id, root, mixer, actions, current: null, head, plate: null, plateKey: "", dead: false, pos: new THREE.Vector3(), mood: null };
    mixer.addEventListener("finished", (e) => { if (!r.dead && e.action !== actions.Death) fade(r, r.base || "Idle"); });
    fade(r, "Idle", 0);
    scene.add(root);
    return r;
  }
  function fade(r, name, dur = 0.3) {
    const a = r.actions[name]; if (!a || r.current === a) { if (a && a.loop === THREE.LoopOnce) a.reset().play(); return; }
    a.reset().fadeIn(dur).play();
    if (r.current) r.current.fadeOut(dur);
    r.current = a;
  }
  function setMood(r, mood) {
    if (!r.head || r.mood === mood) return;
    r.mood = mood;
    const d = r.head.morphTargetDictionary, inf = r.head.morphTargetInfluences;
    for (const k of ["Angry", "Surprised", "Sad"]) if (d[k] != null) inf[d[k]] = k === mood ? 1 : 0;
  }
  const plateCanvas = (p, isTurn) => {
    const c = document.createElement("canvas"); c.width = 512; c.height = 150;
    const g = c.getContext("2d");
    g.fillStyle = isTurn ? "rgba(242,193,78,.95)" : "rgba(15,10,6,.78)";
    if (g.roundRect) { g.beginPath(); g.roundRect(4, 4, 504, 142, 24); g.fill(); } else g.fillRect(4, 4, 504, 142);
    g.fillStyle = isTurn ? "#181b23" : "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "bold 54px 'Zen Kaku Gothic New', sans-serif"; g.fillText(p.name.slice(0, 10), 256, 52);
    const s = gseat(p.id);
    g.font = "bold 40px 'Zen Kaku Gothic New', sans-serif";
    g.fillStyle = isTurn ? "#b3261e" : "#ff8a8a";
    g.fillText(!s || S.phase === "lobby" ? "待機中" : s.alive ? hearts(s.hp, S.game.maxHp) + (s.cuffed ? " ⛓" : "") : "脱落", 256, 112);
    return c;
  };

  // ---- 簡単なトゥイーン ----
  const tweens = [];
  const tween = (dur, step, done) => { tweens.push({ t0: performance.now(), dur, step, done }); };
  const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  // ---- 席の位置: 自分の席がいちばん手前(カメラ側)に来るように回す ----
  let seatIds = [], myIndex = -1;
  const seatPos = (i, r = SEAT_R) => { const n = Math.max(seatIds.length, 2), th = ((i - Math.max(myIndex, 0)) * 2 * Math.PI) / n; return new THREE.Vector3(Math.sin(th) * r, 0, Math.cos(th) * r); };
  const seatOf = (id) => seatIds.indexOf(id);
  const headPos = (id) => { const i = seatOf(id); if (i < 0) return new THREE.Vector3(0, 2, 0); return seatPos(i).setY(1.62); };
  // ---- 視点 ----
  // 席についているときは一人称(自分の席の目の高さ)。スワイプ/ドラッグで首を振って見回す。
  // 観戦中は上から見下ろし、スワイプでテーブルの周りを回る
  const EYE_Y = 1.42, PITCH0 = -0.24, YAW_MAX = 2.4, PITCH_MIN = -0.9, PITCH_MAX = 0.35;
  const look = { yaw: 0, pitch: PITCH0, tYaw: 0, tPitch: PITCH0 };
  const seatedNow = () => myIndex >= 0;
  function placeCamera() {
    const aspect = camera.aspect;
    camera.fov = seatedNow() ? (aspect < 1 ? 78 : 62) : (aspect < 1 ? 60 : 50);
    camera.updateProjectionMatrix();
    aimCamera();
  }
  function aimCamera() {
    if (seatedNow()) {
      camera.position.set(0, EYE_Y, SEAT_R + 0.1);
      const cp = Math.cos(look.pitch);
      camera.lookAt(Math.sin(look.yaw) * cp, EYE_Y + Math.sin(look.pitch), SEAT_R + 0.1 - Math.cos(look.yaw) * cp);
    } else {
      const d = camera.aspect < 1 ? 5.2 : 4.4, up = camera.aspect < 1 ? 5.4 : 4.3;
      camera.position.set(Math.sin(look.yaw) * d, up, Math.cos(look.yaw) * d);
      camera.lookAt(0, TABLE_Y, 0);
    }
  }
  // 指定した人のほうへ顔を向ける
  function lookAtSeat(id) {
    const i = seatOf(id);
    if (i < 0 || !seatedNow() || i === myIndex) return;
    const p = seatPos(i), dx = p.x, dz = p.z - (SEAT_R + 0.1);
    look.tYaw = Math.atan2(dx, -dz);
    look.tPitch = Math.atan2(1.25 - EYE_Y, Math.hypot(dx, dz));
  }
  function lookFront() { look.tYaw = 0; look.tPitch = PITCH0; }
  // スワイプ/ドラッグで見回す。動かさずに離したら「タップ」: 人に当たればその人を見る
  {
    let drag = null;
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    canvas.addEventListener("pointerdown", (e) => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); hideHint(); });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      const k = (camera.fov * Math.PI / 180) / Math.max(1, host.clientHeight);
      look.tYaw -= dx * k * (seatedNow() ? 1 : 1.5);
      if (seatedNow()) {
        look.tYaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, look.tYaw));
        look.tPitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, look.tPitch + dy * k));
      }
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const tap = drag.moved < 8; drag = null;
      if (!tap) return;
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hits = ray.intersectObjects([...robots.values()].map((x) => x.root), true);
      if (hits.length) for (const [id, x] of robots) { let o = hits[0].object; while (o && o !== x.root) o = o.parent; if (o) { lookAtSeat(id); break; } }
    };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", () => { drag = null; });
  }
  const frontBtn = h("button", { type: "button", class: "lookFront", onclick: lookFront }, "正面を見る");
  host.append(frontBtn);
  let hintEl = null;
  if (!store.get("shotgun:lookHint")) {
    hintEl = h("div", { class: "lookHint" }, "スワイプで見回せます・人をタップでその人を見る");
    host.append(hintEl);
    setTimeout(hideHint, 6000);
  }
  function hideHint() { if (!hintEl) return; store.set("shotgun:lookHint", 1); hintEl.style.opacity = "0"; const el = hintEl; hintEl = null; setTimeout(() => el.remove(), 700); }

  // ---- 吹き出し(スタンプ)は HTML を3D座標に合わせて置く ----
  const bubbles = new Map(); // pid → {el, until}
  const STAMP_ANIM = ["Yes", "No", "Wave", "Punch", "Jump", "No", "ThumbsUp", "ThumbsUp", "Wave", "Jump"];
  function stamp(from, text, i) {
    const old = bubbles.get(from); if (old) old.el.remove();
    const el = h("div", { class: "bubble" }, text);
    host.append(el);
    bubbles.set(from, { el, until: performance.now() + 2600 });
    const r = robots.get(from);
    if (r && !r.dead) fade(r, STAMP_ANIM[i] || "Wave", 0.2);
  }

  // ---- 状態の反映 ----
  let visible = true, lastSeq = 0, itemsSig = "", shotBusy = null;
  function update(st, meId) {
    const ids = stageSeats();
    const mi = ids.indexOf(meId);
    const seatsChanged = ids.join() !== seatIds.join() || mi !== myIndex;
    seatIds = ids; myIndex = mi;
    if (seatsChanged) { look.yaw = look.tYaw = 0; look.pitch = look.tPitch = PITCH0; placeCamera(); }
    const g = st.game;
    // キャラクター: 自分(一人称)以外の席に置く
    if (robotSrc) {
      for (const [id, r] of robots) if (!ids.includes(id) || id === meId) { scene.remove(r.root); if (r.plate) scene.remove(r.plate); robots.delete(id); }
      ids.forEach((id, i) => {
        if (id === meId) return;
        let r = robots.get(id);
        if (!r) { r = makeRobot(id); robots.set(id, r); }
        const p = seatPos(i); r.pos.copy(p);
        r.root.position.copy(p);
        r.root.rotation.y = Math.atan2(-p.x, -p.z);
        const pl = player(id), s = g && gseat(id);
        const isDead = st.phase !== "lobby" && s && !s.alive;
        if (isDead && !r.dead) { r.dead = true; fade(r, "Death", 0.2); setMood(r, "Sad"); }
        if (!isDead && r.dead) { r.dead = false; fade(r, "Idle", 0.2); setMood(r, null); }
        r.base = st.phase === "finished" && st.ranking?.[0]?.id === id ? "Dance" : "Idle";
        if (!r.dead && r.current && r.current.loop !== THREE.LoopOnce && r.current !== r.actions[r.base]) fade(r, r.base);
        // 名札
        const turn = g && g.step === "turn" && g.turnId === id;
        const key = pl ? `${pl.name}|${s?.hp}|${s?.alive}|${s?.cuffed}|${turn}|${st.phase}` : "";
        if (pl && key !== r.plateKey) {
          r.plateKey = key;
          const tex = new THREE.CanvasTexture(plateCanvas(pl, turn)); tex.colorSpace = THREE.SRGBColorSpace;
          if (!r.plate) { r.plate = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false })); r.plate.scale.set(0.9, 0.264, 1); r.plate.renderOrder = 5; scene.add(r.plate); }
          else { r.plate.material.map.dispose(); r.plate.material.map = tex; }
        }
        if (r.plate) r.plate.position.set(p.x, 1.82, p.z);
      });
    }
    // 手番の輪
    const ti = g && g.step === "turn" ? seatOf(g.turnId) : -1;
    ring.visible = ti >= 0;
    if (ti >= 0) ring.position.copy(seatPos(ti, ti === myIndex ? SEAT_R - 0.35 : SEAT_R)).setY(0.02);
    // 各自のアイテムを席の前のテーブルに並べる
    const sig = g && st.phase === "play" ? g.seats.map((s) => s.id + ":" + (s.alive ? s.items.join(",") : "")).join("|") + "|" + ids.join() : "";
    if (sig !== itemsSig) {
      itemsSig = sig; itemGroup.clear();
      if (g && st.phase === "play") for (const s of g.seats) {
        const i = seatOf(s.id); if (i < 0 || !s.alive) continue;
        const dir = seatPos(i, 1).normalize(), side = new THREE.Vector3(-dir.z, 0, dir.x), n = s.items.length;
        s.items.forEach((k, j) => {
          const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: iconOf(st.itemInfo[k].icon) }));
          sp.scale.set(0.15, 0.15, 1);
          sp.position.copy(dir).multiplyScalar(i === myIndex ? 1.0 : 1.05).addScaledVector(side, (j - (n - 1) / 2) * 0.16).setY(TABLE_Y + 0.11);
          itemGroup.add(sp);
        });
      }
    }
    // 出来事ごとの演出
    const ev = g?.event;
    if (ev && ev.seq !== lastSeq) {
      // 入室した時点の古い出来事は演出しない(ただし装填中なら弾は見せる)
      const first = lastSeq === 0; lastSeq = ev.seq;
      if (!first || (ev.type === "load" && g.step === "load")) {
        if (ev.type === "load") showShells(ev.live, ev.blank);
        else if (ev.type === "shot") shotAnim(ev, meId);
      }
    }
    if (!g || st.phase !== "play") { shellGroup.clear(); restGun(); }
  }
  // 装填: 込める弾をテーブルに並べて見せてから消す(並びは種類ごと。実際の順番はわからない)
  function showShells(live, blank) {
    shellGroup.clear();
    const list = [...Array(live).fill("live"), ...Array(blank).fill("blank")], n = list.length;
    list.forEach((t, i) => {
      const m = makeShell(t);
      m.position.set((i - (n - 1) / 2) * 0.085, TABLE_Y + 0.03, 0.42);
      m.scale.setScalar(0.01);
      shellGroup.add(m);
      setTimeout(() => tween(250, (k) => m.scale.setScalar(Math.max(0.01, k * 1.3))), i * 70);
    });
    setTimeout(() => tween(400, (k) => shellGroup.children.forEach((m) => m.scale.setScalar(Math.max(0.01, 1.3 * (1 - k)))), () => shellGroup.clear()), 3000);
    lookFront();
  }
  function restGun() {
    if (shotBusy) return;
    const fromP = gun.position.clone(), fromQ = gun.quaternion.clone();
    const to = new THREE.Object3D(); to.position.copy(GUN_REST.pos); to.rotation.copy(GUN_REST.rot);
    if (fromP.distanceTo(to.position) < 0.01) return;
    tween(500, (t) => { const e = ease(t); gun.position.lerpVectors(fromP, to.position, e); gun.quaternion.slerpQuaternions(fromQ, to.quaternion, e); });
  }
  // 撃つ: 撃つ人の前に構えて、撃たれる人の頭(自分ならカメラ)へ向け、実弾なら閃光。最後にテーブルへ戻す
  function shotAnim(ev, meId) {
    const bi = seatOf(ev.by), tiS = seatOf(ev.target);
    if (bi < 0 || tiS < 0) return;
    clearTimeout(shotBusy);
    const meShoots = ev.by === meId, meHit = ev.target === meId;
    const dirB = seatPos(bi, 1).normalize();
    const hold = new THREE.Object3D();
    hold.position.copy(meShoots ? new THREE.Vector3(0.3, EYE_Y - 0.42, SEAT_R - 0.9) : seatPos(bi, SEAT_R - 0.45).setY(1.15).addScaledVector(new THREE.Vector3(-dirB.z, 0, dirB.x), 0.15));
    // 自分を撃つときは銃口を自分の頭へ(自分が撃たれるならカメラへ。真正面だと棒に見えるので少しずらす)
    const at = meHit ? camera.position.clone().add(new THREE.Vector3(meShoots ? 0.6 : -1.2, -0.35, 0)) : headPos(ev.target);
    if (ev.by === ev.target && !meHit) hold.position.copy(headPos(ev.by)).addScaledVector(dirB, -0.55).add(new THREE.Vector3(0.18, 0, 0));
    hold.lookAt(at);
    if (meHit) lookFront(); else if (!meShoots) lookAtSeat(ev.target);
    const fromP = gun.position.clone(), fromQ = gun.quaternion.clone();
    tween(450, (t) => { const e = ease(t); gun.position.lerpVectors(fromP, hold.position, e); gun.quaternion.slerpQuaternions(fromQ, hold.quaternion, e); });
    shotBusy = setTimeout(() => {
      if (ev.shell === "live") {
        flashLight.position.copy(gun.position); flashLight.intensity = 45; muzzle.material.opacity = 1;
        tween(500, (t) => { flashLight.intensity = 45 * (1 - t); muzzle.material.opacity = 1 - t; });
        tween(220, (t) => { gun.rotateX(-0.02 * (1 - t)); });
        const r = robots.get(ev.target);
        if (r && !r.dead) { setMood(r, "Surprised"); setTimeout(() => !r.dead && setMood(r, null), 1500); }
      } else tween(160, (t) => { gun.rotateX(-0.004 * (1 - t)); });
      // 薬莢が横へ飛ぶ
      const sh = makeShell(ev.shell); sh.position.copy(gun.position); scene.add(sh);
      const v0 = new THREE.Vector3((Math.random() - .5) * 0.8, 1.2, (Math.random() - .5) * 0.8);
      tween(700, (t) => { sh.position.set(gun.position.x + v0.x * t, gun.position.y + v0.y * t - 2.4 * t * t, gun.position.z + v0.z * t); sh.rotation.x += 0.4; }, () => scene.remove(sh));
      shotBusy = setTimeout(() => { shotBusy = null; restGun(); }, 1300);
    }, 520);
  }
  function itemUsed(ev) { stamp(ev.by, itemName(ev.item), 0); }

  // ---- 描画ループ ----
  const clock = new THREE.Clock();
  const v = new THREE.Vector3();
  function frame() {
    requestAnimationFrame(frame);
    if (!visible || document.hidden) return;
    const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
    for (const r of robots.values()) r.mixer.update(dt);
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i], t = Math.min(1, (now - tw.t0) / tw.dur);
      tw.step(t);
      if (t >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
    }
    sign.rotation.y += dt * 0.6;
    sign.position.y = TABLE_Y + 0.62 + Math.sin(now / 600) * 0.03;
    if (ring.visible) ring.material.color.setHSL(0.12, 0.85, 0.5 + Math.sin(now / 250) * 0.15);
    const f = 1 - Math.pow(0.0001, dt); // 首の動きをなめらかに追いつかせる
    look.yaw += (look.tYaw - look.yaw) * f; look.pitch += (look.tPitch - look.pitch) * f;
    aimCamera();
    frontBtn.hidden = !seatedNow() || (Math.abs(look.tYaw) < 0.15 && Math.abs(look.tPitch - PITCH0) < 0.15);
    // 吹き出しを頭の上へ
    const rect = host.getBoundingClientRect();
    for (const [id, b] of bubbles) {
      if (b.until < now) { b.el.remove(); bubbles.delete(id); continue; }
      if (seatOf(id) === myIndex || seatOf(id) < 0) { b.el.style.left = "50%"; b.el.style.top = "88%"; continue; }
      // 名札のすぐ下(頭の上)に出す。舞台の外にはみ出さないように端で止める
      v.copy(headPos(id)).setY(1.62).project(camera);
      b.el.hidden = v.z > 1; // カメラの後ろ(見ていない方向)の人の吹き出しは出さない
      b.el.style.left = Math.min(rect.width - 60, Math.max(60, (v.x + 1) / 2 * rect.width)) + "px";
      b.el.style.top = Math.max(44, (1 - v.y) / 2 * rect.height) + "px";
    }
    renderer.render(scene, camera);
  }
  function resize() {
    const w = host.clientWidth, hh = host.clientHeight;
    if (!w || !hh) return;
    renderer.setSize(w, hh, false);
    camera.aspect = w / hh;
    placeCamera();
  }
  new ResizeObserver(resize).observe(host);
  resize();
  frame();
  // 最初はショットガンをテーブルの上に置いておく
  gun.position.copy(GUN_REST.pos); gun.rotation.copy(GUN_REST.rot);

  return {
    update,
    stamp,
    itemUsed,
    setVisible(b) {
      visible = b; canvas.style.display = b ? "block" : "none";
      if (!b) { for (const x of bubbles.values()) x.el.remove(); bubbles.clear(); }
    },
  };
}

connect();
</script>
<script src="/js/partybar.js" defer></script>
</body>
</html>
