<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エルドラドを目指して（The Quest for El Dorado風）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上=部屋と進行、中央=描く/見る/答え合わせ、下=プレイヤーと招待 */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4;
  --ink: #181b23; --gold: #f2c14e; --good: #1f8a4c; --bad: #c4323a;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947; --accent: #8f9cff; --good: #5fd28f; --bad: #ff7b82; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(32px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 999px; border: 1.5px solid var(--fg); font-size: 12px; font-weight: 700; background: var(--surface); white-space: nowrap; }
button.pill { cursor: pointer; font-family: var(--body); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.status { font-size: 13px; color: var(--muted); } .status.warn { color: var(--bad); }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.banner { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--fg); color: var(--surface); font-size: 13px; font-weight: 700; text-align: center; z-index: 30; }
a { color: var(--accent); }
body.playing .top h1 { font-size: 18px; } body.playing .top .eyebrow { display: none; }
.login { max-width: 460px; margin: 6vh auto 0; } .login .panel { gap: 16px; }
.or { text-align: center; font-size: 12px; color: var(--muted); }
.code { font-family: var(--display); letter-spacing: .15em; text-transform: uppercase; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 6px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { background: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.big { font-size: 17px; padding: 11px 22px; }
button.tiny { padding: 3px 9px; font-size: 12px; }
input[type=text] { font-family: var(--body); font-size: 16px; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.settings select { width: 100%; min-width: 0; }
.say { font-family: var(--display); font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
.say.good { color: var(--good); } .say.red { color: var(--bad); }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cd { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; } .cd.low { color: var(--bad); }
.chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #181b23; border: 1.5px solid #181b23; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.word { font-family: var(--display); font-size: 18px; }
.need { display: inline-block; font-family: var(--display); font-size: 18px; padding: 0 8px; border-radius: 6px; background: var(--gold); color: var(--ink); }

/* カード */
.cards { display: flex; flex-wrap: wrap; gap: 6px; }
.cardcell { display: grid; gap: 3px; justify-items: center; }
.ecard { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 2px; width: 92px; min-height: 120px; padding: 5px 6px; border: 2px solid #181b23; border-radius: 8px; background: #fffaf0; color: #181b23; text-align: left; font-family: var(--body); box-shadow: inset 0 6px 0 var(--cc); }
button.ecard { cursor: pointer; } button.ecard:hover { transform: translateY(-2px); }
.ecard.small { width: 78px; min-height: 84px; font-size: 11px; }
.ecard.sel { outline: 3px solid var(--accent); outline-offset: 1px; background: #eef1ff; transform: translateY(-4px); }
.ecard.empty { display: grid; place-items: center; color: var(--muted); border-style: dashed; box-shadow: none; }
.ecard .top { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; } .ecard .ic { font-size: 18px; } .ecard .p { font-family: var(--display); font-size: 22px; font-weight: 400; }
.ecard .nm { font-weight: 700; font-size: 13px; line-height: 1.2; } .ecard .tx { font-size: 10.5px; line-height: 1.3; color: #3a3f4b; }
.ecard .foot { display: flex; justify-content: space-between; font-size: 10.5px; color: #8a4a1a; font-weight: 700; } .ecard .cost { color: #181b23; }
.ecard .badge { position: absolute; top: -8px; right: -6px; font-size: 10px; font-weight: 700; background: #181b23; color: #fff; padding: 0 5px; border-radius: 999px; }
/* 盤面 */
.boardbox { display: grid; gap: 4px; }
.mapwrap { overflow: auto; max-height: min(62dvh, 560px); border: 2px solid var(--fg); border-radius: 8px; background: #2c4a33; -webkit-overflow-scrolling: touch; }
.hexmap { display: block; }
.hexmap .can { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { stroke-opacity: .4; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 3px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.3); }
.blk { display: inline-block; margin-right: 6px; font-weight: 700; } .blk.gone { opacity: .45; text-decoration: line-through; }
.handbox, .market { display: grid; gap: 6px; padding: 8px; border: 2px solid var(--line); border-radius: 10px; }
.endrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.keep { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; }
.prompt { border: 2px solid var(--accent); border-radius: 10px; padding: 8px; display: grid; gap: 6px; }
.players li.cur { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.log { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); display: grid; gap: 1px; max-height: 180px; overflow: auto; }
.rank { width: 100%; border-collapse: collapse; font-size: 14px; } .rank td { padding: 4px 6px; border-bottom: 1px solid var(--line); } .rank tr.me td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
h3 { font-size: 14px; margin: 0; }
/* 拡張(英雄と呪い・洞窟) */
.ecard.hero { background: #fff4d6; } .ecard.demon { background: #ece6f5; }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; } .tokcell { display: inline-flex; gap: 3px; align-items: center; }
.tok { padding: 3px 9px; font-size: 12px; border-radius: 999px; border: 2px solid #9d6fd1; background: #f6f0ff; color: #181b23; }
.tok.sym { border-color: var(--cc); background: #fff; } .tok.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.curse { padding: 4px 6px; border-left: 4px solid #5b3f8f; background: color-mix(in srgb, #5b3f8f 8%, transparent); border-radius: 4px; }
.toggles { display: grid; gap: 6px; } .toggle { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; } .toggle input { margin-top: 4px; }
.pextra { grid-column: 2 / -1; font-size: 11px; color: var(--muted); }
.modehint { font-weight: 700; color: var(--accent); }
/* プレイヤー */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.players li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.players li:last-child { border-bottom: none; }
.sw2 { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--fg); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; color: var(--accent); }
.pinfo { font-size: 12px; color: var(--muted); white-space: nowrap; }
.off { opacity: .5; }
.kick { grid-column: 2 / -1; justify-self: start; }
.invite { display: flex; gap: 6px; } .invite input { font-size: 13px; } .invite button { white-space: nowrap; flex: none; }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; }
.stamps button { padding: 4px 11px; font-size: 13px; border-radius: 999px; border-color: var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--surface); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; animation: pop .25s ease-out; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
/* スマホ: 前の絵を小さめにして横に並べ、画用紙まで1画面に収める */
@media (max-width: 520px) {
  .taskrow { grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
  .inputs input[type=text] { padding: 5px 8px; }
  .inputs .field { font-size: 12px; }
  body.playing .top h1 { font-size: 16px; }
  .panel { padding: 10px; gap: 8px; }
  .say { font-size: 17px; }
  .drawtools .sw { width: 24px; height: 24px; }
}
</style>
</head>
<body>
<div class="banner" id="banner" hidden></div>

<div class="login" id="login">
  <div class="wrap">
    <div><div class="eyebrow">デッキを育てて、黄金郷エルドラドへ一番乗り</div><h1>エルドラドを目指して <small style="font-size:.55em;font-family:var(--body);font-weight:700;opacity:.75;white-space:nowrap">（The Quest for El Dorado）</small></h1></div>
    <form class="panel" id="loginForm">
      <label class="field">ニックネーム<input type="text" id="lName" maxlength="12" autocomplete="nickname" placeholder="例: たろう"></label>
      <label class="field">部屋コード(友達から聞いたコード)<input type="text" id="lRoom" class="code" maxlength="6" autocomplete="off" placeholder="ABCD"></label>
      <div class="btns"><button class="primary" type="submit" id="lJoin">この部屋に入る</button></div>
      <div class="or">または</div>
      <div class="btns"><button type="button" id="lCreate">新しい部屋を作る</button><span class="muted small">部屋コードが自動で決まります</span></div>
      <p class="status" id="lMsg" aria-live="polite"></p>
    </form>
    <p class="small muted"><a href="/">← ゲームを選ぶ</a></p>
  </div>
</div>

<div class="wrap" id="game" hidden>
  <div class="top">
    <div><div class="eyebrow">デッキを育てて、黄金郷エルドラドへ一番乗り</div><h1>エルドラドを目指して <small style="font-size:.55em;font-family:var(--body);font-weight:700;opacity:.75;white-space:nowrap">（The Quest for El Dorado）</small></h1></div>
    <div class="meta" id="meta"></div>
  </div>
  <main class="panel" id="main"></main>
  <aside class="panel" id="side"></aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};
const COLORS = ["#e8574f", "#f0a03c", "#e6d14a", "#5cc46a", "#4d9de0", "#a46ee0", "#ee7fc0", "#5fd0c8"];

// ---- 端末ごとの保存(本人確認用ID・名前・音はほかのゲームと共通) ----
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function rnd(n, chars = "abcdefghijklmnopqrstuvwxyz0123456789") { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map((x) => chars[x % chars.length]).join(""); }
let ident = store.get("tier:ident");
if (!ident || !ident.pid || !ident.token) { ident = { pid: rnd(16), token: rnd(32) }; store.set("tier:ident", ident); }

let ws = null, retry = 0, everOpen = false, wantRoom = null, myName = "", joined = false;
let S = null, me = null, offset = 0;

// ---- 効果音 ----
const Sound = {
  ctx: null, on: store.get("tier:sound") !== false,
  setOn(v) { this.on = v; store.set("tier:sound", v); if (v) { this.unlock(); this.play("tap"); } },
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch {} },
  seq: { tap: [[880, 0, .06]], join: [[660, 0, .08], [880, .08, .12]], turn: [[784, 0, .1], [988, .1, .1], [1318, .2, .18]], done: [[1046, 0, .07]],
    reveal: [[392, 0, .14], [523, .14, .14], [659, .28, .14], [1046, .42, .4]], tick: [[1000, 0, .05]] },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== "running") return;
    const t0 = this.ctx.currentTime, soft = name === "tick" || name === "done";
    for (const [f, s, d] of this.seq[name] || []) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = soft ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + s); g.gain.exponentialRampToValueAtTime(soft ? 0.05 : 0.14, t0 + s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
      o.connect(g).connect(this.ctx.destination); o.start(t0 + s); o.stop(t0 + s + d + 0.02);
    }
  },
};
document.addEventListener("pointerdown", () => Sound.unlock());
document.addEventListener("keydown", () => Sound.unlock());

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/eldorado/ws");
  const slow = setTimeout(() => showBanner("サーバを起動しています。初回は1分ほどかかることがあります…"), 2500);
  ws.onopen = () => { clearTimeout(slow); retry = 0; everOpen = true; showBanner(""); if (wantRoom) send({ t: "join", room: wantRoom, name: myName, pid: ident.pid, token: ident.token }); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "joined") {
      joined = true; store.set("eldorado:last", { room: m.room, name: myName }); saveName(myName);
      history.replaceState(null, "", "/eldorado?room=" + m.room);
      $("login").hidden = true; $("game").hidden = false;
    } else if (m.t === "db") { DB = m; if (S) render();
    } else if (m.t === "state") {
      const prev = S; S = m.room; me = m.me; offset = m.now - Date.now();
      onTransition(prev, S); render();
    } else if (m.t === "stamp") { const t = S?.stamps?.[m.i]; if (t) toast(`${nameOf(m.from)}「${t}」`); }
    else if (m.t === "kicked") backToLogin("ホストによって部屋から退出しました", true);
    else if (m.t === "error") { if (!joined) { $("lMsg").textContent = m.msg; $("lMsg").classList.add("warn"); wantRoom = null; setLoginBusy(false); } else flash(m.msg, true); }
    else if (m.t === "info") flash(m.msg);
  };
  ws.onclose = () => { clearTimeout(slow); if (joined || wantRoom) showBanner(everOpen ? "接続が切れました。再接続しています…" : "サーバに接続しています…"); setTimeout(connect, Math.min(8000, 800 * 2 ** retry++)); };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function showBanner(t) { $("banner").textContent = t; $("banner").hidden = !t; }
let flashT;
function flash(msg, warn) { const el = $("flashMsg"); if (!el) return toast(msg); el.textContent = msg; el.classList.toggle("warn", !!warn); clearTimeout(flashT); flashT = setTimeout(() => { el.textContent = ""; }, 6000); }
function toast(t) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const el = h("div", { class: "toast", role: "status" }, t); document.body.append(el); setTimeout(() => el.remove(), 2500); }

function saveName(name) { const t = store.get("tier:last") || { room: "" }; store.set("tier:last", { ...t, name }); }
function setLoginBusy(b) { $("lJoin").disabled = b; $("lCreate").disabled = b; }
function backToLogin(msg, warn) {
  joined = false; wantRoom = null; S = null; 
  store.set("eldorado:last", { room: "", name: myName });
  history.replaceState(null, "", "/eldorado");
  document.body.classList.remove("playing");
  $("game").hidden = true; $("login").hidden = false; setLoginBusy(false);
  $("lMsg").textContent = msg || ""; $("lMsg").classList.toggle("warn", !!warn);
}
function enter(code) {
  const name = $("lName").value.trim().slice(0, 12);
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  const msg = $("lMsg"); msg.classList.add("warn");
  if (!name) { msg.textContent = "ニックネームを入れてください"; return; }
  if (code.length < 4) { msg.textContent = "部屋コードは4〜6文字の英数字です"; return; }
  msg.classList.remove("warn"); msg.textContent = "入室しています…";
  myName = name; wantRoom = code; setLoginBusy(true);
  send({ t: "join", room: code, name, pid: ident.pid, token: ident.token });
}
$("loginForm").addEventListener("submit", (e) => { e.preventDefault(); enter($("lRoom").value); });
$("lCreate").addEventListener("click", () => { const c = rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"); $("lRoom").value = c; enter(c); });
{
  const last = store.get("eldorado:last"), name = last?.name || store.get("tier:last")?.name;
  const q = new URLSearchParams(location.search).get("room");
  if (name) $("lName").value = name;
  if (q) $("lRoom").value = q.toUpperCase().slice(0, 6);
  if (last?.name && q && last.room === q.toUpperCase()) { myName = last.name; wantRoom = last.room; $("lMsg").textContent = "前回の部屋に戻っています…"; setLoginBusy(true); }
}

// ---- 共通 ----
let DB = { cards: {}, courses: {}, tokens: {}, curses: {} };
const player = (id) => S?.players.find((p) => p.id === id);
const nameOf = (id) => player(id)?.name || "退出した人";
const PCOL = ["#e5484d", "#f2f0e6", "#9d7df7", "#ff9636"];
const colorOf = (id) => { const o = S.game?.order; let i = o ? o.indexOf(id) : -1; if (i < 0) i = S.players.findIndex((p) => p.id === id); return PCOL[(i < 0 ? 0 : i) % PCOL.length]; };
const chip = (id) => h("span", { class: "chip", style: `background:${colorOf(id)}` }, nameOf(id) + (id === me ? "(あなた)" : ""));
const isGM = () => S.gameHostId === me;
const remaining = () => S?.deadline ? Math.max(0, Math.ceil((S.deadline - (Date.now() + offset)) / 1000)) : null;

    act("enterCards", { to: hx.k, cards: [...local.sel], piece }); resetSel(); return;
  }
  const src = sourceForMove(g);
  if (!src) return toast("先に手札のカード(または記号の洞窟トークン)を1つ選んでください");
  act("move", { ...src, to: hx.k, piece, boost: local.boost || undefined });
  resetSel();
}
// 進むのに使うもの: 選んだカード1枚・記号トークン1つ・続けて進んでいる途中のカード
function sourceForMove(g) {
  if (local.sel.size === 1 && !local.tsel.size) return { card: [...local.sel][0] };
  if (local.tsel.size === 1 && !local.sel.size) return { token: [...local.tsel][0] };
  if (!local.sel.size && !local.tsel.size && g.move) return g.move.token != null ? { token: g.move.token } : { card: g.move.card };
  return null;
}

// ---- 手札・洞窟トークン・呪い ----
const ACT_TO = new Set(["native", "geologist", "isabella"]);
function renderHand(main, g, myTurn) {

    return h("div", { class: "cardcell" }, el, myTurn && d.a ? h("button", { type: "button", class: "tiny", onclick: () => useAction(g, c) }, "使う") : null);
  })));

  if (myTurn && pet) box.append(h("label", { class: "small keep" }, h("input", { type: "checkbox", checked: local.boost, onchange: (e) => { local.boost = e.target.checked; render(); } }), `${cardDef(pet.k).name} の特殊能力を使う(パワー${cardDef(pet.k).boost}。使うとゲームから除外)`));
  // 洞窟トークン

    box.append(h("h3", {}, `洞窟トークン(${tokens.length})`), h("div", { class: "tokens" }, ...tokens.map((t) => {
      const d = DB.tokens[t.k] || {};
      const b = h("button", { type: "button", class: "tok" + (local.tsel.has(t.id) ? " sel" : "") + (d.s ? " sym" : ""), style: d.s ? `--cc:${SYM[d.s].c}` : "", title: d.text || "", disabled: !myTurn, onclick: () => { if (local.tsel.has(t.id)) local.tsel.delete(t.id); else local.tsel.add(t.id); render(); } }, (d.s ? SYM[d.s].ic : "⛏") + " " + d.name);
      const use = myTurn && !d.s && !["protect", "market"].includes(t.k) ? h("button", { type: "button", class: "tiny", onclick: () => useToken(g, t) }, "使う") : null;
      return h("span", { class: "tokcell" }, b, use);
    })));
  }
  // 呪い
  if (p.curses.length) box.append(h("h3", {}, "呪い"), ...p.curses.map((cu) => { const d = DB.curses[cu.k] || {}; return h("div", { class: "curse small" }, h("b", {}, d.name), " ", d.text, myTurn ? h("button", { type: "button", class: "tiny", onclick: () => { act("lift", { curse: cu.id, cards: [...local.sel], tokens: [...local.tsel] }); resetSel(); } }, "選んだもので解く") : null); }));

    for (const b of near) box.append(h("div", { class: "btns" }, h("button", { type: "button", class: "primary", onclick: () => { const src = sourceForMove(g) || {}; act("blockade", { n: b.n, ...(b.t === "r" ? {} : src), cards: [...local.sel], piece, boost: local.boost || undefined }); resetSel(); } },

function useAction(g, c) {

  act("action", { card: c.id, piece: myPiece(g) }); resetSel();
}
function useToken(g, t) {
  const sel = [...local.sel];
  if (t.k === "native" || t.k === "geostep") { resetSel(); local.mode = "tokmove"; local.modeCard = t.id; toast("進むマスを押してください"); render(); return; }
  if (t.k === "trash" && sel.length !== 1) return toast("除外する手札を1枚選んでから押してください");
  if (t.k === "swap" && (sel.length < 1 || sel.length > 4)) return toast("入れ替える手札を1〜4枚選んでから押してください");
  if (t.k === "banish") {
    const dm = sel.map((id) => g.hand.find((x) => x.id === id)).find((c) => c && cardDef(c.k).demon);
    if (!dm) return toast("手札の魔物カードを選んでから押してください");
    const others = g.order.filter((id) => id !== me);
    const target = others.length === 1 ? others[0] : null;
    if (target) { act("token", { id: t.id, card: dm.id, target }); resetSel(); return; }
    local.mode = "banish"; local.modeCard = t.id; local.banishCard = dm.id; render(); return;
  }
  if (t.k === "change") local.changeCard = sel.length === 1 ? sel[0] : null;
  act("token", { id: t.id, card: sel[0], cards: sel }); resetSel();
}

// ---- 市場 ----
function renderMarket(main, g, myTurn) {
  const box = h("div", { class: "market" }, h("h3", {}, "市場" + (g.bought && myTurn ? "(このターンは購入済み)" : "")));
  if (local.mode === "banish" && myTurn) box.append(h("div", { class: "prompt" }, "魔物カードを渡す相手: ", ...g.order.filter((id) => id !== me).map((id) => h("button", { type: "button", class: "tiny", onclick: () => { act("token", { id: local.modeCard, card: local.banishCard, target: id }); resetSel(); } }, nameOf(id)))));

  const buy = (k, outside) => {
    if (!myTurn) return;
    if (local.mode === "market") { act("action", { card: local.modeCard, k }); resetSel(); return; }
    if (!local.sel.size && !local.tsel.size) return toast("払うカード(またはコインの洞窟トークン)を選んでから押してください");

  box.append(h("div", { class: "cards" }, ...g.market.map((s) => s ? cardEl({ k: s.k }, { small: true, badge: `残り${s.n}`, onclick: myTurn ? () => buy(s.k, false) : null }) : h("div", { class: "ecard empty small" }, "空き"))));
  const hole = g.market.some((s) => !s), canOut = hole || (local.mode === "market" && cardDef((g.hand || []).find((x) => x.id === local.modeCard)?.k).name === "電信機") || !!access;
  box.append(h("details", { open: hole || local.mode === "market" }, h("summary", { class: "small" }, hole ? "市場の外のカード(市場に空きがあるので買えます)" : access ? "市場の外のカード(「市場への道」で買えます)" : "市場の外のカード(市場に空きができたら買えます)"),
    h("div", { class: "cards" }, ...Object.entries(g.reserve).map(([k, n]) => cardEl({ k }, { small: true, badge: `残り${n}`, onclick: myTurn && canOut ? () => buy(k, true) : null })))));
  main.append(box);
}
function renderResult(main, g) {
  const rows = g.result || [];
  main.append(h("div", { class: "say good" }, rows[0]?.arrived ? `🏆 ${nameOf(rows[0].id)} さんがエルドラドに一番乗り！` : "ゲーム終了"),
    h("table", { class: "rank" }, h("tbody", {}, ...rows.map((r, i) => h("tr", { class: r.id === me ? "me" : "" }, h("td", {}, `${i + 1}位`), h("td", {}, chip(r.id)), h("td", {}, r.arrived ? "到着" : `あと${r.dist}マス`), h("td", { class: "small" }, `バリケード${r.nb}`))))),
    h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "again" }) }, "待機画面に戻る")));
}
function renderLobby(main) {

  } }, ...opts.map(([v, t]) => h("option", { value: String(v), selected: st[key] === v }, t))));

    h("ol", { class: "rules" },
      h("li", {}, "手札4枚。カードのパワーで、同じ種類のとなりのマスへ進みます(🌿ナタ=ジャングル・🛶パドル=川・🪙コイン=村)。マスの•の数が必要なパワー。残ったパワーで続けて進めます。カードは1枚ずつ(合わせられない)。"),
      h("li", {}, "荒地は手札を指定の枚数捨て、ベースキャンプは手札を指定の枚数ゲームから除外して入ります(弱いカードを減らすチャンス)。ほかのコマのいるマスと山には入れません。"),
      h("li", {}, "1ターンに1枚、市場でカードを買えます(買うのは進み終わってから)。コインのカードはその数、ほかのカードは0.5コイン。買ったカードは捨て札へ。ボードの境目のバリケードは、最初に通る人が取り除きます。"),

    h("div", { class: "settings" },
      sel("コース(本家のルールブック)", "course", Object.entries(DB.courses).map(([k, c]) => [k, `${c.exp === "hh" ? "【英雄と呪い】" : ""}${c.name}(${c.diff})`])),
      sel("1手の持ち時間", "turnSecs", [[120, "120秒"], [60, "60秒"], [180, "180秒"], [0, "なし"]])),
    h("div", { class: "toggles" },
      tog("洞窟ルール(基本セットの上級ルール)", "caves", "洞窟のある山のとなりに止まると、洞窟トークン(1回使える特典)がもらえる。", st.hh),
      tog("拡張「英雄と呪い」", "hh", "魔物マス・トンネル・呪い・魔物カード・酒場の英雄・動物カード・新しい市場カード4種・新しい洞窟トークン。洞窟ルールも入ります。", hhCourse)),
    st.hh ? h("p", { class: "small muted" }, "※拡張の洞窟トークン18個の種類ごとの内訳は公表資料が見つからなかったため推定です(魔物払い5・呪いよけ5・地質学者の一歩4・市場への道4)。英雄と呪いのコースでないときは、酒場(英雄)と魔物マスはありません。") : null,
    h("p", { class: "muted small" }, "2〜4人(2人のときは1人2コマで、両方着いたら到着)。約30〜60分。"));
  if (gm) main.append(h("div", { class: "btns" }, h("button", { class: "primary big", type: "button", disabled: live < 2, onclick: () => send({ t: "start" }) }, "スタート"),
    h("span", { class: "muted small" }, live < 2 ? "招待リンクを友達に送ってください。2人以上で始められます" : live > 4 ? "先に入った4人で始めます(ほかの人は観戦)" : `${live}人で始められます`)));
  else main.append(h("p", { class: "muted" }, `ホストの ${nameOf(S.gameHostId)} さんがスタートするのを待っています。`));
}
let lastSec = null;
