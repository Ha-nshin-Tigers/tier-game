/* レイアウト: 上部=部屋/ラウンド/テーブルカード、中央=酒場(3D または 2D)、その下=手札と操作、右=プレイヤーと記録 */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947; --accent: #8f9cff;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }

h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 酒場(3D/2D の舞台) */
.stage { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--fg); background: #120c08; aspect-ratio: 16 / 9; min-height: 300px; }
@media (max-width: 600px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #ff2a2a; mix-blend-mode: screen; }

.pc.match { box-shadow: inset 0 0 0 3px rgba(31,138,76,.55); }
.pc.back { background: repeating-linear-gradient(45deg, #7a1f1f 0 6px, #5c1414 6px 12px); color: transparent; }
button.pc { cursor: pointer; padding: 0; }
button.pc.sel { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
button.pc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cards.small .pc { width: 46px; height: 66px; font-size: 22px; }
.cards.small .pc small { display: none; }

/* 操作 */
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 4px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
@media (hover: hover) { button:hover:not(:disabled) { background: var(--bg); } } /* スマホはタップ後も hover が残るので、マウスのある端末だけ */
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.liar { background: var(--blood); color: #fff; border-color: var(--blood); font-family: var(--display); font-weight: 400; font-size: 18px; padding: 10px 22px; }

.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

.players li:last-child { border-bottom: none; }
.players li.dead .pname { text-decoration: line-through; color: var(--muted); }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--fg); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; }
.pname .tag.gm { color: var(--accent); }
.pinfo { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }

.kick { grid-column: 2 / -1; justify-self: start; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12px; color: var(--muted); }

.invite input { font-size: 13px; }

/* スマホのゲーム中: スクロールなしで1画面に収める(上=小さな情報帯、中=酒場、下=手札と操作)。

<script type="module">
const { $, h, store, saveName } = TG; // 全ページ共通の部品(public/js/common.js)
const RANK_NAME = { K: "キング", Q: "クイーン", A: "エース", J: "ジョーカー" };
const SEAT_COLORS = ["#e8574f", "#f0a03c", "#e6d14a", "#5cc46a", "#4d9de0", "#a46ee0"];

// ---- 端末ごとの保存 ----
// 本人確認用ID・ニックネーム・音の設定はほかのゲームと共通(tier:)、前回の部屋と表示方法はこのゲーム用(liar:)
function rnd(n, chars = "abcdefghijklmnopqrstuvwxyz0123456789") {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map((x) => chars[x % chars.length]).join("");
}
let ident = store.get("tier:ident");
if (!ident || !ident.pid || !ident.token) { ident = { pid: rnd(16), token: rnd(32) }; store.set("tier:ident", ident); }

// ---- 通信 ----
let ws = null, retry = 0, everOpen = false;
let wantRoom = null, myName = "", joined = false;
let S = null, me = null, offset = 0;
// パーティーのバー(js/partybar.js)が「遊んでいる途中か」を見られるように(この画面はモジュールなので変数が外から見えない)
Object.defineProperty(window, "S", { get: () => S, configurable: true });

// ---- 効果音(Web Audio で合成。ファイル不要) ----
const Sound = {
  ctx: null,
  on: store.get("tier:sound") !== false,
  setOn(v) { this.on = v; store.set("tier:sound", v); if (v) { this.unlock(); this.play("tap"); } },
  unlock() {
    try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch {}
  },
  // [周波数Hz, 開始秒, 長さ秒] の並び
  seq: {
    tap:    [[880, 0, .06]],
    join:   [[660, 0, .08], [880, .08, .12]],
    round:  [[392, 0, .1], [523, .1, .1], [659, .2, .18]],
    card:   [[1200, 0, .03], [900, .04, .03]],
    turn:   [[988, 0, .08], [1318, .1, .12]],
    liar:   [[220, 0, .12], [185, .12, .12], [147, .24, .3]],
    stamp:  [[1320, 0, .05]],
    win:    [[523, 0, .15], [659, .15, .15], [784, .3, .15], [1046, .45, .2], [784, .65, .12], [1046, .77, .5]],
    tick:   [[1000, 0, .05]],
  },

  } else if (aliveMe && P === "play") {

  }

  } else main.append(h("div", { class: "btns" }, stampToggle()));

}

// ---- 2D 表示 ----
function render2d() {

      h("div", { class: "nm" }, p.name + (id === me ? "(あなた)" : "")),
      h("div", {}, !inGame ? "待機中" : p.alive ? `手札 ${p.hand}枚 / 引き金 ${p.pulls}/${S.chambers}` : "脱落"));
    seats.append(el);
  }
  const center = h("div", { class: "center2d" });
  if (S.phase === "lobby") center.append(h("div", { class: "tc" }, "ウソつき酒場へようこそ"));
  else if (S.phase === "finished") center.append(h("div", { class: "tc" }, S.winner ? `${nameOf(S.winner)} の勝ち！` : "ゲーム終了"));
  else {
    center.append(h("div", { class: "tc" }, `テーブルカード: ${RANK_NAME[S.tableRank]}`), h("div", {}, `場に出たカード ${S.pile}枚`));
    if ((S.phase === "reveal" || S.phase === "shot") && S.reveal) center.append(h("div", { class: "cards small" }, ...S.reveal.cards.map((c) => cardEl(c, { table: S.tableRank }))));
    else if (S.lastPlay) center.append(h("div", { class: "cards small" }, ...Array.from({ length: S.lastPlay.count }, () => h("div", { class: "pc back" }))),
      h("div", { class: "small" }, `${nameOf(S.lastPlay.by)} が出した`));
  }
  b.append(seats, center, h("div"));

}
function render2dBubbles() {
  const b = $("board2d"); if (b.hidden) return;
  b.querySelectorAll(".bubble").forEach((x) => x.remove());

  for (const [id, s] of stampTimers) {

  bulb.position.set(0, 3.4, 0); scene.add(bulb);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 2.5), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  cord.position.set(0, 4.95, 0); scene.add(cord);

    const steel = new THREE.MeshStandardMaterial({ color: 0x4b4f57, metalness: .9, roughness: .3 });

    const grip = new THREE.MeshStandardMaterial({ color: 0x5a3417, roughness: .6 });
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.42, 16), steel); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.04, 0.27); gun.add(barrel);
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.025, 0.4), dark); rib.position.set(0, 0.075, 0.27); gun.add(rib);
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.14, 6), dark); drum.rotation.x = Math.PI / 2; drum.position.set(0, 0.025, 0.02); gun.add(drum);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.26), steel); frame.position.set(0, 0.03, -0.02); gun.add(frame);

    const guard = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.01, 8, 16, Math.PI), steel); guard.position.set(0, -0.04, 0.0); guard.rotation.set(Math.PI, Math.PI / 2, 0); gun.add(guard);

    const r = { id, root, mixer, actions, current: null, head, plate: null, plateKey: "", dead: false, pos: new THREE.Vector3(), mood: null };
    mixer.addEventListener("finished", (e) => { if (!r.dead && e.action !== actions.Death) fade(r, r.base || "Idle"); });

  function fade(r, name, dur = 0.3) {

    a.reset().fadeIn(dur).play();

  }
  const plateCanvas = (p, isTurn) => {
    const c = document.createElement("canvas"); c.width = 512; c.height = 150;
    const g = c.getContext("2d");
    g.fillStyle = isTurn ? "rgba(242,193,78,.95)" : "rgba(15,10,6,.78)";
    if (g.roundRect) { g.beginPath(); g.roundRect(4, 4, 504, 142, 24); g.fill(); } else g.fillRect(4, 4, 504, 142);
    g.fillStyle = isTurn ? "#181b23" : "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "bold 54px 'Zen Kaku Gothic New', sans-serif"; g.fillText(p.name.slice(0, 10), 256, 52);
    g.font = "bold 36px 'Zen Kaku Gothic New', sans-serif";

    return c;

  // ---- 簡単なトゥイーン ----
  const tweens = [];
  const tween = (dur, step, done) => { tweens.push({ t0: performance.now(), dur, step, done }); };
  const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  // ---- 席の位置: 自分の席がいちばん手前(カメラ側)に来るように回す ----

  // ---- 視点 ----

  const EYE_Y = 1.42, PITCH0 = -0.24, YAW_MAX = 2.4, PITCH_MIN = -0.9, PITCH_MAX = 0.35;
  const look = { yaw: 0, pitch: PITCH0, tYaw: 0, tPitch: PITCH0 };

  function placeCamera() {

  }
  function aimCamera() {
    if (seatedNow()) {

  }
  // 指定した人のほうへ顔を向ける
  function lookAtSeat(id) {
    const i = seatOf(id);
    if (i < 0 || !seatedNow() || i === myIndex) return;
    const p = seatPos(i), dx = p.x, dz = p.z - (SEAT_R + 0.1);
    look.tYaw = Math.atan2(dx, -dz);
    look.tPitch = Math.atan2(1.25 - EYE_Y, Math.hypot(dx, dz));
  }
  function lookFront() { look.tYaw = 0; look.tPitch = PITCH0; }
  // スワイプ/ドラッグで見回す。動かさずに離したら「タップ」: 人に当たればその人を見る
  {
    let drag = null;
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    canvas.addEventListener("pointerdown", (e) => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); hideHint(); });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      const k = (camera.fov * Math.PI / 180) / Math.max(1, host.clientHeight);
      look.tYaw -= dx * k * (seatedNow() ? 1 : 1.5);
      if (seatedNow()) {
        look.tYaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, look.tYaw));
        look.tPitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, look.tPitch + dy * k));
      }
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const tap = drag.moved < 8; drag = null;
      if (!tap) return;
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hits = ray.intersectObjects([...robots.values()].map((x) => x.root), true);
      if (hits.length) for (const [id, x] of robots) { let o = hits[0].object; while (o && o !== x.root) o = o.parent; if (o) { lookAtSeat(id); break; } }
    };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", () => { drag = null; });
  }
  const frontBtn = h("button", { type: "button", class: "lookFront", onclick: lookFront }, "正面を見る");
  host.append(frontBtn);
  let hintEl = null;
  if (!store.get("liar:lookHint")) {
    hintEl = h("div", { class: "lookHint" }, "スワイプで見回せます・人をタップでその人を見る");
    host.append(hintEl);
    setTimeout(hideHint, 6000);
  }
  function hideHint() { if (!hintEl) return; store.set("liar:lookHint", 1); hintEl.style.opacity = "0"; const el = hintEl; hintEl = null; setTimeout(() => el.remove(), 700); }

  // ---- 吹き出し(スタンプ)は HTML を3D座標に合わせて置く ----
  const bubbles = new Map(); // pid → {el, until}
  const STAMP_ANIM = ["Yes", "No", "Wave", "Punch", "Jump", "No", "ThumbsUp", "ThumbsUp", "Wave", "Jump"];
  function stamp(from, text, i) {
    const old = bubbles.get(from); if (old) old.el.remove();
    const el = h("div", { class: "bubble" }, text);
    host.append(el);
    bubbles.set(from, { el, until: performance.now() + 2600 });
    const r = robots.get(from);
    if (r && !r.dead) fade(r, STAMP_ANIM[i] || "Wave", 0.2);
  }

  // ---- 状態の反映 ----
  let lastSig = "", visible = true, gunTarget = null;
  function update(st, meId) {
    const ids = stageSeats();
    const mi = ids.indexOf(meId);
    const seatsChanged = ids.join() !== seatIds.join() || mi !== myIndex;
    seatIds = ids; myIndex = mi;
    if (seatsChanged) { look.yaw = look.tYaw = 0; look.pitch = look.tPitch = PITCH0; placeCamera(); }
    // キャラクター: 自分(一人称)以外の席に置く
    if (robotSrc) {
      for (const [id, r] of robots) if (!ids.includes(id) || id === meId) { scene.remove(r.root); if (r.plate) scene.remove(r.plate); robots.delete(id); }
      ids.forEach((id, i) => {
        if (id === meId) return;
        let r = robots.get(id);
        if (!r) { r = makeRobot(id); robots.set(id, r); }
        const p = seatPos(i); r.pos.copy(p);
        r.root.position.copy(p);
        r.root.rotation.y = Math.atan2(-p.x, -p.z);
        const pl = player(id);
        const inGame = st.phase !== "lobby";
        const isDead = inGame && pl && !pl.alive;
        if (isDead && !r.dead) { r.dead = true; fade(r, "Death", 0.2); setMood(r, "Sad"); }
        if (!isDead && r.dead) { r.dead = false; fade(r, "Idle", 0.2); setMood(r, null); }
        r.base = st.phase === "finished" && st.winner === id ? "Dance" : "Idle";
        if (!r.dead && r.current && r.current.loop !== THREE.LoopOnce && r.current !== r.actions[r.base]) fade(r, r.base);
        if (!r.dead) setMood(r, st.phase === "reveal" && st.reveal?.target === id ? "Surprised" : st.phase === "reveal" && st.reveal?.caller === id ? "Angry" : null);
        // 名札
        const key = pl ? `${pl.name}|${pl.hand}|${pl.pulls}|${pl.alive}|${st.phase === "lobby"}|${st.turnId === id && st.phase === "play"}` : "";
        if (pl && key !== r.plateKey) {
          r.plateKey = key;
          const tex = new THREE.CanvasTexture(plateCanvas(pl, st.turnId === id && st.phase === "play")); tex.colorSpace = THREE.SRGBColorSpace;
          if (!r.plate) { r.plate = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false })); r.plate.scale.set(0.9, 0.264, 1); r.plate.renderOrder = 5; scene.add(r.plate); }
          else { r.plate.material.map.dispose(); r.plate.material.map = tex; }
        }
        if (r.plate) r.plate.position.set(p.x, 1.82, p.z);
      });
    }
    // 手番の輪
    const ti = st.phase === "play" ? seatOf(st.turnId) : -1;
    ring.visible = ti >= 0;
    if (ti >= 0) ring.position.copy(seatPos(ti, ti === myIndex ? SEAT_R - 0.35 : SEAT_R)).setY(0.02);
    // テーブルカードの札
    sign.visible = !!st.tableRank && st.phase !== "lobby" && st.phase !== "finished";
    if (st.tableRank && st.tableRank !== signRank) { signRank = st.tableRank; signMat.map = cardFace(st.tableRank); signMat.needsUpdate = true; }
    // 場のカード: 山(伏せ) + 直前に出たカード(出した人の前)
    const lp = st.lastPlay, rv = (st.phase === "reveal" || st.phase === "shot") ? st.reveal : null;
    const inPlay = rv ? rv.cards.length : lp ? lp.count : 0;
    const pileN = st.phase === "lobby" || st.phase === "finished" ? 0 : Math.max(0, st.pile - inPlay);
    if (pileN !== pileShown) {
      pileGroup.clear();
      for (let i = 0; i < pileN; i++) { const c = makeCard(null); c.position.set((Math.random() - .5) * .18, TABLE_Y + 0.035 + i * 0.007, (Math.random() - .5) * .18); c.rotation.y = Math.random() * Math.PI; pileGroup.add(c); }
      pileShown = pileN;
    }
    const pk = lp && !rv ? `${lp.by}|${lp.count}|${st.pile}` : "";
    const rk = rv ? `${rv.by}|${rv.cards.map((c) => c.id).join()}` : "";
    if (pk !== playKey || rk !== revealKey) {
      const wasSame = rk && rk === revealKey;
      playKey = pk; revealKey = rk;
      if (!wasSame) playGroup.clear();
      const by = rv ? rv.by : lp?.by, n = rv ? rv.cards.length : lp ? lp.count : 0;
      const bi = seatOf(by);
      if (n && bi >= 0 && !wasSame) {
        const dir = seatPos(bi, 1).normalize(), side = new THREE.Vector3(-dir.z, 0, dir.x);
        const center = dir.clone().multiplyScalar(0.62);
        const from = dir.clone().multiplyScalar(1.3);
        for (let k = 0; k < n; k++) {
          const c = makeCard(rv ? rv.cards[k].r : null);
          const to = center.clone().addScaledVector(side, (k - (n - 1) / 2) * 0.24);
          c.rotation.y = Math.atan2(dir.x, dir.z);
          playGroup.add(c);
          if (rv) {
            // 公開: 置いてある場所で少し浮かせてからめくる
            c.position.copy(to).setY(TABLE_Y + 0.04);
            setTimeout(() => tween(600, (t) => { const e = ease(t); c.position.y = TABLE_Y + 0.04 + Math.sin(e * Math.PI) * 0.25; c.rotation.z = e * Math.PI; }), 900 + k * 220);
          } else {
            // 出した人の手元からテーブルへすべり込む(1枚ずつ少し遅らせる)
            c.position.copy(from).setY(TABLE_Y + 0.05);
            const delay = k * 90, dur = 380;
            tween(dur + delay, (t) => { const e = ease(Math.max(0, Math.min(1, (t * (dur + delay) - delay) / dur))); c.position.lerpVectors(from, to, e).setY(TABLE_Y + 0.04 + Math.sin(e * Math.PI) * 0.15); });
          }
        }
      }
    }
    // リボルバー: ふだんはテーブルの上、公開/結果のときは撃たれる人の頭に向ける
    const tgt = rv ? rv.target : null;
    if (tgt !== gunTarget) {
      gunTarget = tgt;
      if (tgt && tgt === meId) lookFront();
      const fromP = gun.position.clone(), fromQ = gun.quaternion.clone();
      const toObj = new THREE.Object3D();
      if (tgt && seatOf(tgt) >= 0) {
        const hp = headPos(tgt);
        const dir = hp.clone().setY(0).normalize();
        // 自分が撃たれるときは画面の手前に銃口が向く
        // 真正面から銃口を向けると黒い棒に見えるので、少し斜め(横向き寄り)にする
        const at = seatOf(tgt) === myIndex ? camera.position.clone().add(new THREE.Vector3(-1.8, -0.4, 0)) : hp;
        // 自分のときはテーブルの上(少し右)に浮かせて、こちら(カメラ)に向ける
        toObj.position.copy(seatOf(tgt) === myIndex ? new THREE.Vector3(0.22, TABLE_Y + 0.42, SEAT_R - 1.0) : hp.clone().addScaledVector(dir, -0.55).add(new THREE.Vector3(0, 0.05, 0)).addScaledVector(new THREE.Vector3(-dir.z, 0, dir.x), 0.18));
        toObj.lookAt(at);
      } else {
        toObj.position.set(0.35, TABLE_Y + 0.07, 0.25);
        toObj.rotation.set(0, 0.6, Math.PI / 2);
      }
      tween(700, (t) => { const e = ease(t); gun.position.lerpVectors(fromP, toObj.position, e); gun.quaternion.slerpQuaternions(fromQ, toObj.quaternion, e); });
    }
    // 撃った瞬間の演出
    const sk = st.phase === "shot" ? `${st.round}|${st.shot.target}|${st.shot.pulls}` : "";
    if (sk && sk !== lastSig) {
      lastSig = sk;
      const r = robots.get(st.shot.target);
      if (st.shot.died) {
        flashLight.position.copy(gun.position); flashLight.intensity = 40; muzzle.material.opacity = 1;
        tween(500, (t) => { flashLight.intensity = 40 * (1 - t); muzzle.material.opacity = 1 - t; });
        tween(260, (t) => { gun.rotateX(-0.012 * (1 - t)); });
      } else if (r) { setMood(r, "Surprised"); tween(250, (t) => { gun.rotateX(-0.004 * (1 - t)); }); }
    }
  }

  // ---- 描画ループ ----
  const clock = new THREE.Clock();
  const v = new THREE.Vector3();
  function frame() {
    requestAnimationFrame(frame);
    if (!visible || document.hidden) return;
    const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
    for (const r of robots.values()) r.mixer.update(dt);
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i], t = Math.min(1, (now - tw.t0) / tw.dur);
      tw.step(t);
      if (t >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
    }
    sign.rotation.y += dt * 0.6;
    sign.position.y = TABLE_Y + 0.62 + Math.sin(now / 600) * 0.03;
    if (ring.visible) ring.material.color.setHSL(0.12, 0.85, 0.5 + Math.sin(now / 250) * 0.15);
    const f = 1 - Math.pow(0.0001, dt); // 首の動きをなめらかに追いつかせる
    look.yaw += (look.tYaw - look.yaw) * f; look.pitch += (look.tPitch - look.pitch) * f;
    aimCamera();
    frontBtn.hidden = !seatedNow() || (Math.abs(look.tYaw) < 0.15 && Math.abs(look.tPitch - PITCH0) < 0.15);
    // 吹き出しを頭の上へ
    const rect = host.getBoundingClientRect();
    for (const [id, b] of bubbles) {
      if (b.until < now) { b.el.remove(); bubbles.delete(id); continue; }
      if (seatOf(id) === myIndex || seatOf(id) < 0) { b.el.style.left = "50%"; b.el.style.top = "88%"; continue; }
      // 名札のすぐ下(頭の上)に出す。舞台の外にはみ出さないように端で止める
      v.copy(headPos(id)).setY(1.62).project(camera);
      b.el.hidden = v.z > 1; // カメラの後ろ(見ていない方向)の人の吹き出しは出さない
      b.el.style.left = Math.min(rect.width - 60, Math.max(60, (v.x + 1) / 2 * rect.width)) + "px";
      b.el.style.top = Math.max(44, (1 - v.y) / 2 * rect.height) + "px";
    }
    renderer.render(scene, camera);
  }
  function resize() {
    const w = host.clientWidth, hh = host.clientHeight;
    if (!w || !hh) return;
    renderer.setSize(w, hh, false);
    camera.aspect = w / hh;
    placeCamera();
  }
  new ResizeObserver(resize).observe(host);
  resize();
  frame();
  // ゲームの初期状態でも銃はテーブルの上に置いておく
  gun.position.set(0.35, TABLE_Y + 0.07, 0.25); gun.rotation.set(0, 0.6, Math.PI / 2);

  return {
    update,
    stamp,
    setVisible(b) {
      visible = b; canvas.style.display = b ? "block" : "none";
      if (!b) { for (const x of bubbles.values()) x.el.remove(); bubbles.clear(); }
    },
  };
}

connect();
</script>
<script src="/js/partybar.js" defer></script>
</body>
</html>
