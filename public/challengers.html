<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チャレンジャーズ（Challengers!風）</title>
<meta name="description" content="毎ラウンド5枚からカードを選んでデッキを育て、1対1の旗の取り合い(自動で進む)で勝ってファンを集める。7ラウンド後、ファンの多い2人で決勝。">
<meta name="theme-color" content="#3446c4">
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="あそびば">
<meta property="og:type" content="website">
<meta property="og:site_name" content="みんなのあそびば">
<meta property="og:title" content="チャレンジャーズ（Challengers!風）">
<meta property="og:description" content="毎ラウンド5枚からカードを選んでデッキを育て、1対1の旗の取り合い(自動で進む)で勝ってファンを集める。7ラウンド後、ファンの多い2人で決勝。">
<meta property="og:image" content="%%ORIGIN%%/icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上=部屋と進行、中央=描く/見る/答え合わせ、下=プレイヤーと招待 */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4;
  --ink: #181b23; --gold: #f2c14e; --good: #1f8a4c; --bad: #c4323a;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947; --accent: #8f9cff; --good: #5fd28f; --bad: #ff7b82; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(32px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 999px; border: 1.5px solid var(--fg); font-size: 12px; font-weight: 700; background: var(--surface); white-space: nowrap; }
button.pill { cursor: pointer; font-family: var(--body); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.status { font-size: 13px; color: var(--muted); } .status.warn { color: var(--bad); }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.banner { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--fg); color: var(--surface); font-size: 13px; font-weight: 700; text-align: center; z-index: 30; }
a { color: var(--accent); }
body.playing .top h1 { font-size: 18px; } body.playing .top .eyebrow { display: none; }
.login { max-width: 460px; margin: 6vh auto 0; } .login .panel { gap: 16px; }
.or { text-align: center; font-size: 12px; color: var(--muted); }
.code { font-family: var(--display); letter-spacing: .15em; text-transform: uppercase; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 6px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { background: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.big { font-size: 17px; padding: 11px 22px; }
button.tiny { padding: 3px 9px; font-size: 12px; }
input[type=text] { font-family: var(--body); font-size: 16px; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.settings select { width: 100%; min-width: 0; }
.say { font-family: var(--display); font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
.say.good { color: var(--good); } .say.red { color: var(--bad); }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cd { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; } .cd.low { color: var(--bad); }
.chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #181b23; border: 1.5px solid #181b23; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.word { font-family: var(--display); font-size: 18px; }
.need { display: inline-block; font-family: var(--display); font-size: 18px; padding: 0 8px; border-radius: 6px; background: var(--gold); color: var(--ink); }

/* カード */
.cards { display: flex; flex-wrap: wrap; gap: 6px; }
.card { position: relative; display: grid; grid-template-rows: auto auto 1fr; gap: 2px; width: 104px; min-height: 132px; padding: 6px 6px 6px 10px; border: 2px solid #181b23; border-radius: 8px; background: #fffaf0; color: #181b23; text-align: left; font-family: var(--body); box-shadow: inset 5px 0 0 var(--sc); }
button.card { cursor: pointer; } button.card:hover { transform: translateY(-2px); }
.card.small { width: 76px; min-height: 64px; padding: 4px 4px 4px 8px; }
.card.sel { outline: 3px solid var(--accent); outline-offset: 1px; background: #eef1ff; }
.card.flag { box-shadow: inset 5px 0 0 var(--sc), 0 0 0 3px #f2c14e; }
.card .pw { position: absolute; top: 3px; right: 5px; font-family: var(--display); font-size: 20px; line-height: 1; } .card.small .pw { font-size: 16px; }
.card .pw.up { color: #1f8a4c; } .card .pw.down { color: #c4323a; }
.card .nm { font-weight: 700; font-size: 13px; padding-right: 22px; line-height: 1.2; } .card.small .nm { font-size: 11px; }
.card .st { font-size: 11px; color: #596070; } .card .tx { font-size: 10.5px; line-height: 1.35; color: #3a3f4b; }
.card .badge { position: absolute; bottom: 3px; right: 4px; font-size: 11px; font-weight: 700; background: #181b23; color: #fff; padding: 0 5px; border-radius: 999px; }
/* マッチ */
.side { display: grid; gap: 6px; padding: 8px; border: 2px solid var(--line); border-radius: 10px; }
.side.attacking { border-color: #d0463f; } .side .who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.side .row { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: start; } .side .lbl { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 4px; }
.play { display: flex; flex-wrap: wrap; gap: 4px; }
.bench { display: grid; grid-template-columns: repeat(6, minmax(0, 76px)); gap: 4px; }
.bench .card.small { width: 100%; }
.seat0 { min-height: 64px; border: 2px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.flagtag { font-weight: 700; color: #b07800; } .atk { font-weight: 700; color: #d0463f; }
.center { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: center; padding: 6px; font-weight: 700; }
.center.win { color: var(--good); } .center.lose { color: var(--bad); }
.num { font-family: var(--display); font-size: 24px; font-weight: 400; }
.prompt { border: 2px solid var(--accent); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.log { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); display: grid; gap: 1px; max-height: 160px; overflow: auto; }
.rank { width: 100%; border-collapse: collapse; font-size: 14px; } .rank td { padding: 4px 6px; border-bottom: 1px solid var(--line); } .rank td.n { text-align: right; white-space: nowrap; } .rank tr.me td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
h3 { font-size: 14px; margin: 6px 0 0; }
@media (max-width: 520px) { .card { width: 96px; } .card.small { width: 64px; min-height: 58px; } .bench { grid-template-columns: repeat(6, minmax(0, 1fr)); } .side .row { grid-template-columns: 1fr; } }
/* プレイヤー */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.players li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.players li:last-child { border-bottom: none; }
.sw2 { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--fg); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; color: var(--accent); }
.pinfo { font-size: 12px; color: var(--muted); white-space: nowrap; }
.off { opacity: .5; }
.kick { grid-column: 2 / -1; justify-self: start; }
.invite { display: flex; gap: 6px; } .invite input { font-size: 13px; } .invite button { white-space: nowrap; flex: none; }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; }
.stamps button { padding: 4px 11px; font-size: 13px; border-radius: 999px; border-color: var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--surface); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; animation: pop .25s ease-out; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
/* スマホ: 前の絵を小さめにして横に並べ、画用紙まで1画面に収める */
@media (max-width: 520px) {
  .taskrow { grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
  .inputs input[type=text] { padding: 5px 8px; }
  .inputs .field { font-size: 12px; }
  body.playing .top h1 { font-size: 16px; }
  .panel { padding: 10px; gap: 8px; }
  .say { font-size: 17px; }
  .drawtools .sw { width: 24px; height: 24px; }
}
</style>
</head>
<body>
<div class="banner" id="banner" hidden></div>

<div class="login" id="login">
  <div class="wrap">
    <div><div class="eyebrow">デッキを育てて、旗を奪い合うトーナメント</div><h1>チャレンジャーズ <small style="font-size:.55em;font-family:var(--body);font-weight:700;opacity:.75;white-space:nowrap">（Challengers!）</small></h1></div>
    <form class="panel" id="loginForm">
      <label class="field">ニックネーム<input type="text" id="lName" maxlength="12" autocomplete="nickname" placeholder="例: たろう"></label>
      <label class="field">部屋コード(友達から聞いたコード)<input type="text" id="lRoom" class="code" maxlength="6" autocomplete="off" placeholder="ABCD"></label>
      <div class="btns"><button class="primary" type="submit" id="lJoin">この部屋に入る</button></div>
      <div class="or">または</div>
      <div class="btns"><button type="button" id="lCreate">新しい部屋を作る</button><span class="muted small">部屋コードが自動で決まります</span></div>
      <p class="status" id="lMsg" aria-live="polite"></p>
    </form>
    <p class="small muted"><a href="/">← ゲームを選ぶ</a></p>
  </div>
</div>

<div class="wrap" id="game" hidden>
  <div class="top">
    <div><div class="eyebrow">デッキを育てて、旗を奪い合うトーナメント</div><h1>チャレンジャーズ <small style="font-size:.55em;font-family:var(--body);font-weight:700;opacity:.75;white-space:nowrap">（Challengers!）</small></h1></div>
    <div class="meta" id="meta"></div>
  </div>
  <main class="panel" id="main"></main>
  <aside class="panel" id="side"></aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};
const COLORS = ["#e8574f", "#f0a03c", "#e6d14a", "#5cc46a", "#4d9de0", "#a46ee0", "#ee7fc0", "#5fd0c8"];

// ---- 端末ごとの保存(本人確認用ID・名前・音はほかのゲームと共通) ----
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function rnd(n, chars = "abcdefghijklmnopqrstuvwxyz0123456789") { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map((x) => chars[x % chars.length]).join(""); }
let ident = store.get("tier:ident");
if (!ident || !ident.pid || !ident.token) { ident = { pid: rnd(16), token: rnd(32) }; store.set("tier:ident", ident); }

let ws = null, retry = 0, everOpen = false, wantRoom = null, myName = "", joined = false;
let S = null, me = null, offset = 0;

// ---- 効果音 ----
const Sound = {
  ctx: null, on: store.get("tier:sound") !== false,
  setOn(v) { this.on = v; store.set("tier:sound", v); if (v) { this.unlock(); this.play("tap"); } },
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch {} },
  seq: { tap: [[880, 0, .06]], join: [[660, 0, .08], [880, .08, .12]], turn: [[784, 0, .1], [988, .1, .1], [1318, .2, .18]], done: [[1046, 0, .07]],
    reveal: [[392, 0, .14], [523, .14, .14], [659, .28, .14], [1046, .42, .4]], tick: [[1000, 0, .05]] },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== "running") return;
    const t0 = this.ctx.currentTime, soft = name === "tick" || name === "done";
    for (const [f, s, d] of this.seq[name] || []) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = soft ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + s); g.gain.exponentialRampToValueAtTime(soft ? 0.05 : 0.14, t0 + s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
      o.connect(g).connect(this.ctx.destination); o.start(t0 + s); o.stop(t0 + s + d + 0.02);
    }
  },
};
document.addEventListener("pointerdown", () => Sound.unlock());
document.addEventListener("keydown", () => Sound.unlock());

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/challengers/ws");
  const slow = setTimeout(() => showBanner("サーバを起動しています。初回は1分ほどかかることがあります…"), 2500);
  ws.onopen = () => { clearTimeout(slow); retry = 0; everOpen = true; showBanner(""); if (wantRoom) send({ t: "join", room: wantRoom, name: myName, pid: ident.pid, token: ident.token }); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "joined") {
      joined = true; store.set("challengers:last", { room: m.room, name: myName }); saveName(myName);
      history.replaceState(null, "", "/challengers?room=" + m.room);
      $("login").hidden = true; $("game").hidden = false;
    } else if (m.t === "db") { DB = m; if (S) render();
    } else if (m.t === "state") {
      const prev = S; S = m.room; me = m.me; offset = m.now - Date.now();
      onTransition(prev, S); render();
    } else if (m.t === "stamp") { const t = S?.stamps?.[m.i]; if (t) toast(`${nameOf(m.from)}「${t}」`); }
    else if (m.t === "kicked") backToLogin("ホストによって部屋から退出しました", true);
    else if (m.t === "error") { if (!joined) { $("lMsg").textContent = m.msg; $("lMsg").classList.add("warn"); wantRoom = null; setLoginBusy(false); } else flash(m.msg, true); }
    else if (m.t === "info") flash(m.msg);
  };
  ws.onclose = () => { clearTimeout(slow); if (joined || wantRoom) showBanner(everOpen ? "接続が切れました。再接続しています…" : "サーバに接続しています…"); setTimeout(connect, Math.min(8000, 800 * 2 ** retry++)); };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function showBanner(t) { $("banner").textContent = t; $("banner").hidden = !t; }
let flashT;
function flash(msg, warn) { const el = $("flashMsg"); if (!el) return toast(msg); el.textContent = msg; el.classList.toggle("warn", !!warn); clearTimeout(flashT); flashT = setTimeout(() => { el.textContent = ""; }, 6000); }
function toast(t) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const el = h("div", { class: "toast", role: "status" }, t); document.body.append(el); setTimeout(() => el.remove(), 2500); }

function saveName(name) { const t = store.get("tier:last") || { room: "" }; store.set("tier:last", { ...t, name }); }
function setLoginBusy(b) { $("lJoin").disabled = b; $("lCreate").disabled = b; }
function backToLogin(msg, warn) {
  joined = false; wantRoom = null; S = null; 
  store.set("challengers:last", { room: "", name: myName });
  history.replaceState(null, "", "/challengers");
  document.body.classList.remove("playing");
  $("game").hidden = true; $("login").hidden = false; setLoginBusy(false);
  $("lMsg").textContent = msg || ""; $("lMsg").classList.toggle("warn", !!warn);
}
function enter(code) {
  const name = $("lName").value.trim().slice(0, 12);
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  const msg = $("lMsg"); msg.classList.add("warn");
  if (!name) { msg.textContent = "ニックネームを入れてください"; return; }
  if (code.length < 4) { msg.textContent = "部屋コードは4〜6文字の英数字です"; return; }
  msg.classList.remove("warn"); msg.textContent = "入室しています…";
  myName = name; wantRoom = code; setLoginBusy(true);
  send({ t: "join", room: code, name, pid: ident.pid, token: ident.token });
}
$("loginForm").addEventListener("submit", (e) => { e.preventDefault(); enter($("lRoom").value); });
$("lCreate").addEventListener("click", () => { const c = rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"); $("lRoom").value = c; enter(c); });
{
  const last = store.get("challengers:last"), name = last?.name || store.get("tier:last")?.name;
  const q = new URLSearchParams(location.search).get("room");
  if (name) $("lName").value = name;
  if (q) $("lRoom").value = q.toUpperCase().slice(0, 6);
  if (last?.name && q && last.room === q.toUpperCase()) { myName = last.name; wantRoom = last.room; $("lMsg").textContent = "前回の部屋に戻っています…"; setLoginBusy(true); }
}

// ---- 共通 ----
let DB = { cards: {}, sets: {}, robot: "robot" };
const player = (id) => S?.players.find((p) => p.id === id);
const nameOf = (id) => (id === DB.robot ? "ロボット" : player(id)?.name || "退出した人");
const colorOf = (id) => { if (id === DB.robot) return "#9aa3b2"; const o = S.game?.seats; let i = o ? o.indexOf(id) : -1; if (i < 0) i = S.players.findIndex((p) => p.id === id); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
const chip = (id) => h("span", { class: "chip", style: `background:${colorOf(id)}` }, nameOf(id) + (id === me ? "(あなた)" : ""));
const isGM = () => S.gameHostId === me;
const secLeft = (t) => (t ? Math.max(0, Math.ceil((t - (Date.now() + offset)) / 1000)) : null);
let local = { sel: new Set(), order: [], view: null, promptKey: "" };

// カード
function cardEl(c, opt = {}) {
  const d = DB.cards[c.k] || { name: "?", set: "city", power: 0, text: "" }, st = DB.sets[d.set] || {};
  const p = c.p != null ? c.p : d.power;
  const el = h(opt.onclick ? "button" : "div", { type: opt.onclick ? "button" : null, class: "card" + (opt.sel ? " sel" : "") + (opt.small ? " small" : "") + (opt.flag ? " flag" : ""), style: `--sc:${st.color || "#888"}`, onclick: opt.onclick || null, title: d.text || "", "aria-pressed": opt.onclick ? (opt.sel ? "true" : "false") : null },
    h("span", { class: "pw" + (p > d.power ? " up" : p < d.power ? " down" : "") }, p),
    h("span", { class: "nm" }, d.name), h("span", { class: "st" }, (st.icon || "") + " " + (c.lv || "")),
    !opt.small && d.text ? h("span", { class: "tx" }, d.text) : null,
    opt.badge ? h("span", { class: "badge" }, opt.badge) : null);
  return el;
}

function onTransition(prev, cur) {
  if (!prev || prev.code !== cur.code) return;
  if (cur.players.length > prev.players.length) Sound.play("join");
  const g = cur.game, pg = prev.game;
  if (!g || !pg) return;
  if (g.phase !== pg.phase) Sound.play(g.phase === "deck" ? "turn" : g.phase === "match" || g.phase === "final" ? "done" : "reveal");
  const mm = g.matches.find((m) => m.a === me || m.b === me), pm = pg.matches.find((m) => m.id === mm?.id);
  if (mm && pm && mm.flag !== pm.flag && mm.flag) Sound.play(mm.flag === me ? "tap" : "tick");
  if (mm?.prompt?.mine && !pm?.prompt?.mine) Sound.play("turn");
  if (mm?.winner && !pm?.winner) Sound.play(mm.winner === me ? "reveal" : "tick");
}

function render() {
  if (!S) return;
  document.body.classList.toggle("playing", S.phase !== "lobby");
  renderMeta(); renderSide(); renderMain();
}
function renderMeta() {
  const m = $("meta"); m.replaceChildren();
  m.append(h("button", { type: "button", class: "pill", "aria-pressed": Sound.on ? "true" : "false", onclick: () => { Sound.setOn(!Sound.on); render(); } }, Sound.on ? "音 ON" : "音 OFF"),
    h("span", { class: "pill" }, "部屋 ", h("span", { class: "code" }, S.code)));
  const g = S.game;
  if (g) m.append(h("span", { class: "pill" }, g.phase === "final" || g.phase === "finalTrim" ? "決勝" : `ラウンド ${g.round}/7`));
}
function renderSide() {
  const side = $("side"); side.replaceChildren();
  const g = S.game;
  if (g) {
    side.append(h("h2", {}, "順位(ファン)"));
    const rows = g.humans.map((id) => {
      const tr = g.trophies[id], known = tr.every((t) => t.fans != null);
      const total = g.totals ? g.totals[id] : g.fans[id] + tr.reduce((n, t) => n + (t.fans || 0), 0);
      return { id, total, known, tr };
    }).sort((x, y) => y.total - x.total);
    side.append(h("table", { class: "rank" }, h("tbody", {}, ...rows.map((r) => h("tr", { class: r.id === me ? "me" : "" },
      h("td", {}, chip(r.id)), h("td", { class: "n" }, `🏆${r.tr.length}`),
      h("td", { class: "n" }, g.totals || r.id === me ? `${r.total}人` : `${g.fans[r.id]}人+?`))))),
      h("p", { class: "small muted" }, g.totals ? "ファン = 効果で得たファン + トロフィーのファン" : "トロフィーのファン数は本人にしか見えません(最後に公開)。"));
    if (g.robot) side.append(h("p", { class: "small muted" }, "ロボットが入っています(人数が奇数のため)。ロボットが勝ったトロフィーは箱に戻ります。"));
  } else {
    side.append(h("h2", {}, "プレイヤー"));
    const ul = h("ul", { class: "players" });
    for (const p of S.players) {
      const nm = h("span", { class: "pname" }, p.name + (p.id === me ? "(あなた)" : ""));
      if (p.id === S.gameHostId) nm.append(h("span", { class: "tag" }, "ホスト"));
      const li = h("li", { class: p.connected ? "" : "off" }, h("span", { class: "sw2", style: `background:${colorOf(p.id)}` }), nm, h("span", { class: "pinfo" }, p.connected ? "" : "切断中"));
      if (isGM() && p.id !== me) li.append(h("span", { class: "kick" }, twoStep("退出させる", () => send({ t: "kick", id: p.id }), "ghost danger tiny")));
      ul.append(li);
    }
    side.append(ul);
  }
  const link = location.origin + "/challengers?room=" + S.code;
  const inp = h("input", { type: "text", value: link, readonly: true, "aria-label": "招待リンク", onfocus: (e) => e.target.select() });
  side.append(h("div", { class: "field" }, "招待リンク(友達に送る)", h("div", { class: "invite" }, inp, h("button", { type: "button", class: "ghost", onclick: (e) => {
    const b = e.currentTarget; navigator.clipboard?.writeText(link).then(() => { b.textContent = "コピー済"; setTimeout(() => (b.textContent = "コピー"), 1500); }).catch(() => inp.select());
  } }, "コピー"))));
  side.append(h("div", { class: "stamps", role: "group", "aria-label": "一言スタンプ" }, ...S.stamps.map((t, i) => h("button", { type: "button", onclick: () => send({ t: "stamp", i }) }, t))));
  if (g?.log?.length) side.append(h("details", {}, h("summary", { class: "small" }, "記録"), h("ul", { class: "log" }, ...[...g.log].reverse().map((t) => h("li", {}, t)))));
  const btns = h("div", { class: "btns" });
  if (S.phase !== "lobby" && isGM()) btns.append(twoStep("待機画面に戻す", () => send({ t: "reset" })));
  btns.append(twoStep("部屋を出る", () => { send({ t: "leave" }); backToLogin(""); }));
  side.append(btns, h("p", { class: "small muted" }, h("a", { href: "/" }, "← ゲームを選ぶ")), h("p", { class: "status", id: "flashMsg" }));
}
function twoStep(label, action, cls = "ghost danger") {
  let armed = false, t;
  const b = h("button", { class: cls, type: "button" }, label);
  b.onclick = () => { if (!armed) { armed = true; b.textContent = "もう一度押すと実行"; t = setTimeout(() => { armed = false; b.textContent = label; }, 3000); return; } clearTimeout(t); action(); };
  return b;
}
const act = (a, x = {}) => send({ t: "game", a, ...x });
const cdEl = (t) => { const r = secLeft(t); return r == null ? null : h("span", { class: "cd" + (r <= 10 ? " low" : ""), "data-dl": t }, r + "秒"); };

function renderMain() {
  const main = $("main"); main.replaceChildren();
  if (S.phase === "lobby") return renderLobby(main);
  const g = S.game; if (!g) return;
  if (S.phase === "finished" || g.phase === "end") return renderEnd(main, g);
  if (!g.seats.includes(me)) main.append(h("p", { class: "muted small" }, "観戦中です。"));
  if (g.phase === "deck" || g.phase === "finalTrim") return renderDeck(main, g);
  renderMatches(main, g);
}

// ---- デッキフェイズ ----
function deckGroups(cards) {
  const m = new Map(); for (const c of cards) { const k = c.k; if (!m.has(k)) m.set(k, []); m.get(k).push(c); }
  return [...m.values()].sort((x, y) => (DB.cards[y[0].k].power - DB.cards[x[0].k].power));
}
function renderDeck(main, g) {
  const d = g.draft;
  main.append(h("div", { class: "head" }, h("div", { class: "say" }, g.phase === "finalTrim" ? "決勝の前: デッキを削れます" : `ラウンド ${g.round}: デッキフェイズ`), cdEl(g.deadline)));
  const waiting = g.seats.filter((id) => !g.draftDone[id]);
  if (!d || !g.seats.includes(me)) { main.append(h("p", { class: "muted" }, "みんながカードを選んでいます…")); return; }
  if (d.step === "choose") {
    main.append(h("p", {}, "どの山から選びますか？"), h("div", { class: "btns" }, ...d.opts.map(([lv, n], i) => h("button", { type: "button", class: "big primary", onclick: () => act("opt", { i }) }, `レベル${lv} の山から ${n}枚`))));
  } else if (d.step === "pick") {
    main.append(h("p", {}, `5枚から選んでデッキに入れる(あと ${d.need - d.picks}枚)。`, h("span", { class: "muted small" }, " カードを押すと選びます")),
      h("div", { class: "cards" }, ...d.display.map((c) => cardEl(c, { onclick: () => act("pick", { id: c.id }) }))),
      h("div", { class: "btns" }, h("button", { type: "button", disabled: d.redrawn, onclick: () => act("redraw") }, d.redrawn ? "引き直し済み" : "全部捨てて引き直す(1回だけ)")));
  } else if (d.step === "extra") {
    main.append(h("p", {}, `デッキから ${d.removeFor}枚を除外すると、もう1枚選べます(除外したカードはゲームから取り除かれます)。`),
      selectList(g.myDeck, d.removeFor, d.removeFor),
      h("div", { class: "btns" }, h("button", { type: "button", class: "primary", onclick: () => { act("extra", { ids: [...local.sel] }); local.sel.clear(); } }, `${d.removeFor}枚除外して、もう1枚選ぶ`),
        h("button", { type: "button", onclick: () => { act("extra"); local.sel.clear(); } }, "しない")));
  } else if (d.step === "trim") {
    main.append(h("p", {}, "デッキから外したいカードを選んで「決定」(外さなくてもOK)。"), selectList(g.myDeck, 0, g.myDeck.length - 1),
      h("div", { class: "btns" }, h("button", { type: "button", class: "primary big", onclick: () => { act("trim", { ids: [...local.sel] }); local.sel.clear(); } }, local.sel.size ? `${local.sel.size}枚外して決定` : "このデッキで決定")),
      h("p", { class: "small muted" }, "ヒント: ベンチは6席(同じ名前は同じ席)。種類が多すぎると、ベンチがいっぱいで負けやすくなります。"));
  } else {
    main.append(h("p", {}, "決定しました。ほかの人を待っています: ", ...waiting.map((id) => chip(id))));
  }
  if (g.myDeck && d.step !== "trim" && d.step !== "extra") main.append(h("h3", {}, `あなたのデッキ(${g.myDeck.length}枚・${deckGroups(g.myDeck).length}種類)`), h("div", { class: "cards" }, ...deckGroups(g.myDeck).map((grp) => cardEl(grp[0], { small: true, badge: grp.length > 1 ? "×" + grp.length : null }))));
}
function selectList(cards, min, max) {
  const box = h("div", { class: "cards" });
  for (const c of [...cards].sort((x, y) => DB.cards[y.k].power - DB.cards[x.k].power)) {
    const on = local.sel.has(c.id);
    box.append(cardEl(c, { small: true, sel: on, onclick: () => { if (on) local.sel.delete(c.id); else if (local.sel.size < max) local.sel.add(c.id); render(); } }));
  }
  return box;
}

// ---- マッチ ----
function renderMatches(main, g) {
  const mine = g.matches.find((m) => m.a === me || m.b === me);
  // 見るマッチ: ラウンドが変わったら自分のマッチへ。自分が選ぶ番のときも自分のマッチへ
  const key = g.phase + ":" + g.round;
  if (local.viewKey !== key || !g.matches.some((m) => m.id === local.view) || mine?.prompt?.mine) { local.viewKey = key; local.view = (mine || g.matches[0])?.id ?? 0; }
  const m = g.matches.find((x) => x.id === local.view);
  main.append(h("div", { class: "head" }, h("div", { class: "say" }, g.phase === "final" ? "🏆 決勝" : `ラウンド ${g.round}: マッチ`),
    g.matches.length > 1 ? h("div", { class: "btns" }, ...g.matches.map((x) => h("button", { type: "button", class: "tiny" + (x.id === local.view ? " primary" : " ghost"), onclick: () => { local.view = x.id; render(); } }, `${nameOf(x.a)} vs ${nameOf(x.b)}` + (x.winner ? " ✓" : "")))) : null));
  if (!m) return;
  const meSide = m.a === me || m.b === me ? me : m.a, other = meSide === m.a ? m.b : m.a;
  main.append(sideEl(g, m, other, true), centerEl(g, m), sideEl(g, m, meSide, false));
  if (m.prompt?.mine) main.append(promptEl(m));
  else if (m.prompt) main.append(h("p", { class: "small muted" }, `${nameOf(m.prompt.who)} さんが選んでいます…`));
  if (m.log.length) main.append(h("ul", { class: "log" }, ...[...m.log].reverse().map((t) => h("li", {}, t))));
}
function sideEl(g, m, id, top) {
  const s = m.sides[id], flag = m.flag === id;
  const seats = h("div", { class: "bench" });
  for (let i = 0; i < 6; i++) { const b = s.bench[i]; seats.append(b ? cardEl({ k: b.k, lv: b.lv[0] }, { small: true, badge: b.n > 1 ? "×" + b.n : null }) : h("div", { class: "seat0" }, i + 1)); }
  const play = h("div", { class: "play" });
  if (s.park) play.append(cardEl(s.park.top, { flag, badge: s.park.under ? `下に${s.park.under}枚` : null }));
  for (const c of s.rev) play.append(cardEl(c, {}));
  return h("div", { class: "side" + (top ? " opp" : " mine") + (m.attacker === id && !m.winner ? " attacking" : "") },
    h("div", { class: "who" }, chip(id), flag ? h("span", { class: "flagtag" }, "🚩旗") : m.attacker === id ? h("span", { class: "atk" }, "⚔️攻撃中") : null,
      h("span", { class: "small muted" }, `デッキ${s.deck}・消耗${s.exhaust}` + (s.next2 ? "・次+2" : "") + ` ・🏆${g.trophies[id].length}`)),
    h("div", { class: "row" }, h("div", { class: "lbl" }, "場"), play.childNodes.length ? play : h("span", { class: "muted small" }, "なし")),
    h("div", { class: "row" }, h("div", { class: "lbl" }, `ベンチ ${s.bench.length}/6`), seats));
}
function centerEl(g, m) {
  if (m.winner) return h("div", { class: "center " + (m.winner === me ? "win" : m.a === me || m.b === me ? "lose" : "") }, `${nameOf(m.winner)} の勝ち！(${m.why})`,
    m.final ? null : h("span", { class: "small" }, m.winner === me ? ` ラウンド${g.round}のトロフィー獲得` : ""));
  return h("div", { class: "center" }, h("span", {}, "攻撃 ", h("b", { class: "num" }, m.atk), " / 守り ", h("b", { class: "num" }, m.def)),
    h("span", { class: "small muted" }, "攻撃が守り以上になると旗を取る"));
}
function promptEl(m) {
  const p = m.prompt, key = p.kind + p.cards.map((c) => c.id).join();
  if (key !== local.promptKey) { local.promptKey = key; local.sel = new Set(); local.order = []; }
  const box = h("div", { class: "prompt" }, h("div", { class: "head" }, h("b", {}, p.title), cdEl(p.deadline)));
  const one = p.kind === "topBottom" || p.kind === "deckOne";
  if (p.kind === "order") {
    box.append(h("p", { class: "small" }, "上に来る順にカードを押してください。"), h("div", { class: "cards" }, ...p.cards.map((c) => { const i = local.order.indexOf(c.id); return cardEl(c, { small: true, sel: i >= 0, badge: i >= 0 ? `${i + 1}番目` : null, onclick: () => { if (i >= 0) local.order.splice(i, 1); else local.order.push(c.id); render(); } }); })),
      h("div", { class: "btns" }, h("button", { type: "button", class: "primary", disabled: local.order.length !== p.cards.length, onclick: () => act("answer", { ids: local.order }) }, "この順で決定"), h("button", { type: "button", onclick: () => act("answer", {}) }, "おまかせ")));
  } else {
    box.append(h("div", { class: "cards" }, ...p.cards.map((c) => cardEl(c, { small: true, sel: local.sel.has(c.id), onclick: () => { if (one) { local.sel = new Set([c.id]); } else if (local.sel.has(c.id)) local.sel.delete(c.id); else if (local.sel.size < (p.max || 1)) local.sel.add(c.id); render(); } }))),
      h("div", { class: "btns" }, h("button", { type: "button", class: "primary", disabled: one ? local.sel.size !== 1 : local.sel.size < (p.min || 0), onclick: () => act("answer", { ids: [...local.sel] }) }, "決定"),
        h("button", { type: "button", onclick: () => act("answer", {}) }, "おまかせ")));
  }
  return box;
}

function renderEnd(main, g) {
  const r = g.result || {};
  main.append(h("div", { class: "say good" }, `🏆 ${nameOf(r.winner)} さんの優勝！`));
  if (g.final) main.append(h("p", {}, `決勝: ${nameOf(g.final.a)} vs ${nameOf(g.final.b)}`));
  const rows = g.humans.map((id) => ({ id, total: g.totals?.[id] ?? 0, tr: g.trophies[id] })).sort((x, y) => (y.id === r.winner) - (x.id === r.winner) || (y.id === r.second) - (x.id === r.second) || y.total - x.total);
  main.append(h("table", { class: "rank" }, h("tbody", {}, ...rows.map((x, i) => h("tr", { class: x.id === me ? "me" : "" }, h("td", {}, `${i + 1}位`), h("td", {}, chip(x.id)), h("td", { class: "n" }, `ファン ${x.total}人`), h("td", { class: "n small" }, x.tr.map((t) => `R${t.round}:${t.fans}`).join(" ")))))));
  main.append(h("div", { class: "btns" }, h("button", { class: "primary", type: "button", onclick: () => send({ t: "again" }) }, "待機画面に戻る")));
}

function renderLobby(main) {
  const st = S.settings, gm = isGM();
  const sel = (label, key, opts) => h("label", { class: "field" }, label, h("select", { disabled: !gm, onchange: (e) => {
    const o = opts.find((x) => String(x[0]) === e.target.value); send({ t: "settings", s: { [key]: o[0] } });
  } }, ...opts.map(([v, t]) => h("option", { value: String(v), selected: st[key] === v }, t))));
  const live = S.players.filter((p) => p.connected).length;
  const setOpts = [["random", "ランダム"], ...Object.entries(DB.sets).filter(([k]) => k !== "city").map(([k, v]) => [k, `${v.icon} ${v.name}`])];
  main.append(h("h2", {}, "遊び方"),
    h("ol", { class: "rules" },
      h("li", {}, "全7ラウンド。毎ラウンド、山から5枚見てカードを選び(1回だけ引き直せる)、デッキに入れます。いらないカードはデッキから外せます。"),
      h("li", {}, "マッチは1対1で自動で進みます。旗を持っていない側がデッキの上から1枚ずつ出し、合計が旗のカード以上になったら旗を奪います。"),
      h("li", {}, "旗を奪われたカードはベンチへ。ベンチは6席(同じ名前は同じ席)。席が足りなくなるか、攻撃でデッキが尽きたら負け。勝つとトロフィー(ファン)をもらえます。"),
      h("li", {}, "7ラウンド後、ファンの多い2人で決勝！ 2人で遊ぶときは決勝なしで、ファンが多い方の勝ち(11人差がついたらその場で勝ち)。")),
    h("div", { class: "settings" },
      sel("使わないセット(6つから1つ外す)", "exclude", setOpts),
      sel("デッキフェイズの時間", "deckSecs", [[120, "120秒"], [90, "90秒"], [180, "180秒"]]),
      sel("マッチの速さ", "speed", [["normal", "ふつう"], ["fast", "速い"], ["slow", "ゆっくり"]])),
    h("p", { class: "muted small" }, "2〜8人(奇数のときはロボットが入ります)。約30〜45分。本家のおすすめ: 初めてなら「宇宙」を外す。"));
  if (gm) main.append(h("div", { class: "btns" }, h("button", { class: "primary big", type: "button", disabled: live < 2, onclick: () => send({ t: "start" }) }, "スタート"),
    h("span", { class: "muted small" }, live < 2 ? "招待リンクを友達に送ってください。2人以上で始められます" : live > 8 ? "先に入った8人で始めます(ほかの人は観戦)" : `${live}人で始められます`)));
  else main.append(h("p", { class: "muted" }, `ホストの ${nameOf(S.gameHostId)} さんがスタートするのを待っています。`));
}

// 残り時間の表示だけを書き換える
setInterval(() => {
  if (!S) return;
  document.querySelectorAll("#main .cd[data-dl]").forEach((el) => { const r = secLeft(+el.dataset.dl); el.textContent = r + "秒"; el.classList.toggle("low", r <= 10); });
}, 250);

connect();
</script>
