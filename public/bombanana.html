<script>
const { $, h, store, rnd, Sound, twoStep, saveName, COLORS, player, nameOf, isGM, remaining, send, chip } = TG; // 全ページ共通の部品(public/js/common.js)

// ---- 端末ごとの保存(本人確認用ID・名前・音はほかのゲームと共通) ----
let ident = store.get("tier:ident");
if (!ident || !ident.pid || !ident.token) { ident = { pid: rnd(16), token: rnd(32) }; store.set("tier:ident", ident); }

let ws = null, retry = 0, everOpen = false, wantRoom = null, myName = "", joined = false;
let S = null, me = null, offset = 0;

// ---- 効果音 ----
document.addEventListener("pointerdown", () => Sound.unlock());
document.addEventListener("keydown", () => Sound.unlock());

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/bombanana/ws");
  const slow = setTimeout(() => showBanner("サーバを起動しています。初回は1分ほどかかることがあります…"), 2500);
  ws.onopen = () => { clearTimeout(slow); retry = 0; everOpen = true; showBanner(""); if (wantRoom) send({ t: "join", room: wantRoom, name: myName, pid: ident.pid, token: ident.token }); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "joined") {
      joined = true; store.set("bombanana:last", { room: m.room, name: myName }); saveName(myName);
      history.replaceState(null, "", "/bombanana?room=" + m.room);
      $("login").hidden = true; $("game").hidden = false;
    } else if (m.t === "state") {
      const prev = S; S = m.room; me = m.me; offset = m.now - Date.now();

const NOTE = [0, 262, 294, 330, 349, 392, 440, 494];
function playFx(f) {
  const T = (a, b, c, d, e) => Sound.tone(a, b, c, d, e);
  switch (f.kind) {
    case "chime": T(1318, 0, 0.3); T(1760, 0.14, 0.45); break;
    case "morse": { let t = 0; for (const ch of f.code || "") { const d = ch === "-" ? 0.33 : 0.11; T(700, t, d, "sine", 0.14); t += d + 0.12; } break; }

    case "beep": T(f.tone || 880, 0, 0.15, "square", 0.06); break;
    case "click": T(2200, 0, 0.03, "square", 0.04); break;
    case "snip": T(3000, 0, 0.04, "sawtooth", 0.05); T(1800, 0.04, 0.05, "sawtooth", 0.05); break;
    case "hiss": Sound.noise(0.35, 0.12, 4000); break;
    case "strike": T(150, 0, 0.45, "sawtooth", 0.16); T(110, 0.05, 0.5, "sawtooth", 0.12); break;
    case "solved": T(988, 0, 0.12); T(1318, 0.1, 0.25); break;
    case "clear": [523, 659, 784, 1046].forEach((x, i) => T(x, i * 0.12, 0.35, "triangle", 0.14)); break;
    case "boom": { // 爆発: 低い衝撃+だんだん消える轟音

    }

    case "banana": T(500, 0, 0.12, "triangle"); T(320, 0.4, 0.15, "triangle"); break;
    case "alarm": for (let i = 0; i < 4; i++) { T(880, i * 0.5, 0.25, "square", 0.07); T(660, i * 0.5 + 0.25, 0.25, "square", 0.07); } break;

let noiseSrc = null, lastTick = 0, lastHiss = 0, tickTock = false;
function loopSounds() {
  const g = S?.game, play = g && g.step === "play" && S.phase === "play";
  const wantNoise = play && g.hazard?.noise && canHear() && Sound.on;
  if (wantNoise && !noiseSrc) { noiseSrc = Sound.noise(60, 0.18, 2500); }

  if (play && canHear() && g.bomb) {
    const left = g.bomb.end - (Date.now() + offset), gap = left < 30000 ? 500 : 1000;
    // 時計: チク・タクを交互に(残り30秒からは速く高く)
    if (Date.now() - lastTick >= gap) { lastTick = Date.now(); tickTock = !tickTock; Sound.tone(left < 30000 ? 1700 : tickTock ? 1250 : 950, 0, 0.025, "square", 0.035); }

// ---- ボイスチャット(WebRTC)。声が届く向きだけつなぐ: 見ざる→言わざる、聞かざる→見ざる・言わざる ----
const Voice = {

    const g = S?.game; if (g) for (const id of g.order) if (id !== me && (HEARS[myRole()] || []).includes(g.role[id])) send({ t: "rtc", to: id, data: { hello: 1 } });

  },
  disable() {

  },
  sync() {
    if (!this.on) return;

    if (!this.stream) return;
    for (const id of g.order) if (id !== me && (HEARS[g.role[id]] || []).includes(my) && !this.pcs[id]) this.call(id);
  },
  mk(id) {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

    pc.ontrack = (e) => {
      const g = S?.game; if (!g || !(HEARS[myRole()] || []).includes(g.role[id])) return;

  main.append(h("p", { class: "muted small" }, "ちょうど3人で遊びます(4人目からは観戦)。声は文字で送れます(🎤で音声入力・読み上げあり)。ボイスチャットもつなげます。PCならヘッドホン推奨。"));
  if (gm) main.append(h("div", { class: "btns" }, h("button", { class: "primary big", type: "button", disabled: live < 3, onclick: () => send({ t: "start" }) }, "スタート"),
    h("span", { class: "muted small" }, live < 3 ? `あと${3 - live}人必要です。招待リンクを送ってください` : live > 3 ? "先に入った3人で始めます(ほかの人は観戦)" : "3人そろいました！")));
  else main.append(h("p", { class: "muted" }, `ホストの ${nameOf(S.gameHostId)} さんがスタートするのを待っています。`));
}
setInterval(() => { if (S?.game && S.phase !== "lobby") { drawHud(); drawOverlay(); drawCaps(); } }, 250);

connect();
</script>
<script src="/js/partybar.js" defer></script>
</body>
