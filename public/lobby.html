<!doctype html>

<meta property="og:title" content="パーティー（みんなで移動）｜みんなのあそびば">
<meta property="og:description" content="先にみんなで集まって、ホストが選んだゲームへ全員でいっしょに移動。いろんなゲームを続けて遊べるパーティー機能です。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* パーティーの画面: 先に集まってから、ホストが選んだゲームへみんなで移動する */
:root {
  --bg: #e9ecf2; --surface: #ffffff; --fg: #181b23; --muted: #596070; --line: #cfd4de; --accent: #3446c4; --gold: #f2c14e; --good: #1f8a4c; --bad: #c4323a;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #13151b; --surface: #1d2029; --fg: #eceef4; --muted: #a1a7b6; --line: #343947; --accent: #8f9cff; --good: #5fd28f; --bad: #ff7b82; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 36px); line-height: 1.2; margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.status { font-size: 13px; color: var(--muted); } .status.warn { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font-family: var(--body); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 6px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { background: var(--bg); } button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--fg); color: var(--surface); } button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ghost { border-color: var(--line); font-weight: 500; } button.danger { color: var(--bad); border-color: var(--bad); }
input[type=text] { font-family: var(--body); font-size: 16px; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 100%; }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.code { font-family: var(--display); letter-spacing: .15em; text-transform: uppercase; }
.big { font-family: var(--display); font-size: 34px; letter-spacing: .2em; }
.members { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.members li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.members li.off { opacity: .55; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
.games button { text-align: left; display: grid; gap: 2px; padding: 10px 12px; }
.games button .n { font-family: var(--display); font-weight: 400; font-size: 16px; line-height: 1.25; }
.games button .r { font-size: 12px; color: var(--muted); font-weight: 500; }
.games button.out { opacity: .55; }
.games button { position: relative; } .games button.voted { border-color: var(--accent); border-width: 3px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.games .vc { position: absolute; top: -8px; right: -6px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; }
button.tiny { padding: 3px 9px; font-size: 12px; }
.rank { width: 100%; border-collapse: collapse; font-size: 14px; } .rank td { padding: 4px 6px; border-bottom: 1px solid var(--line); } .rank tr.me td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.hist { margin: 4px 0 0; padding-left: 1.2em; display: grid; gap: 2px; }
.now { padding: 10px 12px; border-radius: 10px; border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 20%, var(--surface)); }
.invite { display: flex; gap: 6px; } .invite button { white-space: nowrap; flex: none; }
.games button .d { font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.45; }
.codeRow { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; }
.qr { display: grid; justify-items: center; gap: 6px; } .qr img { background: #fff; padding: 8px; border-radius: 10px; width: 200px; height: 200px; }
.members li { flex-wrap: wrap; align-items: center; } .mright { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.rename { display: flex; gap: 6px; align-items: center; } .rename input { width: 9em; padding: 4px 8px; font-size: 15px; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div><div class="eyebrow">先に集まって、いろんなゲームをみんなで続けて遊ぶ</div><h1>パーティー</h1></div>

  <form class="panel" id="joinBox" hidden>
    <p class="small" style="margin:0">パーティーを作って友達を招待すると、ホストが選んだゲームへ全員の画面がいっしょに移動します。ゲームが終わったら、次のゲームへまたみんなで移動できます。</p>
    <label class="field">ニックネーム<input type="text" id="jName" maxlength="12" autocomplete="nickname" placeholder="例: たろう"></label>
    <label class="field">パーティーのコード(友達から聞いた4文字)<input type="text" id="jCode" class="code" maxlength="4" autocomplete="off" placeholder="ABCD"></label>
    <div class="btns"><button class="primary" type="submit" id="jJoin">このパーティーに入る</button><button type="button" id="jCreate">新しいパーティーを作る</button></div>
    <p class="status" id="jMsg" aria-live="polite"></p>
  </form>

  <main class="panel" id="partyBox" hidden></main>
  <p class="small muted"><a href="/">← ゲームを選ぶ(ホーム)</a></p>
</div>
<script src="/js/partybar.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
};
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const P = window.Party;
const q = new URLSearchParams(location.search).get("code");
$("jName").value = store.get("tier:last")?.name || "";
if (q) $("jCode").value = q.toUpperCase().slice(0, 4);
// 招待リンクで来た人は、前のパーティーではなくそのパーティーへ
if (q && P.info && P.info.code !== q.toUpperCase()) P.leave();

function start(code, create) {
  const name = $("jName").value.trim().slice(0, 12), msg = $("jMsg");
  msg.classList.add("warn");
  if (!name) { msg.textContent = "ニックネームを入れてください"; return; }
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  if (code.length !== 4) { msg.textContent = "パーティーのコードは4文字の英数字です"; return; }
  msg.classList.remove("warn"); msg.textContent = create ? "パーティーを作っています…" : "入っています…";
  const t = store.get("tier:last") || { room: "" }; store.set("tier:last", { ...t, name });
  history.replaceState(null, "", "/lobby?code=" + code);
  P.start(code, name, create);
}
$("joinBox").addEventListener("submit", (e) => { e.preventDefault(); start($("jCode").value, false); });
$("jCreate").addEventListener("click", () => { const a = new Uint8Array(4); crypto.getRandomValues(a); start([...a].map((x) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x % 32]).join(""), true); });

// 画面の状態(作り直しても保つもの): 記録を開いているか・抜けるボタンの確認・名前変更中・QRコード
const ui = { histOpen: false, leaveArmed: 0, renaming: false, qr: false, sig: "", kickArmed: null };
const CAT_JA = { talk: "推理・話し合い", bluff: "ブラフ・度胸", draw: "お絵かき", board: "ボードゲーム", mini: "ミニゲーム" };
function render() {
  const st = P.state, info = P.info;
  $("joinBox").hidden = !!info;
  $("partyBox").hidden = !info;
  if (!info && P.error) { $("jMsg").textContent = P.error; $("jMsg").classList.add("warn"); }
  if (!info) { ui.sig = ""; return; }
  const box = $("partyBox");
  if (!st) { box.replaceChildren(h("p", { class: "muted" }, "パーティーにつないでいます…")); ui.sig = ""; return; }
  // 同じ内容なら作り直さない(開いた記録が閉じたり、入力中の文字が消えたりしないように)
  const sig = JSON.stringify([st, P.me, ui.renaming, ui.qr, ui.kickArmed, Date.now() - ui.leaveArmed < 3000]);
  if (sig === ui.sig) return; ui.sig = sig;
  const draft = $("rnIn")?.value;
  box.replaceChildren();
  const host = P.isHost();
  const live = st.members.filter((m) => m.connected), n = live.length;
  const link = location.origin + "/lobby?code=" + st.code;
  const inp = h("input", { type: "text", value: link, readonly: true, "aria-label": "招待リンク", onfocus: (e) => e.target.select() });
  box.append(h("div", { class: "codeRow" }, h("div", {}, h("div", { class: "small muted" }, "パーティーのコード"), h("div", { class: "big" }, st.code)),
      h("button", { type: "button", class: "ghost", "aria-expanded": String(ui.qr), onclick: () => { ui.qr = !ui.qr; render(); } }, ui.qr ? "QRコードを閉じる" : "📱 QRコード")),
    ui.qr ? h("div", { class: "qr" }, h("img", { src: "/qr.svg?t=" + encodeURIComponent(link), alt: "招待リンクのQRコード", width: 200, height: 200 }), h("p", { class: "small muted", style: "margin:0" }, "同じ場所にいる友達は、スマホのカメラでこのQRコードを読み取るだけで入れます。")) : "",
    h("div", { class: "field" }, "招待リンク(友達に送る)", h("div", { class: "invite" }, inp, h("button", { type: "button", class: "ghost", onclick: (e) => {
      const b = e.currentTarget; navigator.clipboard?.writeText(link).then(() => { b.textContent = "コピー済"; setTimeout(() => (b.textContent = "コピー"), 1500); }).catch(() => inp.select());
    } }, "コピー"))));
  const gname = (k) => (st.games.find((x) => x.key === k) || {}).name || k;
  // メンバー: つながっている人を先に。切断中の人は30分で自動で外れる
  const mem = [...st.members].sort((a, b) => b.connected - a.connected);
  box.append(h("h2", {}, `メンバー(${n}人${st.members.length > n ? `・ほか切断中${st.members.length - n}人` : ""})`), h("ul", { class: "members" }, ...mem.map((m) => {
    const mine = m.id === P.me;
    const nameEl = mine && ui.renaming
      ? h("form", { class: "rename", onsubmit: (e) => { e.preventDefault(); P.rename($("rnIn").value); ui.renaming = false; render(); } },
          h("input", { type: "text", id: "rnIn", maxlength: 12, value: draft ?? m.name, "aria-label": "新しいニックネーム" }), h("button", { type: "submit", class: "tiny primary" }, "保存"), h("button", { type: "button", class: "tiny ghost", onclick: () => { ui.renaming = false; render(); } }, "やめる"))
      : h("span", {}, m.name + (m.id === st.host ? " 👑ホスト" : "") + (mine ? "(あなた)" : ""), mine ? h("button", { type: "button", class: "tiny ghost", style: "margin-left:6px", onclick: () => { ui.renaming = true; render(); setTimeout(() => $("rnIn")?.focus(), 0); } }, "名前を変える") : null);
    const acts = [];
    if (host && !mine && m.connected) acts.push(h("button", { type: "button", class: "tiny ghost", onclick: () => P.giveHost(m.id) }, "ホストを渡す"));
    if (host && !mine) acts.push(h("button", { type: "button", class: "tiny ghost danger", onclick: () => { if (ui.kickArmed !== m.id) { ui.kickArmed = m.id; render(); setTimeout(() => { if (ui.kickArmed === m.id) { ui.kickArmed = null; render(); } }, 3000); return; } ui.kickArmed = null; P.kick(m.id); } }, ui.kickArmed === m.id ? "もう一度で外す" : "外す"));
    return h("li", { class: m.connected ? "" : "off" }, nameEl,
      h("span", { class: "small muted mright" }, m.connected ? (m.where ? gname(m.where) + "で遊んでいる" : mine ? "" : "この画面にいる") : "切断中(30分で自動で外れます)", ...acts));
  })));
  // 通算成績(遊んだゲームの順位点: 1位3点・2位2点・3位1点)
  const sc = Object.entries(st.scores || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => b.pts - a.pts || b.wins - a.wins);
  if (sc.length) {
    let rank = 0;
    box.append(h("h2", {}, "通算成績"), h("table", { class: "rank" }, h("tbody", {}, ...sc.map((r, i) => {
      if (!i || r.pts !== sc[i - 1].pts) rank = i + 1;
      return h("tr", { class: r.id === P.me ? "me" : "" }, h("td", {}, rank === 1 ? "👑1位" : `${rank}位`), h("td", {}, r.name), h("td", {}, h("b", {}, `${r.pts}点`)), h("td", { class: "small muted" }, `${r.games}ゲーム・1位${r.wins}回`));
    }))), h("p", { class: "small muted", style: "margin:0" }, "このパーティーで遊んだゲームの順位点(1位3点・2位2点・3位1点)の合計。協力ゲームは成功したら全員1位扱い、失敗は0点。"));
    if (st.history.length) {
      const det = h("details", { open: ui.histOpen, ontoggle: (e) => { ui.histOpen = e.target.open; } }, h("summary", { class: "small" }, `これまでのゲーム(${st.history.length})`),
        h("ul", { class: "hist small" }, ...[...st.history].reverse().map((x) => h("li", {}, h("b", {}, x.game), x.note ? `(${x.note})` : "", " … ", x.res.map((r) => `${r.rank ? r.rank + "位" : ""}${r.name}${r.pts ? "+" + r.pts : ""}`).join("・")))));
      box.append(det);
    }
  }
  if (st.game && st.game.key) box.append(h("div", { class: "now" }, `いまのゲーム: ${st.game.name} `, h("button", { type: "button", onclick: () => { location.href = `${st.game.path}?room=${st.game.roomCode}&party=1`; } }, "そのゲームへ行く")));
  // 次に遊ぶゲーム: 全員に一覧を見せる。ホスト=押すと移動 / ほか=「やりたい👍」 / 投票モード=投票
  const vote = st.mode === "vote", votes = st.votes || {}, myVote = votes[P.me], wants = st.wants || {}, myWant = wants[P.me];
  const count = {}; for (const k of Object.values(votes)) count[k] = (count[k] || 0) + 1;
  const wcount = {}; for (const k of Object.values(wants)) wcount[k] = (wcount[k] || 0) + 1;
  const voted = Object.keys(votes).length;
  box.append(h("h2", {}, "次に遊ぶゲーム"));
  if (host) box.append(h("div", { class: "btns small" }, "決め方: ", h("button", { type: "button", class: "tiny" + (vote ? " ghost" : " primary"), onclick: () => P.setMode("host") }, "ホストが選ぶ"), h("button", { type: "button", class: "tiny" + (vote ? " primary" : " ghost"), onclick: () => P.setMode("vote") }, "みんなで投票")));
  const fits = (g) => n >= g.min && n <= g.max;
  const games = [...st.games].sort((a, b) => fits(b) - fits(a) || (wcount[b.key] || 0) - (wcount[a.key] || 0));
  const people = (g) => (g.min === g.max ? `${g.min}人` : `${g.min}〜${g.max}人`);
  const gameBtn = (g) => {
    const on = vote ? myVote === g.key : !host && myWant === g.key;
    return h("button", { type: "button", class: (fits(g) ? "" : "out") + (on ? " voted" : ""), "aria-pressed": vote || !host ? String(on) : null,
      onclick: () => vote ? P.vote(myVote === g.key ? null : g.key) : host ? P.pick(g.key) : P.want(g.key) },
      h("span", { class: "n" }, g.name),
      h("span", { class: "r" }, people(g) + (g.time ? `・約${g.time}分` : "") + (g.cat && CAT_JA[g.cat] ? `・${CAT_JA[g.cat]}` : "") + (n < g.min ? "(人数が足りない)" : n > g.max ? "(多い人は観戦)" : "")),
      g.desc ? h("span", { class: "d" }, g.desc) : null,
      vote && count[g.key] ? h("span", { class: "vc" }, `${count[g.key]}票`) : !vote && wcount[g.key] ? h("span", { class: "vc" }, `👍${wcount[g.key]}`) : null);
  };
  if (vote) {
    box.append(h("p", { class: "small muted", style: "margin:0" }, `遊びたいゲームに投票してください(押し直すと変えられます)。全員が投票すると、いちばん多いゲームに決まって移動します(同数ならその中からランダム)。いま ${voted}/${n}人が投票。`));
    if (host) box.append(h("div", { class: "btns" }, h("button", { type: "button", class: "primary", disabled: !voted, onclick: () => P.decide() }, "投票を締め切って決める"), h("span", { class: "small muted" }, "ホストは投票の途中でも締め切れます")));
  } else if (host) box.append(h("p", { class: "small muted", style: "margin:0" }, "押すと、メンバー全員の画面がそのゲームの部屋へいっしょに移動します(遊んでいる途中の人は、そのゲームが終わってから)。👍はメンバーの「やりたい」の数です。"));
  else box.append(h("p", { class: "small muted", style: "margin:0" }, `次のゲームはホストの ${st.members.find((m) => m.id === st.host)?.name || ""} さんが選びます(選ばれると自動で移動)。やりたいゲームを押すと「やりたい👍」がホストに伝わります。`));
  box.append(h("div", { class: "games" }, ...games.map(gameBtn)));
  const leaving = Date.now() - ui.leaveArmed < 3000;
  box.append(h("div", { class: "btns" }, h("button", { type: "button", class: "ghost danger", onclick: () => {
    if (!leaving) { ui.leaveArmed = Date.now(); render(); setTimeout(render, 3100); return; }
    ui.leaveArmed = 0; P.leave(); history.replaceState(null, "", "/lobby"); $("jMsg").textContent = ""; render();
  } }, leaving ? "もう一度押すと抜けます" : "パーティーを抜ける")));
}
P.onChange(render);
render();
</script>
</body>
</html>
